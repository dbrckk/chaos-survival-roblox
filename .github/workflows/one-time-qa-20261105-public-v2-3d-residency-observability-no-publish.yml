# Post-public V2 LOT 0: authentic first-join 3D residency telemetry.
# Certify exact main SHA with real Roblox build & seven engine suites.
# Explicitly NEVER publish the public experience from this workflow.
name: One-time QA 2026-11-05 V2 Real Original 3D Residency No Publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-qa-20261105-public-v2-3d-residency-observability-no-publish.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: chaos-v2-public-3d-residency-telemetry-20261105
  cancel-in-progress: false
jobs:
  validate-exact-sha:
    if: github.repository == 'dbrckk/chaos-survival-roblox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing pulse owner, bounded original 3D metrics and first-join sampling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          shared=Path('src/shared/PerformancePulseRules.lua').read_text()
          client=Path('src/client/juice.client.lua').read_text()
          server=Path('src/server/init.server.lua').read_text()
          tests=Path('tests/engine/game-analytics.spec.luau').read_text()
          cloud=Path('.github/workflows/roblox-cloud-test.yml').read_text()
          docs=Path('docs/LOT0_PUBLIC_REAL_3D_RESIDENCY_OBSERVABILITY_2026-11-05.md').read_text()
          roadmap=Path('docs/ROADMAP_POST_PUBLIC_2026-11-05.md').read_text()
          assert 'function PerformancePulseRules.pulseInterval(first)' in shared
          assert 'return first == true and 12 or 45' in shared
          assert 'function PerformancePulseRules.original3DAnalytics(sample)' in shared
          assert 'result.arenaVariant = VALID_ARENA[source.arenaVariant]' in shared
          assert 'local flags = "P" .. presence(s.originalGround + s.originalRoutes)' in shared
          for key in ('originalGround','originalRoutes','originalHorizon','originalTraffic','originalHalo',
                      'originalHorizonMasked','originalHaloMasked','optionalPressure'):
              assert key in shared and (key+' = ') in client,key
          for sourceTag in (
              'LocalOriginalGroundMeshCount','LocalOriginalRouteMeshCount',
              'LocalOriginalCinematicHorizon3DCount','LocalOriginalCinematicTraffic3DCount',
              'LocalOriginalOrbitalHalo3DCount','LocalNativeCinematicHorizonPartsReplaced',
              'LocalOriginalOrbitalHaloNativeReplaced','OptionalVfxPressure',
          ):
              assert sourceTag in client,sourceTag
          assert 'if performancePulseClock >= PerformancePulseRules.pulseInterval(' in client
          assert 'firstPerformanceWindow = false' in client
          assert 'performancePulseEvent:FireServer(sample)' in client
          assert 'RateLimiter.new(45)' in server
          assert 'PerformancePulseRules.original3DAnalytics(sample)' in server
          assert '"ClientOriginal3DResidencyPulse"' in server
          assert '"ClientPerformancePulse"' in server
          assert '"ClientMemoryPulse"' in server
          assert 'reports genuine live 3D residency' in tests
          assert 'bounds untrusted visual residence samples' in tests
          assert 'samples initial 3D availability after 12 active seconds' in tests
          assert '"tests/engine/game-analytics.spec.luau"' in cloud
          assert '9033d6799885ac32cf88222bbd07edace82e9266' in docs
          assert 'LOT 0' in docs and 'NO PUBLISH' not in docs
          assert 'LOT0_PUBLIC_REAL_3D_RESIDENCY_OBSERVABILITY_2026-11-05.md' in roadmap
          assert 'RenderStepped:Connect' not in shared
          assert 'Instance.new(' not in shared
          print('Exact-source real model residency pulse verified: first 12s,'
                ' thereafter 45s; one established client sampler and server remote;'
                ' bounded five-world model counters and low-cardinality analytics.'
                ' No Roblox publish.',flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-v2-public-3d-residency-qa-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
