name: One-shot Premium Five-Arena Real 3D Floor Runtime Source Gate
on:
  push:
    branches: [feat/live-approved-3d-premium-arena-floor-20261103]
    paths: [.github/workflows/one-shot-live-3d-premium-ground-source-gate-20261103.yml]
permissions:
  contents: read
jobs:
  final-source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate original 3D source and validate real UV/tangent glTF
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_premium_ground_tile.py --output assets/source/chaos_premium_ground_tile.obj
          python3 tools/obj_to_gltf.py --source assets/source/chaos_premium_ground_tile.obj --materials assets/source/chaos_route_kit.mtl --output /tmp/chaos_ground.gltf
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/chaos_ground.gltf").read_text())
          faces=sum(x["accessors"][p["attributes"]["POSITION"]]["count"]//3 for p in x["meshes"][0]["primitives"])
          assert faces==2976,faces
          assert len(x["meshes"][0]["primitives"])==7
          ids=json.loads(Path("assets/source/roblox-asset-registry.json").read_text())["models"]
          approved=[p for p in ids if p["name"]=="premium_ground_tile"]
          assert len(approved)==1 and approved[0]["asset_id"]=="72507987666671"
          assert approved[0]["moderation"]=="Approved" and approved[0]["workflow_run_id"]==41622860616
          assert "72507987666671" in Path("src/server/PremiumRouteMeshAssets.lua").read_text()
          assert "PremiumGroundMeshKit.sync(arena" in Path("src/client/scenery-lod.client.lua").read_text()
          assert '"OriginalPremiumGroundMeshesLocal"' in Path("src/shared/VisualBudgetRules.lua").read_text()
          print("Approved real Roblox 3D ground package, runtime mapping, mobile budgets and 2976 triangles verified")
          PY
      - name: Pinned full Luau game and engine spec compilation
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          mkdir -p /tmp/luau && unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 | xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
      - name: Existing Android visual budget, full place and source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_mobile_vfx_first_frame.py
          curl -fLsS --retry 3 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          mkdir -p /tmp/rojo && unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          python3 tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel CANDIDATE
          /tmp/rojo/rojo build default.project.json -o /tmp/ChaosSurvival.rbxlx
          test -s /tmp/ChaosSurvival.rbxlx
          grep -Fq "$GITHUB_SHA" /tmp/ChaosSurvival.rbxlx
