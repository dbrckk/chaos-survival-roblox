name: Towers machinery animated cap and shrinking arena regression
on:
  pull_request:
    paths:
      - src/client/ApprovedVariantTowersLandmarkMeshKit.lua
      - src/client/arena-identity-motion.client.lua
      - src/shared/ArenaIdentityMotionRules.lua
      - src/server/MapBuilder.lua
      - tools/verify_towers_machinery_motion_shrink_lod.py
      - tools/verify_variant_towers_machinery_runtime.py
      - .github/workflows/towers-machinery-motion-shrink-regression.yml
  push:
    branches: [main]
    paths:
      - src/client/ApprovedVariantTowersLandmarkMeshKit.lua
      - src/client/arena-identity-motion.client.lua
      - src/shared/ArenaIdentityMotionRules.lua
      - src/server/MapBuilder.lua
      - tools/verify_towers_machinery_motion_shrink_lod.py
      - tools/verify_variant_towers_machinery_runtime.py
      - .github/workflows/towers-machinery-motion-shrink-regression.yml
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check real Towers cap and antenna animation against 3D LOD
        run: python3 tools/verify_towers_machinery_motion_shrink_lod.py
