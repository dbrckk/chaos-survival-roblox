name: Upload Original Chaos 3D Assets (Manual)

# Does NOT change the playable place or public experience. Creates a separate
# owned Roblox Model asset, only with explicit user confirmation.
on:
  # Reuse the same guarded uploader from an explicitly scoped one-shot
  # owner-import workflow. Manual Android flow stays unchanged.
  workflow_call:
    inputs:
      model:
        description: Source model name
        required: true
        type: string
      creator_kind:
        description: Roblox user or group ownership
        required: true
        type: string
      creator_id:
        description: Verified public creator ID
        required: true
        type: string
      dry_run:
        description: True to validate without importing
        required: true
        type: boolean
      confirmation:
        description: Exact upload acknowledgement
        required: false
        type: string
    secrets:
      ROBLOX_ASSET_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      model:
        description: Original 3D model to validate and upload
        type: choice
        required: true
        options:
          - reactor_spire
          - service_crane
          - perimeter_gate
          - plasma_foundry
          - sky_transit_exchange
          - orbital_halo_array
          - premium_jump_deck
          - premium_skybridge_module
          - premium_ground_tile
          - district_observatory
          - district_freight
          - district_turbine
          - district_aerial
          - skyfleet_carrier
          - underdeck_chassis
          - lobby_gate
          - sky_spine_crown
          - arena_keel
          - service_camera
          - service_maintenance
          - service_wayfinder
          - service_orbital
          - service_mooring
          - ambient_drone
          - ambient_lift
          - ambient_transit
          - ambient_satellite
          - ambient_cargo
          - relief_essential
          - relief_classic
          - relief_towers
          - relief_crossroads
          - relief_orbital
          - relief_harbor
          - floor_corner_guard
          - floor_anchor_bolt
          - floor_anchor_bolt_large
          - floor_harbor_tie
          - deck_carapace_classic
          - deck_carapace_towers
          - deck_carapace_crossroads
          - deck_carapace_orbital
          - deck_carapace_harbor
          - bridge_side_girder
          - column_classic
          - column_towers
          - column_crossroads
          - column_orbital
          - column_harbor
          - long_route_cradle
          - large_deck_hull
          - lobby_pylon_shell
          - harbor_promenade_portal
          - harbor_dock_caisson
          - harbor_freighter
          - harbor_gantry_container
          - harbor_gantry_drum
          - harbor_gantry_kinetic_container
          - harbor_gantry_kinetic_drum
          - harbor_hero_station
          - harbor_midground_barge
          - harbor_sea_apron
          - towers_cooling_spire
          - towers_cooling_stack
          - perimeter_rotor
          - perimeter_wing
          - perimeter_cap
          - perimeter_crossbrace
          - perimeter_generator_shield
          - perimeter_towers_apex
          - perimeter_orbital_apex
          - perimeter_crossroads_apex
          - perimeter_relay_apex
          - exterior_tower_21
          - exterior_tower_24
          - exterior_tower_27
          - exterior_tower_30
          - signature_orbital_reactor_ring
          - signature_towers_forged_bridge
          - signature_crossroads_forged_interchange
          - signature_harbor_sculpted_gantry
          - signature_classic_sculpted_observatory
          - signature_classic_forged_supports
          - south_orbital_observation_torus
          - south_towers_forged_skytransfer
          - south_towers_forged_lift_twins
          - south_towers_forged_finishing
          - south_crossroads_forged_exchange
          - south_orbital_forged_finishing
          - south_harbor_sculpted_drydock
          - south_classic_sculpted_observatory
          - exterior_ridges_nw
          - exterior_ridges_ne
          - exterior_ridges_sw
          - exterior_ridges_se
          - variant_towers_sculpted_machinery
          - variant_crossroads_forged_gantry
          - variant_classic_sculpted_broadcast_fin
          - variant_orbital_sculpted_node
          - variant_orbital_trussed_strut
          - variant_crossroads_sculpted_entrance_portal
      creator_kind:
        description: Asset ownership (used only when upload is enabled)
        type: choice
        required: true
        default: user
        options:
          - user
          - group
      creator_id:
        description: Numeric Roblox creator ID (required for real upload, optional for dry-run)
        type: string
        required: false
      dry_run:
        description: Convert/validate only, do not upload to Roblox
        type: boolean
        default: true
        required: true
      confirmation:
        description: For a real upload enter UPLOAD_CHAOS_ORIGINAL_3D
        type: string
        required: false

permissions:
  contents: read

# GitHub concurrency permits only ONE running and ONE pending job per group.
# Reusing one global group silently CANCELS queued parallel models, even with
# cancel-in-progress=false. Partition by creator and model to preserve all
# independent, nonduplicating original uploads.
concurrency:
  group: chaos-original-model-uploads-${{ inputs.creator_kind }}-${{ inputs.creator_id }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  import-model:
    name: Convert and optionally upload original glTF
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHOICE: ${{ inputs.model }}
      CREATOR_KIND: ${{ inputs.creator_kind }}
      CREATOR_ID: ${{ inputs.creator_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      CONFIRM: ${{ inputs.confirmation }}
      ASSET_API_KEY: ${{ secrets.ROBLOX_ASSET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact manual input and source identity
        shell: bash
        run: |
          set -euo pipefail
          case "$CHOICE" in
            reactor_spire|service_crane|perimeter_gate|plasma_foundry|sky_transit_exchange|orbital_halo_array|premium_jump_deck|premium_skybridge_module|premium_ground_tile|district_observatory|district_freight|district_turbine|district_aerial|skyfleet_carrier|underdeck_chassis|lobby_gate|sky_spine_crown|arena_keel|service_camera|service_maintenance|service_wayfinder|service_orbital|service_mooring|ambient_drone|ambient_lift|ambient_transit|ambient_satellite|ambient_cargo|relief_essential|relief_classic|relief_towers|relief_crossroads|relief_orbital|relief_harbor|floor_corner_guard|floor_anchor_bolt|floor_anchor_bolt_large|floor_harbor_tie|deck_carapace_classic|deck_carapace_towers|deck_carapace_crossroads|deck_carapace_orbital|deck_carapace_harbor|bridge_side_girder|column_classic|column_towers|column_crossroads|column_orbital|column_harbor|long_route_cradle|large_deck_hull|lobby_pylon_shell|harbor_promenade_portal|harbor_dock_caisson|harbor_freighter|harbor_gantry_container|harbor_gantry_drum|harbor_gantry_kinetic_container|harbor_gantry_kinetic_drum|harbor_hero_station|harbor_midground_barge|harbor_sea_apron|towers_cooling_spire|towers_cooling_stack|perimeter_rotor|perimeter_wing|perimeter_cap|perimeter_crossbrace|perimeter_generator_shield|perimeter_towers_apex|perimeter_orbital_apex|perimeter_crossroads_apex|perimeter_relay_apex|exterior_tower_21|exterior_tower_24|exterior_tower_27|exterior_tower_30|signature_orbital_reactor_ring|signature_towers_forged_bridge|signature_crossroads_forged_interchange|signature_harbor_sculpted_gantry|signature_classic_sculpted_observatory|signature_classic_forged_supports|south_orbital_observation_torus|south_towers_forged_skytransfer|south_towers_forged_lift_twins|south_towers_forged_finishing|south_crossroads_forged_exchange|south_orbital_forged_finishing|south_harbor_sculpted_drydock|south_classic_sculpted_observatory|exterior_ridges_nw|exterior_ridges_ne|exterior_ridges_sw|exterior_ridges_se|variant_towers_sculpted_machinery|variant_crossroads_forged_gantry|variant_classic_sculpted_broadcast_fin|variant_orbital_sculpted_node|variant_orbital_trussed_strut|variant_crossroads_sculpted_entrance_portal) ;;
            *) echo "::error::Unknown model"; exit 1 ;;
          esac
          case "$CREATOR_KIND" in
            user|group) ;;
            *) echo "::error::Invalid creator kind"; exit 1 ;;
          esac
          # A pure conversion / validation must run without credentials or
          # creator lookup; only an actual upload needs an owner ID.
          if [ "$DRY_RUN" != "true" ]; then
            if [[ ! "$CREATOR_ID" =~ ^[1-9][0-9]{0,15}$ ]]; then
              echo "::error::Real upload requires a positive numeric Roblox user or group ID."
              exit 1
            fi
            if [ "$CONFIRM" != "UPLOAD_CHAOS_ORIGINAL_3D" ]; then
              echo "::error::Explicit upload confirmation mismatch. No asset created."
              exit 1
            fi
            if [ -z "$ASSET_API_KEY" ]; then
              echo "::error::Missing secrets.ROBLOX_ASSET_API_KEY. Create a dedicated key scoped to Assets Read/Write for this Roblox creator; do not re-use a broader game-publishing key."
              exit 1
            fi
          fi
          # Perimeter Gate is authored with a separate four-color MTL.
          # Exporting it against the industrial palette fails material checks.
          if [ "$CHOICE" = "harbor_sea_apron" ]; then
            echo "CHAOS_MTL=assets/source/chaos_harbor_sea.mtl" >> "$GITHUB_ENV"
          elif [ "$CHOICE" = "perimeter_gate" ]; then
            echo "CHAOS_MTL=assets/source/chaos_perimeter_gate.mtl" >> "$GITHUB_ENV"
          elif [ "$CHOICE" = "premium_jump_deck" ] || [ "$CHOICE" = "premium_skybridge_module" ] || [ "$CHOICE" = "premium_ground_tile" ] || [[ "$CHOICE" == district_* ]] || [ "$CHOICE" = "skyfleet_carrier" ] || [ "$CHOICE" = "underdeck_chassis" ] || [ "$CHOICE" = "lobby_gate" ] || [ "$CHOICE" = "sky_spine_crown" ] || [ "$CHOICE" = "arena_keel" ] || [[ "$CHOICE" == service_* && "$CHOICE" != "service_crane" ]] || [[ "$CHOICE" == ambient_* ]] || [[ "$CHOICE" == relief_* ]] || [[ "$CHOICE" == floor_* ]] || [[ "$CHOICE" == deck_carapace_* ]] || [ "$CHOICE" = "bridge_side_girder" ] || [[ "$CHOICE" == column_* ]] || [ "$CHOICE" = "long_route_cradle" ] || [ "$CHOICE" = "large_deck_hull" ] || [ "$CHOICE" = "lobby_pylon_shell" ] || [ "$CHOICE" = "harbor_promenade_portal" ] || [ "$CHOICE" = "harbor_dock_caisson" ] || [ "$CHOICE" = "harbor_freighter" ] || [ "$CHOICE" = "harbor_gantry_container" ] || [ "$CHOICE" = "harbor_gantry_drum" ] || [ "$CHOICE" = "harbor_gantry_kinetic_container" ] || [ "$CHOICE" = "harbor_gantry_kinetic_drum" ] || [ "$CHOICE" = "harbor_hero_station" ] || [ "$CHOICE" = "harbor_midground_barge" ] || [ "$CHOICE" = "towers_cooling_spire" ] || [ "$CHOICE" = "towers_cooling_stack" ] || [ "$CHOICE" = "perimeter_rotor" ] || [ "$CHOICE" = "perimeter_wing" ] || [ "$CHOICE" = "perimeter_cap" ] || [ "$CHOICE" = "perimeter_crossbrace" ] || [ "$CHOICE" = "perimeter_generator_shield" ] || [[ "$CHOICE" == perimeter_*_apex ]] || [[ "$CHOICE" == exterior_tower_* ]] || [ "$CHOICE" = "signature_orbital_reactor_ring" ] || [ "$CHOICE" = "signature_towers_forged_bridge" ] || [ "$CHOICE" = "signature_crossroads_forged_interchange" ] || [ "$CHOICE" = "signature_harbor_sculpted_gantry" ] || [ "$CHOICE" = "signature_classic_sculpted_observatory" ] || [ "$CHOICE" = "signature_classic_forged_supports" ] || [ "$CHOICE" = "south_orbital_observation_torus" ] || [ "$CHOICE" = "south_towers_forged_skytransfer" ] || [ "$CHOICE" = "south_towers_forged_lift_twins" ] || [ "$CHOICE" = "south_towers_forged_finishing" ] || [ "$CHOICE" = "south_crossroads_forged_exchange" ] || [ "$CHOICE" = "south_orbital_forged_finishing" ] || [ "$CHOICE" = "south_harbor_sculpted_drydock" ] || [ "$CHOICE" = "south_classic_sculpted_observatory" ] || [[ "$CHOICE" == exterior_ridges_* ]] || [ "$CHOICE" = "variant_towers_sculpted_machinery" ] || [ "$CHOICE" = "variant_crossroads_forged_gantry" ] || [ "$CHOICE" = "variant_classic_sculpted_broadcast_fin" ] || [ "$CHOICE" = "variant_orbital_sculpted_node" ] || [ "$CHOICE" = "variant_orbital_trussed_strut" ] || [ "$CHOICE" = "variant_crossroads_sculpted_entrance_portal" ]; then
            echo "CHAOS_MTL=assets/source/chaos_route_kit.mtl" >> "$GITHUB_ENV"
          else
            echo "CHAOS_MTL=assets/source/chaos_industrial_materials.mtl" >> "$GITHUB_ENV"
          fi
          if [ "$CHOICE" = "premium_ground_tile" ]; then
            python3 tools/generate_premium_ground_tile.py --output assets/source/chaos_premium_ground_tile.obj
          elif [ "$CHOICE" = "lobby_gate" ]; then
            # Creator-authored 3D main portal, leaving passage and UI sign open.
            python3 tools/generate_original_lobby_gate.py \
              --output assets/source/chaos_lobby_gate.obj
          elif [ "$CHOICE" = "sky_spine_crown" ]; then
            python3 tools/generate_original_sky_spine_crown.py \
              --output assets/source/chaos_sky_spine_crown.obj
          elif [ "$CHOICE" = "arena_keel" ]; then
            # Creator-authored real triangulated under-arena keel; never a collider.
            python3 tools/generate_original_arena_keel.py \
              --output assets/source/chaos_arena_keel.obj
          elif [ "$CHOICE" = "underdeck_chassis" ]; then
            # Authored open-frame 3D sub-deck sculpture, never a gameplay Part.
            python3 tools/generate_original_underdeck_chassis.py \
              --output assets/source/chaos_underdeck_chassis.obj
          elif [ "$CHOICE" = "variant_orbital_sculpted_node" ]; then
            python3 tools/generate_original_variant_orbital_landmarks.py --model variant_orbital_sculpted_node --output assets/source/chaos_variant_orbital_sculpted_node.obj
          elif [ "$CHOICE" = "variant_crossroads_sculpted_entrance_portal" ]; then
            python3 tools/generate_original_variant_crossroads_entrance_portal.py --output assets/source/chaos_variant_crossroads_sculpted_entrance_portal.obj
          elif [ "$CHOICE" = "variant_orbital_trussed_strut" ]; then
            python3 tools/generate_original_variant_orbital_landmarks.py --model variant_orbital_trussed_strut --output assets/source/chaos_variant_orbital_trussed_strut.obj
          elif [ "$CHOICE" = "variant_classic_sculpted_broadcast_fin" ]; then
            python3 tools/generate_original_variant_classic_broadcast_fin.py --output assets/source/chaos_variant_classic_sculpted_broadcast_fin.obj
          elif [ "$CHOICE" = "variant_crossroads_forged_gantry" ]; then
            python3 tools/generate_original_variant_crossroads_gantry.py --output assets/source/chaos_variant_crossroads_forged_gantry.obj
          elif [ "$CHOICE" = "variant_towers_sculpted_machinery" ]; then
            python3 tools/generate_original_variant_towers_machinery.py --output assets/source/chaos_variant_towers_sculpted_machinery.obj
          elif [[ "$CHOICE" == exterior_ridges_* ]]; then
            python3 tools/generate_original_exterior_ridges.py --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [ "$CHOICE" = "south_classic_sculpted_observatory" ]; then
            python3 tools/generate_original_south_classic_observatory.py --output assets/source/chaos_south_classic_sculpted_observatory.obj
          elif [ "$CHOICE" = "south_harbor_sculpted_drydock" ]; then
            python3 tools/generate_original_south_harbor_drydock.py --output assets/source/chaos_south_harbor_sculpted_drydock.obj
          elif [ "$CHOICE" = "south_orbital_forged_finishing" ]; then
            python3 tools/generate_original_south_orbital_finishing.py --output assets/source/chaos_south_orbital_forged_finishing.obj
          elif [ "$CHOICE" = "south_crossroads_forged_exchange" ]; then
            python3 tools/generate_original_south_crossroads_exchange.py --output assets/source/chaos_south_crossroads_forged_exchange.obj
          elif [ "$CHOICE" = "south_towers_forged_finishing" ]; then
            python3 tools/generate_original_south_towers_finishing.py --output assets/source/chaos_south_towers_forged_finishing.obj
          elif [ "$CHOICE" = "south_towers_forged_lift_twins" ]; then
            python3 tools/generate_original_south_towers_lift_twins.py --output assets/source/chaos_south_towers_forged_lift_twins.obj
          elif [ "$CHOICE" = "south_towers_forged_skytransfer" ]; then
            python3 tools/generate_original_south_towers_skytransfer.py --output assets/source/chaos_south_towers_forged_skytransfer.obj
          elif [ "$CHOICE" = "south_orbital_observation_torus" ]; then
            python3 tools/generate_original_south_orbital_observation_ring.py --output assets/source/chaos_south_orbital_observation_torus.obj
          elif [ "$CHOICE" = "signature_classic_forged_supports" ]; then
            python3 tools/generate_original_signature_classic_supports.py --output assets/source/chaos_signature_classic_forged_supports.obj
          elif [ "$CHOICE" = "signature_classic_sculpted_observatory" ]; then
            python3 tools/generate_original_signature_classic_observatory.py --output assets/source/chaos_signature_classic_sculpted_observatory.obj
          elif [ "$CHOICE" = "signature_harbor_sculpted_gantry" ]; then
            python3 tools/generate_original_signature_harbor_gantry.py --output assets/source/chaos_signature_harbor_sculpted_gantry.obj
          elif [ "$CHOICE" = "signature_crossroads_forged_interchange" ]; then
            python3 tools/generate_original_signature_crossroads_interchange.py --output assets/source/chaos_signature_crossroads_forged_interchange.obj
          elif [ "$CHOICE" = "signature_towers_forged_bridge" ]; then
            python3 tools/generate_original_signature_towers_bridge.py --output assets/source/chaos_signature_towers_forged_bridge.obj
          elif [ "$CHOICE" = "signature_orbital_reactor_ring" ]; then
            python3 tools/generate_original_signature_orbital_ring.py --output assets/source/chaos_signature_orbital_reactor_ring.obj
          elif [[ "$CHOICE" == exterior_tower_* ]]; then
            python3 tools/generate_original_exterior_towers.py --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [[ "$CHOICE" == perimeter_*_apex ]]; then
            python3 tools/generate_original_perimeter_apex.py --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [ "$CHOICE" = "perimeter_crossbrace" ] || [ "$CHOICE" = "perimeter_generator_shield" ]; then
            python3 tools/generate_original_perimeter_structures.py --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [ "$CHOICE" = "perimeter_wing" ] || [ "$CHOICE" = "perimeter_cap" ]; then
            python3 tools/generate_original_perimeter_armor.py --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [ "$CHOICE" = "perimeter_rotor" ]; then
            python3 tools/generate_original_perimeter_rotor.py --output assets/source/chaos_perimeter_rotor.obj
          elif [ "$CHOICE" = "towers_cooling_stack" ]; then
            python3 tools/generate_original_towers_cooling_stack.py \
              --output assets/source/chaos_towers_cooling_stack.obj
          elif [ "$CHOICE" = "towers_cooling_spire" ]; then
            python3 tools/generate_original_towers_cooling_spire.py \
              --output assets/source/chaos_towers_cooling_spire.obj
          elif [ "$CHOICE" = "harbor_sea_apron" ]; then
            python3 tools/generate_original_harbor_sea.py \
              --output assets/source/chaos_harbor_sea_apron.obj
          elif [ "$CHOICE" = "harbor_midground_barge" ]; then
            python3 tools/generate_original_harbor_barge.py \
              --output assets/source/chaos_harbor_midground_barge.obj
          elif [ "$CHOICE" = "harbor_hero_station" ]; then
            python3 tools/generate_original_harbor_hero_station.py \
              --output assets/source/chaos_harbor_hero_station.obj
          elif [ "$CHOICE" = "harbor_gantry_container" ] || [ "$CHOICE" = "harbor_gantry_drum" ] || [ "$CHOICE" = "harbor_gantry_kinetic_container" ] || [ "$CHOICE" = "harbor_gantry_kinetic_drum" ]; then
            python3 tools/generate_original_harbor_gantry.py \
              --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [ "$CHOICE" = "harbor_freighter" ]; then
            python3 tools/generate_original_harbor_freighter.py \
              --output assets/source/chaos_harbor_freighter.obj
          elif [ "$CHOICE" = "harbor_dock_caisson" ]; then
            python3 tools/generate_original_harbor_dock_caisson.py \
              --output assets/source/chaos_harbor_dock_caisson.obj
          elif [ "$CHOICE" = "harbor_promenade_portal" ]; then
            python3 tools/generate_original_harbor_promenade_portal.py \
              --output assets/source/chaos_harbor_promenade_portal.obj
          elif [ "$CHOICE" = "lobby_pylon_shell" ]; then
            python3 tools/generate_original_lobby_pylon_shell.py \
              --output assets/source/chaos_lobby_pylon_shell.obj
          elif [ "$CHOICE" = "large_deck_hull" ]; then
            python3 tools/generate_original_large_deck_support.py \
              --model large_deck_hull --output assets/source/chaos_large_deck_hull.obj
          elif [[ "$CHOICE" == column_* ]] || [ "$CHOICE" = "long_route_cradle" ]; then
            python3 tools/generate_original_large_supports.py \
              --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [[ "$CHOICE" == deck_carapace_* ]] || [ "$CHOICE" = "bridge_side_girder" ]; then
            python3 tools/generate_original_platform_carapaces.py \
              --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [[ "$CHOICE" == floor_* ]]; then
            python3 tools/generate_original_floor_hardware.py \
              --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [[ "$CHOICE" == relief_* ]]; then
            python3 tools/generate_original_floor_relief.py \
              --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [[ "$CHOICE" == ambient_* ]]; then
            python3 tools/generate_original_ambient_motion.py \
              --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [[ "$CHOICE" == service_* && "$CHOICE" != "service_crane" ]]; then
            python3 tools/generate_original_service_equipment.py \
              --model "$CHOICE" --output "assets/source/chaos_${CHOICE}.obj"
          elif [ "$CHOICE" = "skyfleet_carrier" ]; then
            # Deterministic creator-owned colossal carrier art: source-only,
            # never accept an uploaded arbitrary OBJ from a workflow input.
            python3 tools/generate_original_skyfleet_carrier.py \
              --output assets/source/chaos_skyfleet_carrier.obj
          elif [[ "$CHOICE" == district_* ]]; then
            # Generate the FOUR deterministic profile meshes from our single
            # original and source-gated stdlib generator. No binary inputs.
            python3 tools/generate_district_profile_meshes.py --output-dir assets/source
          fi
          test -f "assets/source/chaos_${CHOICE}.obj"

      - name: Export self-contained PBR glTF with geometry validation
        shell: bash
        run: |
          set -euo pipefail
          python tools/obj_to_gltf.py \
            --source "assets/source/chaos_${CHOICE}.obj" \
            --materials "$CHAOS_MTL" \
            --output "$RUNNER_TEMP/chaos_original.gltf" > "$RUNNER_TEMP/mesh-validation.json"
          cat "$RUNNER_TEMP/mesh-validation.json"
          python - "$RUNNER_TEMP/chaos_original.gltf" <<'PY'
          import base64, json, pathlib, sys
          gltf = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert gltf["asset"]["version"] == "2.0"
          buf = gltf["buffers"][0]
          payload = base64.b64decode(buf["uri"].split(",", 1)[1], validate=True)
          assert len(payload) == buf["byteLength"]
          assert len(payload) > 1000
          assert all(v["byteOffset"] + v["byteLength"] <= len(payload)
                     for v in gltf["bufferViews"])
          assert len(gltf["meshes"][0]["primitives"]) >= 3
          print(f"Validated embedded glTF: {len(payload)} bytes, "
                f"{len(gltf['meshes'][0]['primitives'])} material primitives.")
          PY
          echo "### Original 3D geometry prepared" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/mesh-validation.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run only. No Roblox asset created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Archive validated glTF preview for phone or desktop
        uses: actions/upload-artifact@v4
        with:
          name: chaos-original-mesh-preview-${{ inputs.model }}
          path: |
            ${{ runner.temp }}/chaos_original.gltf
            ${{ runner.temp }}/mesh-validation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Roblox Open Cloud as owned Model asset
        if: inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/asset-request.json" <<'PY'
          import json, os, sys
          creator_id = os.environ["CREATOR_ID"]
          creator_kind = os.environ["CREATOR_KIND"]
          creator = {("userId" if creator_kind == "user" else "groupId"): creator_id}
          names = {"reactor_spire": "Chaos Reactor Spire",
                   "service_crane": "Chaos Service Crane",
                   "perimeter_gate": "Chaos Perimeter Gate",
                   "plasma_foundry": "Chaos Plasma Foundry",
                   "sky_transit_exchange": "Chaos Sky Transit Exchange",
