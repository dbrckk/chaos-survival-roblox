name: Upload Original Chaos 3D Assets (Manual)

# Does NOT change the playable place or public experience. Creates a separate
# owned Roblox Model asset, only with explicit user confirmation.
on:
  # Reuse the same guarded uploader from an explicitly scoped one-shot
  # owner-import workflow. Manual Android flow stays unchanged.
  workflow_call:
    inputs:
      model:
        description: Source model name
        required: true
        type: string
      creator_kind:
        description: Roblox user or group ownership
        required: true
        type: string
      creator_id:
        description: Verified public creator ID
        required: true
        type: string
      dry_run:
        description: True to validate without importing
        required: true
        type: boolean
      confirmation:
        description: Exact upload acknowledgement
        required: false
        type: string
    secrets:
      ROBLOX_ASSET_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      model:
        description: Original 3D model to validate and upload
        type: choice
        required: true
        options:
          - reactor_spire
          - service_crane
          - perimeter_gate
          - plasma_foundry
          - sky_transit_exchange
          - orbital_halo_array
          - premium_jump_deck
          - premium_skybridge_module
          - premium_ground_tile
          - district_observatory
          - district_freight
          - district_turbine
          - district_aerial
          - skyfleet_carrier
          - underdeck_chassis
          - lobby_gate
          - sky_spine_crown
          - arena_keel
      creator_kind:
        description: Asset ownership (used only when upload is enabled)
        type: choice
        required: true
        default: user
        options:
          - user
          - group
      creator_id:
        description: Numeric Roblox creator ID (required for real upload, optional for dry-run)
        type: string
        required: false
      dry_run:
        description: Convert/validate only, do not upload to Roblox
        type: boolean
        default: true
        required: true
      confirmation:
        description: For a real upload enter UPLOAD_CHAOS_ORIGINAL_3D
        type: string
        required: false

permissions:
  contents: read

# GitHub concurrency permits only ONE running and ONE pending job per group.
# Reusing one global group silently CANCELS queued parallel models, even with
# cancel-in-progress=false. Partition by creator and model to preserve all
# independent, nonduplicating original uploads.
concurrency:
  group: chaos-original-model-uploads-${{ inputs.creator_kind }}-${{ inputs.creator_id }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  import-model:
    name: Convert and optionally upload original glTF
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHOICE: ${{ inputs.model }}
      CREATOR_KIND: ${{ inputs.creator_kind }}
      CREATOR_ID: ${{ inputs.creator_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      CONFIRM: ${{ inputs.confirmation }}
      ASSET_API_KEY: ${{ secrets.ROBLOX_ASSET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact manual input and source identity
        shell: bash
        run: |
          set -euo pipefail
          case "$CHOICE" in
            reactor_spire|service_crane|perimeter_gate|plasma_foundry|sky_transit_exchange|orbital_halo_array|premium_jump_deck|premium_skybridge_module|premium_ground_tile|district_observatory|district_freight|district_turbine|district_aerial|skyfleet_carrier|underdeck_chassis|lobby_gate|sky_spine_crown|arena_keel) ;;
            *) echo "::error::Unknown model"; exit 1 ;;
          esac
          case "$CREATOR_KIND" in
            user|group) ;;
            *) echo "::error::Invalid creator kind"; exit 1 ;;
          esac
          # A pure conversion / validation must run without credentials or
          # creator lookup; only an actual upload needs an owner ID.
          if [ "$DRY_RUN" != "true" ]; then
            if [[ ! "$CREATOR_ID" =~ ^[1-9][0-9]{0,15}$ ]]; then
              echo "::error::Real upload requires a positive numeric Roblox user or group ID."
              exit 1
            fi
            if [ "$CONFIRM" != "UPLOAD_CHAOS_ORIGINAL_3D" ]; then
              echo "::error::Explicit upload confirmation mismatch. No asset created."
              exit 1
            fi
            if [ -z "$ASSET_API_KEY" ]; then
              echo "::error::Missing secrets.ROBLOX_ASSET_API_KEY. Create a dedicated key scoped to Assets Read/Write for this Roblox creator; do not re-use a broader game-publishing key."
              exit 1
            fi
          fi
          # Perimeter Gate is authored with a separate four-color MTL.
          # Exporting it against the industrial palette fails material checks.
          if [ "$CHOICE" = "perimeter_gate" ]; then
            echo "CHAOS_MTL=assets/source/chaos_perimeter_gate.mtl" >> "$GITHUB_ENV"
          elif [ "$CHOICE" = "premium_jump_deck" ] || [ "$CHOICE" = "premium_skybridge_module" ] || [ "$CHOICE" = "premium_ground_tile" ] || [[ "$CHOICE" == district_* ]] || [ "$CHOICE" = "skyfleet_carrier" ] || [ "$CHOICE" = "underdeck_chassis" ] || [ "$CHOICE" = "lobby_gate" ] || [ "$CHOICE" = "sky_spine_crown" ] || [ "$CHOICE" = "arena_keel" ]; then
            echo "CHAOS_MTL=assets/source/chaos_route_kit.mtl" >> "$GITHUB_ENV"
          else
            echo "CHAOS_MTL=assets/source/chaos_industrial_materials.mtl" >> "$GITHUB_ENV"
          fi
          if [ "$CHOICE" = "premium_ground_tile" ]; then
            python3 tools/generate_premium_ground_tile.py --output assets/source/chaos_premium_ground_tile.obj
          elif [ "$CHOICE" = "lobby_gate" ]; then
            # Creator-authored 3D main portal, leaving passage and UI sign open.
            python3 tools/generate_original_lobby_gate.py \
              --output assets/source/chaos_lobby_gate.obj
          elif [ "$CHOICE" = "sky_spine_crown" ]; then
            python3 tools/generate_original_sky_spine_crown.py \
              --output assets/source/chaos_sky_spine_crown.obj
          elif [ "$CHOICE" = "arena_keel" ]; then
            # Creator-authored real triangulated under-arena keel; never a collider.
            python3 tools/generate_original_arena_keel.py \
              --output assets/source/chaos_arena_keel.obj
          elif [ "$CHOICE" = "underdeck_chassis" ]; then
            # Authored open-frame 3D sub-deck sculpture, never a gameplay Part.
            python3 tools/generate_original_underdeck_chassis.py \
              --output assets/source/chaos_underdeck_chassis.obj
          elif [ "$CHOICE" = "skyfleet_carrier" ]; then
            # Deterministic creator-owned colossal carrier art: source-only,
            # never accept an uploaded arbitrary OBJ from a workflow input.
            python3 tools/generate_original_skyfleet_carrier.py \
              --output assets/source/chaos_skyfleet_carrier.obj
          elif [[ "$CHOICE" == district_* ]]; then
            # Generate the FOUR deterministic profile meshes from our single
            # original and source-gated stdlib generator. No binary inputs.
            python3 tools/generate_district_profile_meshes.py --output-dir assets/source
          fi
          test -f "assets/source/chaos_${CHOICE}.obj"

      - name: Export self-contained PBR glTF with geometry validation
        shell: bash
        run: |
          set -euo pipefail
          python tools/obj_to_gltf.py \
            --source "assets/source/chaos_${CHOICE}.obj" \
            --materials "$CHAOS_MTL" \
            --output "$RUNNER_TEMP/chaos_original.gltf" > "$RUNNER_TEMP/mesh-validation.json"
          cat "$RUNNER_TEMP/mesh-validation.json"
          python - "$RUNNER_TEMP/chaos_original.gltf" <<'PY'
          import base64, json, pathlib, sys
          gltf = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert gltf["asset"]["version"] == "2.0"
          buf = gltf["buffers"][0]
          payload = base64.b64decode(buf["uri"].split(",", 1)[1], validate=True)
          assert len(payload) == buf["byteLength"]
          assert len(payload) > 1000
          assert all(v["byteOffset"] + v["byteLength"] <= len(payload)
                     for v in gltf["bufferViews"])
          assert len(gltf["meshes"][0]["primitives"]) >= 3
          print(f"Validated embedded glTF: {len(payload)} bytes, "
                f"{len(gltf['meshes'][0]['primitives'])} material primitives.")
          PY
          echo "### Original 3D geometry prepared" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/mesh-validation.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run only. No Roblox asset created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Archive validated glTF preview for phone or desktop
        uses: actions/upload-artifact@v4
        with:
          name: chaos-original-mesh-preview-${{ inputs.model }}
          path: |
            ${{ runner.temp }}/chaos_original.gltf
            ${{ runner.temp }}/mesh-validation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Roblox Open Cloud as owned Model asset
        if: inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/asset-request.json" <<'PY'
          import json, os, sys
          creator_id = os.environ["CREATOR_ID"]
          creator_kind = os.environ["CREATOR_KIND"]
          creator = {("userId" if creator_kind == "user" else "groupId"): creator_id}
          names = {"reactor_spire": "Chaos Reactor Spire",
                   "service_crane": "Chaos Service Crane",
                   "perimeter_gate": "Chaos Perimeter Gate",
                   "plasma_foundry": "Chaos Plasma Foundry",
                   "sky_transit_exchange": "Chaos Sky Transit Exchange",
                   "orbital_halo_array": "Chaos Orbital Halo Array",
                   "premium_jump_deck": "Chaos Premium Armored Jump Deck",
                   "premium_skybridge_module": "Chaos Premium Structural Skybridge Module",
                   "premium_ground_tile": "Chaos Premium Industrial 3D Ground Module",
                   "district_observatory": "Chaos Original District Observatory 3D",
                   "district_freight": "Chaos Original District Freight 3D",
                   "district_turbine": "Chaos Original District Turbine 3D",
                   "district_aerial": "Chaos Original District Aerial 3D",
                   "skyfleet_carrier": "Chaos Original Colossal 3D Skyfleet Carrier",
                   "underdeck_chassis": "Chaos Original 3D Underslung Engineering Chassis",
                   "lobby_gate": "Chaos Original Sculpted Arena Lobby Gate 3D",
                   "sky_spine_crown": "Chaos Sky Spine Crown 3D",
                   "arena_keel": "Chaos Sculpted Arena Keel 3D"}
          display_name = names[os.environ["CHOICE"]]
          # Roblox returned INVALID_ARGUMENT "Asset name length is invalid"
          # on 3 Nov 2026 for the previous 54-character Sky Spine name.
          # All 16 previous imports had <=48 characters; reject long
          # strings BEFORE any non-idempotent POST or quota consumption.
          if not (3 <= len(display_name) <= 49) or display_name != display_name.strip():
              raise SystemExit("Invalid asset display name length/whitespace (3..49 characters)")
          request = {
              "assetType": "Model",
              "displayName": display_name,
              "description": "Original decorative UV-ready 3D geometry for the creator-owned Chaos Survival experience; no gameplay collisions.",
              "creationContext": {"creator": creator},
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(request, stream, separators=(",", ":"))
          PY
          request_json="$(cat "$RUNNER_TEMP/asset-request.json")"
          # One intentional POST, no blind retries: uploads are not idempotent.
          # A failed POST can return a useful validation JSON body. Keep
          # secrets out of logs and never retry blindly (POST not idempotent).
          http_code="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/upload-operation.json" \
            --write-out '%{http_code}' \
            -H "x-api-key: ${ASSET_API_KEY}" \
            --form-string "request=${request_json}" \
            --form "fileContent=@$RUNNER_TEMP/chaos_original.gltf;type=model/gltf+json" \
            https://apis.roblox.com/assets/v1/assets)"
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ] && [ "$http_code" != "202" ]; then
            echo "::error::Roblox asset create returned HTTP ${http_code}; no retry performed"
            python3 - "$RUNNER_TEMP/upload-operation.json" <<'PY'
          import json,sys
          from pathlib import Path
          body=Path(sys.argv[1]).read_text(errors="replace")
          try:
              error=json.loads(body)
              # Report only Roblox validation fields, never echo request,
              # credentials, headers, or potentially private response data.
              if isinstance(error,dict):
                  print("Roblox validation code:",str(error.get("code","unknown"))[:100])
                  print("Roblox validation message:",str(error.get("message","unknown"))[:600])
                  print("Roblox validation details:",str(error.get("details",[]))[:900])
              else:
                  print("Roblox returned non-object error JSON")
          except ValueError:
              print("Roblox returned non-JSON validation response")
          PY
            exit 1
          fi
          python - "$RUNNER_TEMP/upload-operation.json" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          path = result.get("path", "")
          if not path.startswith("operations/"):
              raise SystemExit("Roblox did not return a valid asset-operation path")
          print("Asset operation created; moderation / import result pending.")
          PY

      - name: Check resulting Roblox asset ID and moderation outcome
        if: inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          path="$(python - "$RUNNER_TEMP/upload-operation.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))["path"])
          PY
          )"
          for count in $(seq 1 24); do
            curl --silent --show-error --fail-with-body \
              -H "x-api-key: ${ASSET_API_KEY}" \
              "https://apis.roblox.com/assets/v1/${path}" \
              > "$RUNNER_TEMP/asset-status.json"
            state="$(python - "$RUNNER_TEMP/asset-status.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          if data.get("error"):
              print("error")
          elif data.get("done") and data.get("response",{}).get("assetId"):
              print("complete")
          else:
              print("pending")
          PY
            )"
            if [ "$state" = "error" ]; then
              echo "::error::Roblox rejected the asset import operation."
              python - "$RUNNER_TEMP/asset-status.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1])).get("error"))
          PY
              exit 1
            fi
            if [ "$state" = "complete" ]; then break; fi
            sleep 5
          done
          python - "$RUNNER_TEMP/asset-status.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          response = data.get("response") or {}
          asset_id = str(response.get("assetId") or "")
          if not data.get("done") or not asset_id.isdecimal():
              raise SystemExit("Asset processing incomplete: no verified Roblox asset ID.")
          moderation = (response.get("moderationResult") or {}).get("moderationState", "UNKNOWN")
          print("Verified created Model asset ID:", asset_id)
          print("Moderation:", moderation)
          with open(pathlib.Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "asset-upload-metadata.txt", "w") as stream:
              stream.write("model_asset_id=" + asset_id + "\n")
              stream.write("moderation_state=" + moderation + "\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("### Roblox asset upload operation complete\n")
              stream.write("Model asset ID: `" + asset_id + "`\n\n")
              stream.write("Moderation state: `" + moderation + "`\n\n")
              stream.write("Do not add this to the public game until Studio/staging visual and performance QA passes.\n")
          PY

      - name: Archive nonsecret upload provenance
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: chaos-original-model-${{ inputs.model }}-metadata
          path: ${{ github.workspace }}/asset-upload-metadata.txt
          retention-days: 30
