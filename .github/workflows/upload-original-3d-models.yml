                   "floor_corner_guard": "Chaos Sculpted 3D Perimeter Corner Guard",
                   "floor_anchor_bolt": "Chaos 3D Captive Industrial Anchor Bolt",
                   "floor_anchor_bolt_large": "Chaos Original Large Authored 3D Bolt",
                   "floor_harbor_tie": "Chaos 3D Harbor Forged Tie Down Eye",
                   "deck_carapace_classic": "Chaos Original Classic Load Carapace",
                   "deck_carapace_towers": "Chaos Original Towers Load Carapace",
                   "deck_carapace_crossroads": "Chaos Original Crossroads Deck Carapace",
                   "deck_carapace_orbital": "Chaos Original Orbital Load Carapace",
                   "deck_carapace_harbor": "Chaos Original Harbor Load Carapace",
                   "bridge_side_girder": "Chaos Original Skybridge Truss Girder",
                   "column_classic": "Chaos Original Classic Forged Load Column",
                   "column_towers": "Chaos Original Towers Hydraulic Column",
                   "column_crossroads": "Chaos Original Crossroads Road Pylon",
                   "column_orbital": "Chaos Original Orbital Flux Column",
                   "column_harbor": "Chaos Original Harbor Timber Steel Pile",
                   "long_route_cradle": "Chaos Original Long Skyway Undercarriage",
                   "large_deck_hull": "Chaos Original Machined Central Deck Hull",
                   "lobby_pylon_shell": "Chaos Original Enclosing Lobby 3D Column",
                   "harbor_promenade_portal": "Chaos Harbor Skywalk Cargo Gantry 3D",
                   "harbor_dock_caisson": "Chaos Original Harbor Dock Cargo Caisson 3D",
                   "harbor_freighter": "Chaos Harbor Container Freighter 3D",
                   "harbor_gantry_container": "Chaos Harbor Gantry Cargo Crane 3D",
                   "harbor_gantry_drum": "Chaos Harbor Gantry Cable Crane 3D",
                   "harbor_gantry_kinetic_container": "Chaos Animated Harbor Container Crane 3D",
                   "harbor_gantry_kinetic_drum": "Chaos Animated Harbor Cable Crane 3D",
                   "harbor_hero_station": "Chaos Harbor Signal Tower 3D",
                   "harbor_midground_barge": "Chaos Harbor Shallow Freight Barge 3D",
                   "harbor_sea_apron": "Chaos Storm Harbor Sculpted Ocean 3D",
                   "towers_cooling_spire": "Chaos Tower Run Real Cooling Spire 3D",
                   "towers_cooling_stack": "Chaos Tower Run Hollow Cooling Stack 3D",
                   "perimeter_rotor": "Chaos Original Perimeter Station Rotor 3D",
                   "perimeter_wing": "Chaos Original Sculpted Service Wing",
                   "perimeter_cap": "Chaos Original Sloped Station Cap",
                   "perimeter_crossbrace": "Chaos Perimeter Forged Open Truss",
