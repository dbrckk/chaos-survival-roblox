                   "relief_classic": "Chaos Original 3D Classic Machined Hatch",
                   "relief_towers": "Chaos Original 3D Towers Expansion Rail",
                   "relief_crossroads": "Chaos Original 3D Crossroads Tactile Strip",
                   "relief_orbital": "Chaos Original 3D Orbital Flux Track",
