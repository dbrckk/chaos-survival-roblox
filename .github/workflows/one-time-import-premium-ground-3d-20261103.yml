# Owner-requested genuine authored geometry for the real 320-stud floor.
# One exact one-shot import on main; existing audited uploader checks
# original source 3D, owner, scripts, creator permissions and moderation.
# No public place publish, no staging experience, no fabricated asset IDs.
name: One-time Import Original Premium Arena Ground 3D Mesh (2026-11-03)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-import-premium-ground-3d-20261103.yml'
permissions:
  contents: read
jobs:
  import-original-premium-ground:
    name: Import original approved 3D floor into owner inventory
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: premium_ground_tile
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
