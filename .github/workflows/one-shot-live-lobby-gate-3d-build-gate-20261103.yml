name: One-shot Live Approved Lobby Portal 3D Full Source Gate
on:
  push:
    branches: [feat/live-approved-lobby-gate-3d-20261103]
    paths: [.github/workflows/one-shot-live-lobby-gate-3d-build-gate-20261103.yml]
permissions:
  contents: read
jobs:
  real-original-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Confirm real approved Roblox model, original source and inert LOD
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_lobby_gate.py --output assets/source/chaos_lobby_gate.obj >/tmp/lobby-mesh-source.json
          python3 tools/obj_to_gltf.py --source assets/source/chaos_lobby_gate.obj --materials assets/source/chaos_route_kit.mtl --output /tmp/lobby.gltf
          python3 - <<'PY'
          import re,json
          from pathlib import Path
          registry=json.loads(Path("assets/source/roblox-asset-registry.json").read_text())
          assert len(registry["models"])==16
          asset=next(m for m in registry["models"] if m["name"]=="lobby_gate")
          assert asset["asset_id"]=="136009650118642"
          assert asset["moderation"]=="Approved"
          assert asset["workflow_run_id"]==41648061984
          assert asset["source"]=="tools/generate_original_lobby_gate.py"
          a=Path("src/server/PremiumLobbyGateMeshAssets.lua").read_text()
          b=Path("src/client/lobby-gate-original-3d.client.lua").read_text()
          c=Path("src/shared/VisualBudgetRules.lua").read_text()
          assert re.search(r"local ASSET_ID = (\d+)",a).group(1)==asset["asset_id"]
          assert re.search(r"local ASSET_ID = (\d+)",b).group(1)==asset["asset_id"]
          assert "OriginalMeshScenery.sanitize(raw)" in a
          assert '"OriginalLobbyGate3DLocal"' in c
          assert "CanCollide = false" in b and "CanQuery = false" in b
          assert "CanTouch = false" in b and "CastShadow = false" in b
          assert "RenderStepped" not in b and "Heartbeat" not in b
          assert "while true" not in b
          assert 'task.defer(PremiumLobbyGateMeshAssets.start)' in Path("src/server/init.server.lua").read_text()
          doc=json.loads(Path("/tmp/lobby.gltf").read_text())
          assert {m["name"] for m in doc["materials"]}=={"ARMOR","BRUSHED","CARBON","GRIP","ALLOY","CERAMIC","SIGNAL"}
          assert all({"POSITION","NORMAL","TANGENT","TEXCOORD_0"}<=set(x["attributes"]) for x in doc["meshes"][0]["primitives"])
          print("Original approved 3D live gate and source ownership gate PASS")
          PY
      - name: Luau compilation, Android VFX and authentic place Rojo build
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          mkdir -p /tmp/luau && unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 | xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
          python3 tools/validate_mobile_vfx_first_frame.py
          curl -fLsS --retry 3 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          mkdir -p /tmp/rojo && unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          python3 tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel CANDIDATE
          /tmp/rojo/rojo build default.project.json -o /tmp/ChaosSurvival.rbxlx
          test -s /tmp/ChaosSurvival.rbxlx
          grep -Fq "$GITHUB_SHA" /tmp/ChaosSurvival.rbxlx
