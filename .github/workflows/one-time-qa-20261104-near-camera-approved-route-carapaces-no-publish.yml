# Genuine near-camera platform underside sculptures with source verified safe fallback.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-04 Genuine Near Camera Carapaces No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261104-near-camera-approved-route-carapaces-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-near-camera-genuine-carapaces-qa-20261104
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Source gate for true close-camera 3D route sculpture (no release)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          shell=Path("src/client/PremiumPlatformSideMeshKit.lua").read_text()
          owner=Path("src/client/arena-platform-identity.client.lua").read_text()
          finish=Path("src/client/PlatformFinishKit.lua").read_text()
          route=Path("src/client/PremiumRouteMeshKit.lua").read_text()
          sampler=Path("src/client/scenery-lod.client.lua").read_text()
          loader=Path("src/server/PremiumPlatformSideAssets.lua").read_text()
          plan=Path("docs/NEAR_CAMERA_APPROVED_PLATFORM_CARAPACE_2026-11-04.md").read_text()
          registry=json.loads(Path("assets/source/roblox-asset-registry.json").read_text())
          approved={int(x["asset_id"]) for x in registry["models"]
              if x["moderation"]=="Approved"}
          assert len(registry["models"])==62 and len(approved)==62
          ids={
              "Classic":92590025262416,
              "Towers":85204303404953,
              "Crossroads":116452624086023,
              "Orbital":118444100674717,
              "Harbor":124136394128432,
              "Bridge":122766792774607,
          }
          for name,asset in ids.items():
              assert asset in approved
              assert str(asset) in loader and str(asset) in shell
          assert 'function Kit.selectCarapaceDecks' in shell
          assert 'tier == "High" and 16' in shell
          assert '(tier == "Medium" and 8 or 0)' in shell
          assert 'platform.Name:match("^Platform%d+$")' in shell
          assert 'platform.Anchored and platform.CanCollide' in shell
          assert 'phase == "Normal" or phase == "Safe"' in shell
          assert 'short >= 7.1 and long <= 36' in shell
          assert 'if selected == false then return nil end' in shell
          assert 'if selected ~= true and id % step ~= 1 then return nil end' in shell
          assert 'part:SetAttribute("NearCameraCarapace3D", true)' in shell
          assert 'model:GetAttribute("Original3DAssetId") ~= IDS[name]' in shell
          assert 'model:GetAttribute("OwnerVerified") ~= true' in shell
          assert 'obj.CanCollide = false' in shell
          assert 'obj.CanTouch = false' in shell
          assert 'obj.CanQuery = false' in shell
          assert 'Original3DStructuralSide' in shell
          assert 'selectedForOriginal ~= true' in finish
          assert 'if budget == 0 then return {} end' in finish
          assert 'selectedForOriginal)' in finish
          assert 'nearCameraCarapaces[platform] == true' in owner
          assert 'LocalOriginalNearRouteCarapaceCount' in owner
          assert 'PlatformNativeTrimReplacementKit.bind' in owner
          assert 'PremiumRouteMeshKit.sync(arena, cameraPoint' in sampler
          assert 'player:GetAttribute("OptionalVfxPressure")' in sampler
          assert 'local stress = math.clamp' in route
          assert 'deckCap = math.max(1,math.ceil(deckCap*.38))' in route
          assert 'bridgeCap = 0' in route and 'underdeckCap = 0' in route
          assert 'budget.decks' in route and 'budget.bridges' in route
          assert 'safePlatform(platform)' in route
          assert 'RenderStepped' not in shell
          assert 'LoadAssetAsync' not in shell
          assert 'RunService' not in shell
          assert 'No publication' in plan or 'non publiée' in plan
          print("Validated real already-approved five-map source models, "
                "near-camera bounded selection 0/8/16, native fallback, "
                "shrink/pressure guard. No public publication.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-near-camera-carapaces-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
