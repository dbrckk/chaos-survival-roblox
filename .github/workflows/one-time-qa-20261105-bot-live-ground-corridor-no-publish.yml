# Physical pathfinding corridor rechecks and real sharp-corner turning; never publish.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-05 Bot Live Ground Corridor No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-bot-live-ground-corridor-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-bot-live-ground-corridor-qa-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Gate live, physically anchored bot ground corridors and tight navmesh corners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rules=Path("src/server/AISurvivorRules.lua").read_text()
          server=Path("src/server/AISurvivorService.lua").read_text()
          tests=Path("tests/engine/ai-survivor-rules.spec.luau").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          doc=Path("docs/BOT_LIVE_GROUND_PATH_CORRIDOR_AND_CORNERS_2026-11-05.md").read_text()
          assert "function AISurvivorRules.groundNavigationArrivalRadius(" in rules
          assert "return before.Unit:Dot(after.Unit) < 0.76 and 2.25 or 3.8" in rules
          assert 'local function liveGroundRouteCorridorSafe(' in server
          assert 'route.nextLiveCheckAt = now + 0.72' in server
          assert 'math.min(8, travel.Magnitude)' in server
          assert 'baseOnly.FilterType = Enum.RaycastFilterType.Include' in server
          assert 'baseOnly.FilterDescendantsInstances = {base}' in server
          assert 'baseOnly.RespectCanCollide = true' in server
          assert 'and hit.Instance ~= base then' in server
          assert 'if arenaBase() ~= route.base' in server
          assert 'goal = goal,' in server
          assert 'origin = start,' in server
          assert 'record.failedTargetUntil = now + 7.5' in server
          assert 'BotLiveRouteInvalidationCount' in server
          assert 'AISurvivorRules.groundNavigationArrivalRadius(' in server
          assert server.count("path:ComputeAsync(")==1
          assert 'does not cut sharp verified navmesh turns on the way to real objectives' in tests
          assert 'expect(radius(start, pivot, Vector3.new(5, 0, 5))).toBe(2.25)' in tests
          assert 'expect(radius(start, pivot, Vector3.new(10, 0, 0))).toBe(3.8)' in tests
          assert '"tests/engine/ai-survivor-rules.spec.luau"' in cloud
          assert 'BotLiveRouteInvalidationCount' in doc
          assert 'aucune publication' in doc.lower()
          # Real middleware/rig pathfinding remains server-owned,
          # and no new RenderStepped/Heartbeat/remote was introduced.
          snippet=server[server.index('local function liveGroundRouteCorridorSafe('):
                         server.index('local function maybeSocialGesture(')]
          assert 'RunService' not in snippet
          assert 'RenderStepped' not in snippet
          assert 'Heartbeat' not in snippet
          assert 'RemoteEvent' not in snippet
          print("Verified next-segment physical ground raycasts, real base-only "
                "filter, bounded rate, stale path rejection, turn corner "
                "arrival contract and seven-engine-suite milestone. "
                "NO PUBLICATION.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-bot-live-ground-corridor-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
