# Exact-SHA major Orbital 3D halo art milestone; do NOT publish Roblox.
name: One-time QA 2026-11-05 Genuine Orbital Halo 3D Trusses No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-original-orbital-halo-3d-trusses-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-genuine-orbital-halo-3d-trusses-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: github.repository == 'dbrckk/chaos-survival-roblox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Prove source-authorized 3D ring, 14 sectors, Android pressure and native atomic failback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rules=Path("src/shared/CinematicOrbitalHaloMeshRules.lua").read_text()
          kit=Path("src/client/ApprovedOrbitalHaloTrussMeshKit.lua").read_text()
          builder=Path("src/client/arena-cinematic-depth.client.lua").read_text()
          lod=Path("src/client/scenery-lod.client.lua").read_text()
          budget=Path("src/shared/VisualBudgetRules.lua").read_text()
          source=Path("src/server/PremiumRouteMeshAssets.lua").read_text()
          original=Path("assets/source/roblox-asset-registry.json").read_text()
          tests=Path("tests/engine/cinematic-depth-layout.spec.luau").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          doc=Path("docs/VIS_ORBITAL_APPROVED_3D_HALO_TRUSS_2026-11-05.md").read_text()
          for marker in (
              'Rules.ASSET_ID=94023662427980',
              'Rules.MODULES_PER_SITE=4',
              'Rules.COUNT=14',
              'Rules.SOURCE_NAME="PremiumSkybridgeModule"',
              'Rules.SOURCE_FOLDER="PremiumRouteMeshTemplates"',
              'Rules.LOCAL_FOLDER="OriginalOrbitalHaloTrussesLocal"',
              'Low={0,0,0}',
              'Medium={2,1,0}',
              'High={5,2,0}',
              'HIGH_TOUCH={3,1,0}',
              'function Rules.isNative(part,folder,base,index)',
              'function Rules.fit(sourceSize)',
              'function Rules.moduleOffset(moduleIndex)',
          ):
              assert marker in rules,marker
          assert 'PremiumSkybridgeModule = 94023662427980' in source
          assert '94023662427980' in original
          assert 'OriginalCinematicHaloIndex' in builder
          assert 'halo:SetAttribute("OriginalCinematicHaloIndex", i)' in builder
          for marker in (
              'model:GetAttribute("PremiumRoute3D")~=true',
              'model:GetAttribute("Original3DAssetId")~=Rules.ASSET_ID',
              'model:GetAttribute("OwnerVerified")~=true',
              'elseif item:IsA("LuaSourceContainer") then return nil',
              'if not item:IsA("MeshPart") or item.CanCollide',
              'Rules.isNative(native,cinematic,base,index)',
              'local scale,yaw=Rules.fit(size)',
              'for moduleIndex=1,Rules.MODULES_PER_SITE do',
              'piece.CanCollide=false',
              'piece.CanTouch=false',
              'piece.CanQuery=false',
              'native.Transparency=1',
              'entry.native.Transparency=entry.originalTransparency',
              'local wanted=Spatial.choose(candidates,cap)',
              'function Kit.count()',
              'function Kit.replacedNativeCount()',
          ):
              assert marker in kit,marker
          assert 'ApprovedOrbitalHaloTrussMeshKit.sync(' in lod
          assert 'LocalOriginalOrbitalHalo3DCount' in lod
          assert 'LocalOriginalOrbitalHaloNativeReplaced' in lod
          assert 'OriginalOrbitalHaloTrussesLocal' in budget
          for marker in ('Parts = 440','Parts = 680','Parts = 900'):
              assert marker in budget,marker
          assert '"tests/engine/cinematic-depth-layout.spec.luau"' in cloud
          assert 'replaces 14 genuinely sourced orbital halo bars' in tests
          assert 'expect(HaloRules.capacity("High",0,true)).toBe(3)' in tests
          assert 'expect(HaloRules.moduleOffset(5)).toBe(nil)' in tests
          assert '0/10/14' in doc
          for banned in ('LoadAssetAsync','RenderStepped:Connect',
                         'Heartbeat:Connect','Instance.new("Part")'):
              assert banned not in kit,banned
          print("Source-original four-module 3D Orbital trusses replace at"
                " most five High-desktop, three High-mobile, two Medium"
                " nonphysical halo bars; stable 14 sectors, EXACT imported"
                " ID and native rollback, same 440/680/900 census."
                " NO PUBLISH.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-original-orbital-halo-truss-3d-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
