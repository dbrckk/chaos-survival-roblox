# Bot physical obstacle anticipation and ground-route support, validated only at this milestone.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-05 Real Ground Bot Obstacle Preview No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-bot-ground-obstacle-anticipation-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-bot-ground-obstacle-preview-qa-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Gate physical ground obstacle previews and sky-route support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rules=Path("src/server/AISurvivorRules.lua").read_text()
          service=Path("src/server/AISurvivorService.lua").read_text()
          specs=Path("tests/engine/ai-survivor-rules.spec.luau").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          doc=Path("docs/BOT_OBSTACLE_PREVIEW_REAL_GROUND_ROUTE_2026-11-05.md").read_text()
          assert "function AISurvivorRules.groundObstaclePreviewAllowed(" in rules
          assert "and rootY <= baseTopY + 6.5" in rules
          assert "and horizontalDistance >= 9" in rules
          assert "and horizontalDistance <= 110" in rules
          assert "or urgent == true or committed == true" in rules
          assert "and AISurvivorRules.elevatedRouteHasSupport(" in service
          assert "if onGroundNetwork and AISurvivorRules.reachableElevation(" in service
          assert 'if onGroundNetwork and base and base:IsA("BasePart")' in service
          assert "local function anticipateGroundObstacle(" in service
          assert "AISurvivorRules.groundObstaclePreviewAllowed(" in service
          assert 'record.nextObstaclePreviewAt = now + 2.4' in service
          assert 'record.nextObstaclePreviewAt = 0' in service
          assert 'nextObstaclePreviewAt = 0,' in service
          assert 'standing.Instance ~= base' in service
          assert 'hit.Instance.Anchored and hit.Instance ~= base' in service
          assert 'local detour = nearbyRecoveryStep(record, root, goal)' in service
          assert 'requestGroundNavigation(record, root, goal, now)' in service
          assert 'record.failedTargetUntil = now + 7.5' in service
          assert 'return root.Position, 0.65' in service
          assert 'local safeTarget, safeHold = anticipateGroundObstacle(' in service
          assert 'BotObstacleAvoidedCount' in service and 'BotObstaclePreviewCount' in service
          assert 'local preview = AISurvivorRules.groundObstaclePreviewAllowed' in specs
          assert 'preview(20, 10, true, true, true, false,' in specs
          assert '"tests/engine/ai-survivor-rules.spec.luau"' in cloud
          assert "aucun déploiement public" in doc.lower()
          # no additional per-frame loop or new RPC in this source kit
          assert 'local function startBrain()' in service
          assert 'AISurvivorRules.recoveryGroundSamplesSafe(' in service
          print("Source gate complete: server physics corridor <=10 studs, "
                "round-only 2.4-second bound, physical five-sample detour, "
                "async pathfinder, true sky support, seven-bot fair movement. "
                "NEVER PUBLISH.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-bot-ground-obstacle-preview-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
