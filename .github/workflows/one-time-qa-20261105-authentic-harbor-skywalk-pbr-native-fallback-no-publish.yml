# Owner-approved Harbor UV gantry PBR 2K and immediate accurate native structural fallback; never publish.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-05 Harbor Source PBR and Native Fallback No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-authentic-harbor-skywalk-pbr-native-fallback-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-harbor-source-pbr-native-fallback-qa-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Source-authentic Harbor promenade PBR, instant native fallbacks and real-engine regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pbr=Path("src/client/PremiumRoutePbrKit.lua").read_text()
          harbor=Path("src/client/HarborPromenadePortalMeshKit.lua").read_text()
          scenery=Path("src/client/scenery-lod.client.lua").read_text()
          registry=Path("src/server/PremiumHarborPromenadePortalAssets.lua").read_text()
          spec=Path("tests/engine/visual-budget-rules.spec.luau").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          doc=Path("docs/APPROVED_HARBOR_SKYWALK_GANTRY_2K_PBR_AND_NATIVE_FALLBACK_2026-11-05.md").read_text()
          for marker in (
              'gantry = 134157110756659',
              'kind == "gantry"',
              'model:GetAttribute("OriginalHarborPromenadePortal3D") == true',
              'model.Name == "ApprovedHarborSuspendedCargoGantry3D"',
              'name:find("SIGNAL", 1, true)',
              'name:find("GRIP", 1, true)',
              'name:find("CARBON", 1, true)',
          ):
              assert marker in pbr, marker
          for marker in (
              'local ID = 134157110756659',
              'folder.ChildRemoved:Connect(function(child)',
              'if entry.disposing then return end',
              'PremiumRoutePbrKit.detach(entry)',
              'if not visible then PremiumRoutePbrKit.detach(entry) end',
              'PremiumRoutePbrKit.apply(entry, "gantry", "Harbor"',
              'local slots = math.min(1, PremiumRoutePbrKit.entryBudget(',
              'if stress > 0 then slots = 0 end',
              'function Kit.pbrCount()',
              'deck:GetAttribute("ChaosPermanentRoute") ~= true',
              'deck:GetAttribute("PromenadeLane")',
              'deck:GetAttribute("PromenadeStep")',
          ):
              assert marker in harbor,marker
          assert 'OriginalHarborPromenadePortal3D' in registry
          assert '134157110756659' in registry
          assert 'LocalOriginalHarborGantryPbr2KModelCount' in scenery
          assert 'LocalOriginalHarborGantryPbr2KAppearanceCount' in scenery
          assert 'source-authenticated 2K Harbor gantry armor' in spec
          assert 'restores the exact nine-part Harbor native arch immediately' in spec
          assert 'expect(Kit.count()).toBe(0)' in spec
          assert 'clone:Destroy()' in spec
          assert '"tests/engine/visual-budget-rules.spec.luau"' in cloud
          assert 'Publication publique : non' in doc
          assert 'RunService' not in harbor
          assert 'game:GetService("TweenService")' not in harbor
          print("Approved owner upload 134157110756659: verified origin and"
                " 2K metal/ceramic groups, SIGNAL/GRIP/CARBON spared;"
                " native arch restored immediately on unexpected removal;"
                " strict one-textured-gantry mobile cap; real engine fallback"
                " cases present. NO PUBLISH.", flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-harbor-native-pbr-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
