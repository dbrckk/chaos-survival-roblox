name: Release Luau register and playable arena HUD regression
on:
  pull_request:
    paths:
      - src/server/init.server.lua
      - src/server/ArenaMechanics.lua
      - tools/verify_premium_bootstrap_register_budget.py
      - .github/workflows/release-luau-register-regression.yml
  push:
    branches: [main]
    paths:
      - src/server/init.server.lua
      - src/server/ArenaMechanics.lua
      - tools/verify_premium_bootstrap_register_budget.py
      - .github/workflows/release-luau-register-regression.yml
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify optional owner scopes and gameplay HUD limits
        run: python3 tools/verify_premium_bootstrap_register_budget.py
      - name: Compile real production Luau and all engine sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-time 90 -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          unzip -tq /tmp/luau.zip >/dev/null
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 |
            xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
