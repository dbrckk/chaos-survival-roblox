name: Chaos AI Visual Capture (Temporary Windows)
# Intentionally workflow_dispatch ONLY: an unattended main push cannot sign in
# to Roblox Studio and previously consumed Windows Actions minutes for 0 PNGs.
# Secure temporary Windows desktop accessible from Android, with a genuine
# Studio AI camera test. No user account tokens or cookies are stored.
on:
  workflow_dispatch:
    inputs:
      arena:
        description: "Authentic Studio audit: one map or all five (one Windows login)"
        required: true
        type: choice
        default: All
        options:
          - All
          - Classic
          - Towers
          - Crossroads
          - Orbital
          - Harbor

concurrency:
  group: chaos-studio-ai-visual-hosted
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remote-ai-visual:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 95
    steps:
      - name: Validate opt-in secrets
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          RDP_PASS: ${{ secrets.CHAOS_REMOTE_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TS_KEY)) {
            throw "Missing TAILSCALE_AUTHKEY GitHub secret. Remote Windows NOT started."
          }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASS) -or $env:RDP_PASS.Length -lt 16) {
            throw "Missing or short CHAOS_REMOTE_RDP_PASSWORD GitHub secret (16+ characters)."
          }
          Write-Host "Secrets configured; no Roblox password, 2FA code or account cookie is needed by this workflow."

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record approved arena scope (no public game modification)
        shell: pwsh
        env:
          CHAOS_VISUAL_SCOPE: ${{ inputs.arena || 'All' }}
        run: |
          $allowed = @("All", "Classic", "Towers", "Crossroads", "Orbital", "Harbor")
          if ($allowed -cnotcontains $env:CHAOS_VISUAL_SCOPE) {
            throw "Untrusted or missing visual QA map selection"
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Exact Git checkout SHA mismatch; refusing visual evidence."
          }
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Content -LiteralPath build/visual-ai-audit-scope.txt -Value $env:CHAOS_VISUAL_SCOPE -Encoding ascii
          @(
            "capture_kind=AUTHENTIC_INTERACTIVE_ROBLOX_STUDIO",
            "source_sha=$env:GITHUB_SHA",
            "github_run_id=$env:GITHUB_RUN_ID",
            "arena_scope=$env:CHAOS_VISUAL_SCOPE",
            "android_performance_certified=false",
            "public_roblox_place_modified=false"
          ) | Set-Content -LiteralPath build/visual-ai-audit-provenance.txt -Encoding ascii
          Write-Host ("Studio QA scope: " + $env:CHAOS_VISUAL_SCOPE)

      - name: Validate Windows launcher syntax and fail-closed configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            "studio/remote-windows-ai-bootstrap.ps1",
            "studio/remote-ai-interactive-session.ps1",
            "studio/capture-ai-visual-review.ps1",
            "studio/prepare-visual-ai-arena.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              foreach ($errorItem in $parseErrors) {
                Write-Host ("PowerShell parse failure in " + $path + ": " + $errorItem.Message)
              }
              throw "Refusing invalid PowerShell launcher"
            }
          }
          $source = Get-Content studio/remote-windows-ai-bootstrap.ps1 -Raw
          if (-not $source.Contains("-EncodedCommand") -or
              -not $source.Contains("New-ScheduledTaskTrigger -AtLogOn")) {
            throw "Verified automatic interactive launcher not found"
          }
          Write-Host "All Windows AI capture scripts parse; interactive EncodedCommand startup contract verified."

      - name: Build visual QA place file for remote Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "chaos-rojo.zip"
          $dir = Join-Path $env:RUNNER_TEMP "chaos-rojo"
          Invoke-WebRequest -Uri "https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $rojo = Get-ChildItem $dir -Filter "rojo.exe" -Recurse | Select-Object -First 1
          if (-not $rojo) { throw "Rojo missing" }
          if (Test-Path "src/shared/VisualStagingStamp.lua") {
            throw "Staging-only marker must not be committed to source."
          }
          $stamp = "return { Environment = 'STAGING', Commit = '" + $env:GITHUB_SHA + "', RunId = '" + $env:GITHUB_RUN_ID + "' }"
          Set-Content "src/shared/VisualStagingStamp.lua" -Value $stamp -Encoding utf8
          & $rojo.FullName build default.project.json -o build/ChaosSurvival.rbxlx
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "build/ChaosSurvival.rbxlx")) {
            throw "Rojo build failed"
          }
          $contents = Get-Content "build/ChaosSurvival.rbxlx" -Raw
          if (!$contents.Contains($env:GITHUB_SHA) -or !$contents.Contains("VisualStagingStamp")) {
            throw "Exact commit identity missing from built place"
          }
          $desktop = [Environment]::GetFolderPath("Desktop")
          if (!$desktop) { $desktop = Join-Path $env:USERPROFILE "Desktop" }
          New-Item -ItemType Directory -Path $desktop -Force | Out-Null
          Copy-Item "build/ChaosSurvival.rbxlx" (Join-Path $desktop "ChaosSurvival_VisualQA.rbxlx") -Force
          $shortcut = "[InternetShortcut]" + [Environment]::NewLine + "URL=https://create.roblox.com/docs/studio/setup"
          Set-Content (Join-Path $desktop "Official_Roblox_Studio.url") -Value $shortcut
          $instructions = @(
            "CHAOS SURVIVAL - AUTOMATIC STUDIO AI SCREENSHOTS",
            "",
            "The automatic launcher is installed later in this workflow.",
            "No manual Roblox publication or Studio file opening is needed.",
            "One authenticated desktop can test all five arena variants: 15 real PNGs each.",
            "If Studio is not already authenticated for this Windows user,",
            "a one-time login inside Roblox's official Studio UI is required.",
            "Never share account cookies, Roblox passwords or 2FA codes."
          )
          Set-Content (Join-Path $desktop "READ_ME_VisualQA.txt") -Value $instructions
          Write-Host "Exact-SHA staging build created on temporary Windows desktop."

      - name: Preinstall official signed Roblox Studio on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "RobloxStudioInstaller.exe"
          Invoke-WebRequest -Uri "https://setup.rbxcdn.com/RobloxStudioInstaller.exe" -OutFile $installer
          $sig = Get-AuthenticodeSignature $installer
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Roblox") {
            throw "Roblox Studio installer signature invalid; aborting."
          }
          $process = Start-Process -FilePath $installer -PassThru
          $deadline = (Get-Date).AddMinutes(6)
          $studio = $null
          while ((Get-Date) -lt $deadline) {
            $running = Get-Process -Name "RobloxStudioBeta" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($running -and $running.Path) {
              $studio = $running.Path
            }
            if (!$studio) {
              $roots = @(
                "$env:LOCALAPPDATA\Roblox",
                "$env:USERPROFILE\AppData\Local\Roblox",
                "C:\Program Files\Roblox",
                "C:\Program Files (x86)\Roblox"
              ) | Where-Object { Test-Path $_ }
              foreach ($root in $roots) {
                $candidate = Get-ChildItem $root -Filter "RobloxStudioBeta.exe" -Recurse -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if ($candidate) { $studio = $candidate.FullName; break }
              }
            }
            if ($studio) { break }
            if ($process.HasExited -and $process.ExitCode -ne 0) {
              throw "Roblox Studio installer failed with exit code $($process.ExitCode)."
            }
            Start-Sleep -Seconds 3
          }
          if (!$studio) { throw "Roblox Studio installer did not complete within six minutes." }
          # Roblox's installer can expose RobloxStudioBeta.exe in the
          # Versions folder BEFORE releasing its exclusive write lock.
          # The 31 Oct visual QA failed here with "being used by another
          # process", despite the installer and signed source succeeding.
          # Retry ONLY this transient file-sharing failure, never an
          # invalid signature or an untrusted signing publisher.
          $signedStudio = (Resolve-Path -LiteralPath $studio).Path
          $signedDigest = $null
          $verified = $false
          $verifyDeadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $verifyDeadline) {
            try {
              $exeSig = Get-AuthenticodeSignature -LiteralPath $signedStudio -ErrorAction Stop
              if ($exeSig.Status -ne "Valid" -or
                  $exeSig.SignerCertificate.Subject -notmatch "Roblox") {
                throw "Installed Roblox Studio executable signature invalid."
              }
              # Attest the exact, now-readable signed file. If the installer
              # still owns it exclusively, retry both steps together.
              $signedStream = [System.IO.File]::OpenRead($signedStudio)
              try {
                $sha256 = [System.Security.Cryptography.SHA256]::Create()
                try {
                  $signedDigest = [BitConverter]::ToString(
                    $sha256.ComputeHash($signedStream)
                  ).Replace("-", "")
                }
                finally { $sha256.Dispose() }
              }
              finally { $signedStream.Dispose() }
              $verified = $true
              break
            }
            catch {
              $message = [string]$_.Exception.Message
              if ($message -notmatch 'being used by another process|sharing violation|file is in use') {
                throw
              }
              Write-Host "Roblox installer holds a temporary file lock; retrying signed binary verification."
              Start-Sleep -Seconds 3
            }
          }
          if (-not $verified) {
            throw "Roblox Studio installer did not release the signed binary within 90 seconds."
          }
          Get-Process -Name "RobloxStudioBeta" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          if ($signedDigest.Length -ne 64 -or
              $signedDigest -notmatch "^[0-9A-F]{64}$") {
            throw "Invalid Authenticode attestation digest."
          }
          $attestationDir = "build/visual-ai-captures"
          New-Item -ItemType Directory -Force $attestationDir | Out-Null
          @(
            "signer=Roblox",
            "signature=Valid",
            "studio_path_b64=$([Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($signedStudio)))",
            "sha256=$signedDigest"
          ) | Set-Content -Path (Join-Path $attestationDir "verified-studio-attestation.txt") -Encoding ascii
          "STUDIO_EXE=$studio" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Official Roblox Studio signed binary and SHA-256 digest attested."
          # The tested automatic launcher is installed in the later
          # Prepare AI capture step. It starts Studio itself at Windows login,
          # without a competing Run-key entry or Roblox credential access.
          Write-Host "Roblox Studio official signed binary ready; automatic launcher follows."

      - name: Enable secure Windows RDP only from Tailscale
        shell: pwsh
        env:
          RDP_PASS: ${{ secrets.CHAOS_REMOTE_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $account = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
          if (-not $account) { throw "runneradmin not found; refusing insecure RDP fallback." }
          $secure = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $secure
          $base = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          Set-ItemProperty -Path $base -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "$base\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Set-ItemProperty -Path "$base\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 2
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue | Disable-NetFirewallRule
          New-NetFirewallRule -DisplayName "ChaosVisualQA-TailscaleOnly" -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress "100.64.0.0/10" -Profile Any -Action Allow | Out-Null
          # Registry switches alone are insufficient if the listener is stopped.
          $rdpService = Get-Service -Name "TermService" -ErrorAction Stop
          if ($rdpService.Status -ne "Running") {
            Start-Service -Name "TermService" -ErrorAction Stop
          }
          Start-Sleep -Seconds 3
          $rdpListener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          if (-not $rdpListener) {
            throw "RDP not listening on TCP/3389 despite enabled registry settings."
          }
          if (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -InformationLevel Quiet -WarningAction SilentlyContinue)) {
            throw "RDP local loopback TCP/3389 check failed."
          }
          Write-Host "RDP local TCP/3389 listener verified with Windows TermService running."
          Write-Host "RDP has NLA/TLS enabled and only permits connections from private Tailscale addresses."

      - name: Join owner's private Tailscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Prepare autonomous AI screenshot run after Roblox login
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bootstrap = (Resolve-Path studio/remote-windows-ai-bootstrap.ps1).Path
          & $bootstrap -StudioExe "$env:STUDIO_EXE" -Workspace "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "AI screenshot bootstrap failed." }

      - name: Show private IP and temporary instructions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ip = ((& tailscale ip -4 | Select-Object -First 1) | Out-String).Trim()
          if ($ip -notmatch "^100\.[0-9]+\.[0-9]+\.[0-9]+$") {
            throw "Tailscale private IP unavailable; cannot connect securely."
          }
          $tsState = (& tailscale status --json | ConvertFrom-Json).BackendState
          if ($tsState -ne "Running") {
            throw "Tailscale backend not running; refusing to advertise RDP as ready."
          }
          if (-not (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)) {
            throw "RDP port stopped listening after Tailscale startup."
          }
          @(
            "### Android AI Visual QA: Windows desktop ready",
            "",
            "- Connect the Android Tailscale app to this same personal network.",
            "- Open the official Microsoft Remote Desktop Android application.",
            "- RDP address: " + $ip,
            "- Windows username: runneradmin",
            "- RDP password: the private value of CHAOS_REMOTE_RDP_PASSWORD (NOT your Roblox password).",
            "- Sign in once in Roblox Studio; watch the AI test start automatically, or open START_CHAOS_AI_CAPTURE.cmd on the desktop.",
            "- The build ChaosSurvival_VisualQA.rbxlx is prepared from commit " + $env:GITHUB_SHA,
            "- Selected audit scope: " + (Get-Content build/visual-ai-audit-scope.txt -Raw).Trim(),
            "- 'All' makes five sequential real Studio matches and 75 PNGs with one Roblox login.",
            "- The Windows session is temporary and ends after its verified captures or a timeout.",
            "- The public Roblox game remains unchanged; only the local test build runs."
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "Private Tailscale IP: $ip"
          Write-Host "RDP user: runneradmin (password never printed)."

      - name: Wait for authenticated five-arena AI capture evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $captureDir = Join-Path $env:GITHUB_WORKSPACE "build/visual-ai-captures"
          # Protect free/limited Actions minutes. Allow only 14 minutes
          # for the owner to authenticate; *after* a genuine authenticated
          # Studio stage, budget enough time for five sequential play tests.
          $deadline = (Get-Date).AddMinutes(14)
          $postAuthExtended = $false
          $complete = $false
          $taskStartRequested = $false
          while ((Get-Date) -lt $deadline) {
            # RDP frequently reconnects an existing desktop rather than
            # creating a new Windows logon. Neither Run-key nor OnLogon
            # triggers are guaranteed on reconnect. As soon as the real
            # interactive Explorer desktop exists, invoke our registered
            # task in THAT authenticated Windows user's session.
            if (-not $taskStartRequested) {
              $interactiveShells = @(Get-Process -Name explorer -ErrorAction SilentlyContinue |
                Where-Object { $_.SessionId -gt 0 })
              if ($interactiveShells.Count -gt 0) {
                try {
                  Start-ScheduledTask -TaskName "ChaosAIVisualReview" -ErrorAction Stop
                  $taskStartRequested = $true
                  Write-Host "STUDIO_WATCHDOG_RECONNECTED: interactive Windows task launched without manual PowerShell."
                }
                catch {
                  Write-Host "STUDIO_WATCHDOG_TASK_DEFERRED: still waiting for available interactive token."
                }
              }
            }
            $successFile = Join-Path $captureDir "capture-status.txt"
            $errorFile = Join-Path $captureDir "capture-error.txt"
            $watchdogStatus = Join-Path $captureDir "watchdog-status.txt"
            if (Test-Path $watchdogStatus) {
              $statusLines = Get-Content -LiteralPath $watchdogStatus -ErrorAction SilentlyContinue
              $stage = @($statusLines | Where-Object { $_ -match "^stage=" } | Select-Object -Last 1)
              if ($stage.Count -gt 0) {
                Write-Host ("STUDIO_WATCHDOG " + $stage[0])
                $authenticated = $stage[0] -match '^stage=(AUTHENTICATED_STARTING_AI_TEST|CAPTURING_|CAPTURE_COMPLETE)'
                if ($authenticated -and -not $postAuthExtended) {
                  $scope = (Get-Content build/visual-ai-audit-scope.txt -Raw).Trim()
                  $minutes = if ($scope -eq "All") { 22 } else { 8 }
                  # Authenticated gameplay can use the full bounded time
                  # required by the real Roblox Studio engine. Never extend
                  # merely because a remote desktop was opened.
                  $deadline = (Get-Date).AddMinutes($minutes)
                  $postAuthExtended = $true
                  Write-Host "VERIFIED_STUDIO_AUTH: bounded gameplay collection window extended."
                }
              }
            }
            if (Test-Path $errorFile) {
              $reason = (Get-Content -LiteralPath $errorFile -Raw).Trim()
              if ($reason -notmatch '^[A-Z_]{3,64}
            if (Test-Path $successFile) {
              $status = (Get-Content -LiteralPath $successFile -Raw).Trim()
              $scope = (Get-Content build/visual-ai-audit-scope.txt -Raw).Trim()
              $arenas = if ($scope -eq "All") {
                @("Classic", "Towers", "Crossroads", "Orbital", "Harbor")
              } else { @($scope) }
              $count = 0
              foreach ($arena in $arenas) {
                $folder = Join-Path $captureDir $arena
                $frames = @(Get-ChildItem -LiteralPath $folder -Filter "ai-frame-*.png" -ErrorAction SilentlyContinue)
                if ($frames.Count -ne 15) {
                  throw "Studio evidence incomplete for $arena : $($frames.Count)/15"
                }
                $count += $frames.Count
              }
              if ($status -ne "PASS" -or $count -ne 15 * $arenas.Count) {
                throw "Studio screenshot workflow failed to certify all selected arenas."
              }
              $complete = $true
              Write-Host "PASS: $count authentic Studio AI PNGs across $($arenas.Count) selected arenas."
              break
            }
            $listener = @(Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)
            if ($listener.Count -eq 0) { throw "Private Windows Remote Desktop listener stopped." }
            $state = (& tailscale status --json | ConvertFrom-Json).BackendState
            if ($state -ne "Running") { throw "Private Tailscale network disconnected." }
            Start-Sleep -Seconds 20
            Write-Host ("AI CAPTURE WAIT {0:u}: session online; awaiting Roblox sign-in or local test completion." -f (Get-Date).ToUniversalTime())
          }
          if (-not $complete) {
            @(
              "### Visual QA not certified",
              "",
              "- Reason: AUTH_REQUIRED_OR_CAPTURE_TIMEOUT",
              "- No complete authenticated 15-frame per-arena evidence was received.",
              "- Avoid rerunning until the owner's official Studio login can be completed during the temporary RDP session."
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw "AUTH_REQUIRED_OR_CAPTURE_TIMEOUT: no complete real authenticated Studio evidence. Do not count partial screenshots."
          }

      - name: Install image QA dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit all authenticated arena PNGs and make separate contact sheets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check "Pillow==11.2.1"
          if ($LASTEXITCODE -ne 0) { throw "Pillow installation failed." }
          $scope = (Get-Content build/visual-ai-audit-scope.txt -Raw).Trim()
          $arenas = if ($scope -eq "All") {
            @("Classic", "Towers", "Crossroads", "Orbital", "Harbor")
          } else { @($scope) }
          foreach ($arena in $arenas) {
            $directory = Join-Path build/visual-ai-captures $arena
            python studio/analyze-visual-ai.py $directory $arena
            if ($LASTEXITCODE -ne 0) {
              throw "Failed authenticated screenshot provenance/visual audit for $arena"
            }
            Get-Content (Join-Path $directory "visual-ai-audit.md") |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          Write-Host "All $($arenas.Count) requested arena evidence reports verified."

      - name: Upload original source PNGs, montage and analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-authentic-five-arena-studio-pngs-hosted-windows
          # Never upload raw Studio logs; they can contain local
          # authentication state or other unrelated user data. Only image
          # evidence and safe status/manifests are retained.
          path: |
            build/visual-ai-captures/*/ai-frame-*.png
            build/visual-ai-captures/*/frames.tsv
            build/visual-ai-captures/bootstrap-status.txt
            build/visual-ai-captures/watchdog-status.txt
            build/visual-ai-captures/watchdog-history.txt
            build/visual-ai-captures/capture-error-metadata.txt
            build/visual-ai-captures/capture-status.txt
            build/visual-ai-captures/capture-error.txt
            build/visual-ai-captures/*/visual-ai-contact-sheet.jpg
            build/visual-ai-captures/*/visual-ai-audit.json
            build/visual-ai-captures/*/visual-ai-audit.md
            build/visual-ai-audit-scope.txt
            build/visual-ai-audit-provenance.txt
          if-no-files-found: warn
          retention-days: 14
) {
                $reason = "LOCAL_CAPTURE_FAILURE"
              }
              @(
                "### Visual QA not certified",
                "",
                "- Sanitized reason: " + $reason,
                "- Genuine Studio captures: **not certified**; inspect the uploaded status artifact.",
                "- For AUTH_REQUIRED, trigger a NEW manual run only when ready to log in through private Tailscale/RDP.",
                "- This workflow never bypasses the official Roblox login and never updates the public game."
              ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              throw "AI camera capture failed ($reason); no false screenshot certification."
            }
            if (Test-Path $successFile) {
              $status = (Get-Content -LiteralPath $successFile -Raw).Trim()
              $scope = (Get-Content build/visual-ai-audit-scope.txt -Raw).Trim()
              $arenas = if ($scope -eq "All") {
                @("Classic", "Towers", "Crossroads", "Orbital", "Harbor")
              } else { @($scope) }
              $count = 0
              foreach ($arena in $arenas) {
                $folder = Join-Path $captureDir $arena
                $frames = @(Get-ChildItem -LiteralPath $folder -Filter "ai-frame-*.png" -ErrorAction SilentlyContinue)
                if ($frames.Count -ne 15) {
                  throw "Studio evidence incomplete for $arena : $($frames.Count)/15"
                }
                $count += $frames.Count
              }
              if ($status -ne "PASS" -or $count -ne 15 * $arenas.Count) {
                throw "Studio screenshot workflow failed to certify all selected arenas."
              }
              $complete = $true
              Write-Host "PASS: $count authentic Studio AI PNGs across $($arenas.Count) selected arenas."
              break
            }
            $listener = @(Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)
            if ($listener.Count -eq 0) { throw "Private Windows Remote Desktop listener stopped." }
            $state = (& tailscale status --json | ConvertFrom-Json).BackendState
            if ($state -ne "Running") { throw "Private Tailscale network disconnected." }
            Start-Sleep -Seconds 20
            Write-Host ("AI CAPTURE WAIT {0:u}: session online; awaiting Roblox sign-in or local test completion." -f (Get-Date).ToUniversalTime())
          }
          if (-not $complete) {
            throw "AUTH_REQUIRED_OR_CAPTURE_TIMEOUT: no complete real authenticated Studio evidence. Do not count partial screenshots."
          }

      - name: Install image QA dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit all authenticated arena PNGs and make separate contact sheets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check "Pillow==11.2.1"
          if ($LASTEXITCODE -ne 0) { throw "Pillow installation failed." }
          $scope = (Get-Content build/visual-ai-audit-scope.txt -Raw).Trim()
          $arenas = if ($scope -eq "All") {
            @("Classic", "Towers", "Crossroads", "Orbital", "Harbor")
          } else { @($scope) }
          foreach ($arena in $arenas) {
            $directory = Join-Path build/visual-ai-captures $arena
            python studio/analyze-visual-ai.py $directory $arena
            if ($LASTEXITCODE -ne 0) {
              throw "Failed authenticated screenshot provenance/visual audit for $arena"
            }
            Get-Content (Join-Path $directory "visual-ai-audit.md") |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          Write-Host "All $($arenas.Count) requested arena evidence reports verified."

      - name: Upload original source PNGs, montage and analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-authentic-five-arena-studio-pngs-hosted-windows
          # Never upload raw Studio logs; they can contain local
          # authentication state or other unrelated user data. Only image
          # evidence and safe status/manifests are retained.
          path: |
            build/visual-ai-captures/*/ai-frame-*.png
            build/visual-ai-captures/*/frames.tsv
            build/visual-ai-captures/bootstrap-status.txt
            build/visual-ai-captures/watchdog-status.txt
            build/visual-ai-captures/watchdog-history.txt
            build/visual-ai-captures/capture-error-metadata.txt
            build/visual-ai-captures/capture-status.txt
            build/visual-ai-captures/capture-error.txt
            build/visual-ai-captures/*/visual-ai-contact-sheet.jpg
            build/visual-ai-captures/*/visual-ai-audit.json
            build/visual-ai-captures/*/visual-ai-audit.md
            build/visual-ai-audit-scope.txt
            build/visual-ai-audit-provenance.txt
          if-no-files-found: warn
          retention-days: 14
