# Major second-arena visual milestone: five authentic Tower Run cooling installations in TWO sculpted types, no
# game publishing. This file alone triggers the checks on exact main SHA.
# Exact main SHA: 62 Roblox Approved assets, TWO original cooling meshes and all 7 real-engine suites.
name: One-time QA 2026-11-04 Tower Run True 3D Cooling Spires No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261104-towers-industrial-cooling-spires-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-tower-run-authored-cooling-qa-20261104
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Source integrity guard for the actual visual batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          server=Path("src/server/PremiumTowerCoolingSpireAssets.lua").read_text()
          hollowServer=Path("src/server/PremiumTowersHollowStackAssets.lua").read_text()
          client=Path("src/client/TowerCoolingSpireMeshKit.lua").read_text()
          sculptor=Path("tools/generate_original_towers_cooling_spire.py").read_text()
          hollowArt=Path("tools/generate_original_towers_cooling_stack.py").read_text()
          uploader=Path(".github/workflows/upload-original-3d-models.yml").read_text()
          source_gate=Path(".github/workflows/one-time-original-towers-cooling-spire-20261104.yml").read_text()
          hollowGate=Path(".github/workflows/one-time-original-towers-hollow-stack-20261104.yml").read_text()
          init=Path("src/server/init.server.lua").read_text()
          sampler=Path("src/client/scenery-lod.client.lua").read_text()
          visual_budget=Path("src/shared/VisualBudgetRules.lua").read_text()
          midground=Path("src/client/arena-midground-mass.client.lua").read_text()
          matrix=Path("tests/engine/gameplay-matrix.spec.luau").read_text()
          ci=Path(".github/workflows/ci.yml").read_text()
          docs=Path("docs/ORIGINAL_TOWER_RUN_COOLING_SPIRES_2026-11-04.md").read_text()
          dualDocs=Path("docs/ORIGINAL_TOWERS_COOLING_VARIANTS_2026-11-04.md").read_text()
          registry=json.loads(Path("assets/source/roblox-asset-registry.json").read_text())
          assert len(registry["models"])==62
          hollow=next(x for x in registry["models"]
              if x["name"]=="towers_cooling_stack")
          assert hollow["asset_id"]=="97498534364335"
          assert hollow["moderation"]=="Approved"
          assert hollow["workflow_run_id"]==41904135484
          assert hollow["source"]=="tools/generate_original_towers_cooling_stack.py"
          assert hollow["source_materials"]=="assets/source/chaos_route_kit.mtl"
          model=next(x for x in registry["models"]
              if x["name"]=="towers_cooling_spire")
          assert model["asset_id"]=="95543769387033"
          assert model["moderation"]=="Approved"
          assert model["workflow_run_id"]==41904066937
          assert model["source"]=="tools/generate_original_towers_cooling_spire.py"
          assert model["source_materials"]=="assets/source/chaos_route_kit.mtl"
          assert "95543769387033" in server and "95543769387033" in client
          assert "95543769387033" in docs
          assert "97498534364335" in dualDocs
          assert "95543769387033" in dualDocs
          assert "97498534364335" in hollowServer
          assert "97498534364335" in client
          assert "OriginalMeshScenery.sanitize(raw)" in hollowServer
          assert "ApprovedTowersHollowStackTemplates" in hollowServer
          assert "ApprovedTowersHollowStackTemplates" in client
          assert "HollowCoolingStack" in hollowServer and "HollowCoolingStack" in client
          assert "OriginalTowersHollowStack3D" in hollowServer and "OriginalTowersHollowStack3D" in client
          assert "Original3DTriangleCount" in hollowServer and "9980" in client
          assert "ReferenceNativeStackHeight" in hollowServer
          assert "PremiumTowersHollowStackAssets.start" in init
          assert "HOLLOW_SOURCE_SCALE=.46" in client
          assert "HOLLOW_BODY_HEIGHT=44" in client
          assert "hollowSource()" in client and "sourceForIndex(index)" in client
          assert "index%2==1" in client
          assert "SixteenFacetedDoubleWalledCoolingChimney" in hollowArt
          assert "BracedTopExhaustRing" in hollowArt
          assert "GalvanizedHighServiceLadderRail" in hollowArt
          assert "OriginalISOContainerShell" not in hollowArt
          assert "towers_cooling_stack" in uploader
          assert "towers_cooling_stack" in hollowGate
          assert "towers_cooling_stack" in ci
          assert "OriginalMeshScenery.sanitize(raw)" in server
          assert "ApprovedTowerCoolingSpireTemplates" in server and "ApprovedTowerCoolingSpireTemplates" in client
          assert "RealCoolingSpire" in server and "RealCoolingSpire" in client
          # The server intentionally names the seven-geometry counter
          # `count`; the client names it `n`. Check real semantics,
          # not a stale source-variable spelling from an earlier refactor.
          assert ("count~=7" in server or "n~=7" in server)
          assert "n~=7" in client
          assert "Original3DTriangleCount" in server and "6380" in client
          assert "SourceArchitecturalBodyHeight" in server
          assert "PremiumTowerCoolingSpireAssets.start" in init
          assert "OriginalTowerCoolingSpireLocal" in visual_budget
          assert "TowerCoolingSpireMeshKit.sync(arena,cameraPoint" in sampler
          assert "LocalOriginalTowerCoolingSpireCount" in sampler
          assert "OriginalTowerCoolingSpireIndex" in midground
          assert "OriginalTowerCoolingSpireIndex" in client
          assert "TowerCoolingMass" in midground and "TowerCoolingMass" in client
          assert "ArenaDetailKit.build" in midground
          assert "ORIGINAL_BODY_HEIGHT=40" in client and "SOURCE_SCALE=.42" in client
          assert "clone:ScaleTo(scale)" in client
          assert 'Low={models=0' in client
          assert 'Medium={models=2' in client
          assert 'High={models=5' in client
          assert "cameraPoint" in client and "OptionalVfxPressure" in sampler
          assert "part.Transparency=show and 1 or original" in client
          assert "part.Transparency=alpha" in client
          assert "part.CanCollide=false" in client and "part.CanTouch=false" in client
          assert "part.CanQuery=false" in client and "part.CastShadow=false" in client
          assert "GetDescendants()" in client
          assert "index=1,5" in client
          assert "TwelveSidedTaperedPressureCore" in sculptor
          assert "SixteenSidedPrimaryVentilationChimney" in sculptor
          assert "DualAuxiliaryRegulationVessel" in sculptor
          assert "WideForgedVentTorusCap" in sculptor
          assert "towers_cooling_spire" in uploader
          assert "towers_cooling_spire" in ci
          assert "assert len(models) == 62" in ci
          assert "RunService" not in client and "task.spawn" not in client
          assert 'for first=1,#entries-1,2 do' in matrix
          assert 'retains at least 40 unique compatible Double Chaos pairs' in matrix
          print("Verified five ORIGINAL approved Tower Run industrial 3D installations with TWO distinct Approved profiles (6380/9980 triangles, 7 UV/tangent MeshParts each), 62 source Models, exact mobile LOD/fallback and gameplay matrix. NO PUBLICATION")
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-tower-run-cooling-source-only",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
