name: Harbor genuine crane Android Low and shrink regression
on:
  pull_request:
    paths:
      - src/client/HarborGantryKineticMeshKit.lua
      - src/client/harbor-gantry-motion.client.lua
      - src/shared/HarborGantryMotionRules.lua
      - src/client/scenery-lod.client.lua
      - src/server/PremiumHarborGantryAssets.lua
      - src/server/MapBuilder.lua
      - src/shared/VisualBudgetRules.lua
      - assets/source/roblox-asset-registry.json
      - tools/verify_harbor_kinetic_low_and_shrink.py
      - .github/workflows/harbor-kinetic-low-shrink-regression.yml
  push:
    branches: [main]
    paths:
      - src/client/HarborGantryKineticMeshKit.lua
      - src/client/harbor-gantry-motion.client.lua
      - src/shared/HarborGantryMotionRules.lua
      - src/client/scenery-lod.client.lua
      - src/server/PremiumHarborGantryAssets.lua
      - src/server/MapBuilder.lua
      - src/shared/VisualBudgetRules.lua
      - assets/source/roblox-asset-registry.json
      - tools/verify_harbor_kinetic_low_and_shrink.py
      - .github/workflows/harbor-kinetic-low-shrink-regression.yml
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate creator source, native-crane fallback and authored shrink
        run: python3 tools/verify_harbor_kinetic_low_and_shrink.py
