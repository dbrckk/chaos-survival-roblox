name: One-shot Original 3D Arena Ground Art and Full Source Gate
on:
  push:
    branches: [feat/premium-imported-3d-arena-ground-tile-20261103]
    paths: [.github/workflows/one-shot-premium-ground-3d-source-gate-20261103.yml]
permissions:
  contents: read
jobs:
  verify-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate actual original 3D OBJ and verify UV/tangent glTF
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_premium_ground_tile.py --output assets/source/chaos_premium_ground_tile.obj
          python3 tools/obj_to_gltf.py --source assets/source/chaos_premium_ground_tile.obj --materials assets/source/chaos_route_kit.mtl --output /tmp/chaos_premium_ground_tile.gltf
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          gltf=json.loads(Path('/tmp/chaos_premium_ground_tile.gltf').read_text())
          raw=base64.b64decode(gltf['buffers'][0]['uri'].split(',',1)[1], validate=True)
          assert len(raw)==gltf['buffers'][0]['byteLength']
          primitives=gltf['meshes'][0]['primitives']
          assert len(primitives)>=5
          triangles=0
          for p in primitives:
              a=p['attributes']
              assert {'POSITION','NORMAL','TEXCOORD_0','TANGENT'}<=a.keys()
              counts={gltf['accessors'][a[key]]['count'] for key in ('POSITION','NORMAL','TEXCOORD_0','TANGENT')}
              assert len(counts)==1
              triangles+=gltf['accessors'][a['POSITION']]['count']//3
          assert 1000<triangles<16000
          print('Valid original UV/tangent 3D deck mesh:',triangles,'triangles',len(primitives),'materials')
          PY
      - name: Full pinned Luau source compilation
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          mkdir -p /tmp/luau && unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 | xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
      - name: Existing Android visual budget and complete Rojo place
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_mobile_vfx_first_frame.py
          curl -fLsS --retry 3 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          mkdir -p /tmp/rojo && unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          python3 tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel CANDIDATE
          /tmp/rojo/rojo build default.project.json -o /tmp/ChaosSurvival.rbxlx
          test -s /tmp/ChaosSurvival.rbxlx
          grep -Fq "$GITHUB_SHA" /tmp/ChaosSurvival.rbxlx
