# Strict server-owned route state controls native decor mask through collapse, shutter and shrink.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-05 Native 3D Route Fallback During Hazards No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-structural-hazard-native-mask-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-native-3d-hazard-fallback-qa-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact-index native fallback lifecycle source and real engine regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("src/client/PlatformNativeTrimReplacementKit.lua").read_text()
          physical=Path("src/client/arena-platform-identity.client.lua").read_text()
          kit=Path("src/client/PremiumLargeStructureMeshKit.lua").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          spec=Path("tests/engine/mapbuilder.spec.luau").read_text()
          doc=Path("docs/ROUTE_NATIVE_3D_FALLBACK_HAZARD_LIFECYCLE_2026-11-05.md").read_text()
          guards=(
              "function Kit.authorizesMask(owner, original, platforms)",
              'not owner.Anchored or not owner.CanCollide',
              'owner.Transparency >= 0.75',
              'phase ~= "Normal" and phase ~= "Safe"',
              'shutter ~= "Idle"',
              'math.abs(owner.Size.X-original.X) < 0.09',
              'math.abs(owner.Size.Z-original.Z) < 0.09',
              'local function physicalOwner(native)',
              'local function physicalSafe(native)',
              'Kit.authorizesMask(owner, owner and ownerBaselines[owner]',
              'local function reconcile()',
              'if part.Parent ~= activeDecor or not eligible(part)',
              'or not physicalSafe(part) then',
              'part.LocalTransparencyModifier = original',
              'part.LocalTransparencyModifier = 1',
              'part:GetAttributeChangedSignal(attribute):Connect(reconcile)',
              'part:GetPropertyChangedSignal(property):Connect(reconcile)',
              'folder.ChildAdded:Connect(function(part)',
              'folder.ChildRemoved:Connect(reconcile)',
              'child.Name == "Platforms" and child:IsA("Folder")',
              'watchers[#watchers + 1] = meshFolder.ChildRemoved:Connect(',
              'table.clear(verifiedSupportIndices)',
          )
          for g in guards:
              assert g in src, g
          for s in ("CollapsePhase","BridgeShutterPhase","CanCollide",
                    "Size","Transparency"):
              assert s in src and s in spec,(s,"lifecycle")
          assert 'PlatformNativeTrimReplacementKit.authorizesMask' in spec
          assert 'native structure masking only while physical route remains truly safe' in spec
          assert '"tests/engine/mapbuilder.spec.luau"' in cloud
          assert 'PlatformNativeTrimReplacementKit.bind' in physical
          assert 'Original3DAssetId' in kit and 'OwnerVerified' in kit
          assert "No publication" in doc or "non publié" in doc
          assert "RenderStepped" not in src and "Heartbeat" not in src
          assert "task.spawn(" not in src and "Instance.new(" not in src
          print("Real physical PlatformN/SkybridgeN owner, phase/shutter/shrink "
                "guard, event-driven fallback, server collision untouched, "
                "engine milestone spec present. NO PUBLISH.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-native-3d-hazard-fallback-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
