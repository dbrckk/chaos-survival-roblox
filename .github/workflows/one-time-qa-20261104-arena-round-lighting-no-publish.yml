# Five-arena lighting readability and secondary Darkness protection, no publish.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-04 Five Arena Round Lighting No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261104-arena-round-lighting-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-five-arena-round-lighting-qa-20261104
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Audit exact lighting source, hazard ownership and suite coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          shared=Path("src/shared/ArenaLightingReadabilityRules.lua").read_text()
          identity=Path("src/client/arena-lighting.client.lua").read_text()
          disaster=Path("src/client/juice.client.lua").read_text()
          test=Path("tests/engine/arena-focal-lighting-rules.spec.luau").read_text()
          docs=Path("docs/ARENA_ROUND_LIGHTING_READABILITY_2026-11-04.md").read_text()
          ci=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          for expected in (
              "Low = {", "Medium = {", "High = {",
              "ambientScale = 0.84", "ambientScale = 0.94",
              "readyDiffuse = 0.56", "roundDiffuse = 0.53",
              "readyDiffuse = 0.54", "roundDiffuse = 0.51",
              "readyDiffuse = 0.52", "roundDiffuse = 0.49",
              "darknessReady = 0.33", "darknessRound = 0.26",
              "darknessReady = 0.31", "darknessRound = 0.25",
              "darknessReady = 0.30", "darknessRound = 0.24",
              'disasterIds[index] == "Darkness"',
              "if phase ~= \"ready\" and phase ~= \"round\" then return nil end",
          ):
              assert expected in shared,expected
          assert "ArenaLightingReadabilityRules.identityScale" in identity
          assert "ArenaLightingReadabilityRules.disasterLighting" in disaster
          assert "Lighting.EnvironmentDiffuseScale = 0.34" not in disaster
          assert "Lighting.EnvironmentDiffuseScale = diffuse" in disaster
          assert "Lighting.EnvironmentSpecularScale = specular" in disaster
          assert "LocalDarknessLightGuard" in disaster
          assert "LocalRoundDiffuseTarget" in disaster
          assert "setHazardBrightness(targetBrightness, blackoutWindow)" in disaster
          assert "profile.Brightness" in disaster
          assert "ArenaLightingReadabilityRules" in test
          assert "secondary in Double Chaos" in test
          assert 'tests/engine/arena-focal-lighting-rules.spec.luau' in ci
          assert "Darkness" in docs
          assert "RenderStepped" not in shared
          assert "Instance.new" not in shared
          assert "RemoteEvent" not in shared
          print("Exact source owner boundaries, five-arena mobile material bounce, "
                "Blackout/secondary Darkness guards and release suite coverage verified. "
                "NO PUBLICATION.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-five-arena-round-lighting-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
