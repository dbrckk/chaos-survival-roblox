# One-time high-impact Orbital 3D silhouette identity and visual continuity milestone. Never publish.
name: One-time QA 2026-11-05 Orbital Stable 3D Sectors No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-stable-orbital-station-sectors-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-orbital-stable-six-station-sectors-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Certify six genuine, stationary Orbitals at unchanged mobile 3D caps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rules=Path("src/shared/OrbitalStationLayoutRules.lua").read_text()
          mid=Path("src/client/arena-midground-mass.client.lua").read_text()
          kit=Path("src/client/OriginalOrbitalStationsMeshKit.lua").read_text()
          tests=Path("tests/engine/visual-budget-rules.spec.luau").read_text()
          engine=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          docs=Path("docs/VIS_ORBITAL_STABLE_3D_STATION_SECTORS_ACROSS_ANDROID_TIERS_2026-11-05.md").read_text()
          assert 'Low = {1, 3, 6}' in rules
          assert 'Medium = {1, 3, 4, 6}' in rules
          assert 'High = {1, 2, 3, 4, 5, 6}' in rules
          assert '((index - 1) / 6) * math.pi * 2 + math.rad(18)' in rules
          assert 'function Rules.offset(baseSize, index)' in rules
          assert 'for _, i in ipairs(OrbitalStationLayoutRules.indices(tier.Name)) do' in mid
          assert 'local angle = OrbitalStationLayoutRules.angle(i)' in mid
          assert 'local origin = OrbitalStationLayoutRules.offset(base.Size, i)' in mid
          assert 'frame(base, origin.X, origin.Y, origin.Z, 0)' in mid
          assert '((i - 1) / count)' not in mid
          assert 'local expectedOffset = OrbitalStationLayoutRules.offset(base.Size, index)' in kit
          assert 'if (localPos - expectedOffset).Magnitude > .35 then return false end' in kit
          assert 'Original3DAssetId' in kit and 'OwnerVerified' in kit
          assert 'Low = {count=1, distance=290, hysteresis=25}' in kit
          assert 'Medium = {count=3, distance=345, hysteresis=34}' in kit
          assert 'High = {count=6, distance=430, hysteresis=46}' in kit
          assert 'keeps six orbital station source identities in fixed sectors' in tests
          assert 'expect(#low).toBe(3)' in tests and 'expect(#high).toBe(6)' in tests
          assert '"tests/engine/visual-budget-rules.spec.luau"' in engine
          assert 'Low → Medium → High' in docs
          assert 'RenderStepped:Connect(' not in rules
          assert 'Instance.new(' not in rules
          print("Orbital 3D original station indexes stay in fixed six world"
                " sectors across Android Low/Medium/High; approved"
                " sources cannot mount wrong tier/moved native anchors."
                " No added meshes or publish.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-orbital-fixed-six-sector-quality-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
