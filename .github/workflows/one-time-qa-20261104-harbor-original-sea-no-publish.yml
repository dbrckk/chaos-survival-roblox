# Large Harbor milestone: original true wave-sculpted ocean and repaired Cloud matrix, no
# game publishing. This file alone triggers the checks on exact main SHA.
# Exact main SHA: 60 Roblox approved assets, dry 320-stud center and all 7 real engine suites.
name: One-time QA 2026-11-04 Harbor True Sculpted Sea 3D No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261104-harbor-original-sea-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-harbor-true-sculpted-sea-qa-20261104
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Source integrity guard for the actual visual batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          server=Path("src/server/PremiumHarborSeaAssets.lua").read_text()
          client=Path("src/client/HarborSeaMeshKit.lua").read_text()
          generator=Path("tools/generate_original_harbor_sea.py").read_text()
          marine=Path("assets/source/chaos_harbor_sea.mtl").read_text()
          converter=Path("tools/obj_to_gltf.py").read_text()
          uploader=Path(".github/workflows/upload-original-3d-models.yml").read_text()
          init=Path("src/server/init.server.lua").read_text()
          sampler=Path("src/client/scenery-lod.client.lua").read_text()
          census=Path("src/shared/VisualBudgetRules.lua").read_text()
          barges=Path("src/client/arena-midground-mass.client.lua").read_text()
          matrix=Path("tests/engine/gameplay-matrix.spec.luau").read_text()
          ci=Path(".github/workflows/ci.yml").read_text()
          registry=json.loads(Path("assets/source/roblox-asset-registry.json").read_text())
          assert len(registry["models"])==60
          entry=next(v for v in registry["models"]
              if v["name"]=="harbor_sea_apron")
          assert entry["asset_id"]=="111296950975600"
          assert entry["moderation"]=="Approved"
          assert entry["workflow_run_id"]==41889798492
          assert entry["source"]=="tools/generate_original_harbor_sea.py"
          assert entry["source_materials"]=="assets/source/chaos_harbor_sea.mtl"
          assert "111296950975600" in server and "111296950975600" in client
          assert "OriginalMeshScenery.sanitize(raw)" in server
          assert "ApprovedHarborSeaTemplates" in server
          assert "SculptedSea" in server and "SculptedSea" in client
          assert "n~=7" in server and "n~=7" in client
          assert "Original3DTriangleCount" in server and "6152" in client
          assert "SourceDryInnerHalfWidth" in server
          assert "PremiumHarborSeaAssets.start" in init
          assert "OriginalHarborSculptedSeaLocal" in census
          assert "HarborSeaMeshKit.sync(arena,cameraPoint" in sampler
          assert "LocalOriginalHarborSeaCount" in sampler
          assert "SOURCE_SCALE=.05" in client
          assert "SOURCE_CENTER=Vector3.new(0,.01085,0)" in client
          assert "clone:ScaleTo(FINAL_SCALE)" in client
          assert "p.CanCollide=false" in client
          assert "p.CanTouch=false" in client
          assert "p.CanQuery=false" in client
          assert "p.CastShadow=false" in client
          assert "not base.Anchored" in client
          assert "GeneratedMap" in client and "VariantId" in client
          assert "Low=470" in client and "Medium=610" in client
          assert "High=730" in client
          assert "SHRINK" not in client and "RunService" not in client
          assert "task.spawn" not in client
          assert 'Base' in barges and "base.Size.Y * 0.5 - 1.35" in barges
          assert "WorldDepth" not in generator
          assert "INNER = 8.24" in generator
          assert "OUTER = 24.0" in generator
          assert "IntermittentMaritimeShoreFoam" in generator
          assert "OriginalFreighterWaveWake" in generator
          assert "OceanBlueFacetedWaveSheet" in generator
          assert "chaos_harbor_sea.mtl" in converter
          assert "metallicFactor" in converter and "roughnessFactor" in converter
          assert "newmtl ARMOR" in marine and "newmtl SIGNAL" in marine
          assert "harbor_sea_apron" in uploader
          assert "assert len(models) == 60" in ci
          assert "harbor_sea_apron" in ci
          assert 'for first=1,#entries-1,2 do' in matrix
          assert 'retains at least 40 unique compatible Double Chaos pairs' in matrix
          assert 'executeSet({a.Module,b.Module},"Classic")' in matrix
          print("Verified 60 approved original Models, true dry-center 6152-triangle sea, zero new physical water surfaces, full Harbor LOD and preserved Double Chaos matrix. NO PUBLIC GAME PUBLISH")
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-harbor-sculpted-sea-source-only",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
