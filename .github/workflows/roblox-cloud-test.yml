name: Roblox Open Cloud Engine Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: roblox-cloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: engine (all five suites)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    # All five shards share ONE job and ONE cross-branch mutex.
    # The previous max-parallel: 1 was per workflow run, so six PRs
    # could still hammer the same owner-wide Roblox execution quota.
    concurrency:
      group: roblox-cloud-owner-single-flight
      cancel-in-progress: false
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Roblox Cloud configuration
        id: config
        shell: bash
        run: |
          if [ -n "$ROBLOX_API_KEY" ] && [ -n "$ROBLOX_UNIVERSE_ID" ] && [ -n "$ROBLOX_PLACE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Open Cloud test skipped: configure ROBLOX_API_KEY secret and ROBLOX_UNIVERSE_ID / ROBLOX_PLACE_ID repository variables."
          fi

      - name: Install Lest 0.6.0
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL -o /tmp/lest.zip https://github.com/lest-luau/lest/releases/download/v0.6.0/lest-0.6.0-linux-x86_64.zip
          unzip -q /tmp/lest.zip -d /tmp/lest
          chmod +x /tmp/lest/lest
          echo "/tmp/lest" >> "$GITHUB_PATH"
          /tmp/lest/lest --version

      - name: Generate sharded CI test config
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          cat > lest.ci.toml <<EOF
          [suites.core_a]
          include = [
            "tests/engine/achievements.spec.luau",
            "tests/engine/ai-survivor-rules.spec.luau",
            "tests/engine/animation-catalog.spec.luau",
            "tests/engine/arena-focal-lighting-rules.spec.luau",
            "tests/engine/arena-material-rules.spec.luau",
            "tests/engine/arena-crisis-surface.spec.luau",
            "tests/engine/arena-presentation.spec.luau",
            "tests/engine/arena-spatial-audio-rules.spec.luau",
            "tests/engine/arena-variants.spec.luau",
            "tests/engine/audio-config.spec.luau",
            "tests/engine/body-motion-rules.spec.luau",
            "tests/engine/landmark-disaster-reactions.spec.luau",
            "tests/engine/character-polish-rules.spec.luau",
            "tests/engine/cosmetics.spec.luau",
            "tests/engine/core-localization.spec.luau",
            "tests/engine/daily-quests.spec.luau",
            "tests/engine/daily-rewards.spec.luau",
            "tests/engine/data-schema.spec.luau",
            "tests/engine/data-session.spec.luau",
            "tests/engine/first-time-experience.spec.luau",
            "tests/engine/game-analytics.spec.luau",
          ]
          backend = "cloud"
          default = false

          [suites.core_b1]
          include = [
            "tests/engine/attention-budget-rules.spec.luau",
            "tests/engine/lobby-presentation-rules.spec.luau",
            "tests/engine/lobby-showtime-rules.spec.luau",
            "tests/engine/mastery.spec.luau",
            "tests/engine/monetization-rules.spec.luau",
            "tests/engine/movement-assist-rules.spec.luau",
            "tests/engine/rate-limiter.spec.luau",
            "tests/engine/remote-registry.spec.luau",
            "tests/engine/result-presentation.spec.luau",
            "tests/engine/round-event-presentation.spec.luau",
            "tests/engine/session-streak.spec.luau",
          ]
          backend = "cloud"
          default = false

          [suites.core_b2]
          include = [
            "tests/engine/share-moment-rules.spec.luau",
            "tests/engine/social-experience-rules.spec.luau",
            "tests/engine/solo-rush.spec.luau",
            "tests/engine/spectator-target-rules.spec.luau",
            "tests/engine/ground-contact-rules.spec.luau",
            "tests/engine/survival-feedback.spec.luau",
            "tests/engine/surface-audio-rules.spec.luau",
            "tests/engine/ui-responsive.spec.luau",
            "tests/engine/vfx-quality.spec.luau",
            "tests/engine/aerial-survey.spec.luau",
            "tests/engine/visual-budget-rules.spec.luau",
            "tests/engine/weekly-challenges.spec.luau",
            "tests/engine/world-depth-rules.spec.luau",
          ]
          backend = "cloud"
          default = false

          [suites.gameplay]
          include = [
            "tests/engine/arena-mechanics.spec.luau",
            "tests/engine/chaos-fusion.spec.luau",
            "tests/engine/contestant-scope.spec.luau",
            "tests/engine/disaster-balance.spec.luau",
            "tests/engine/disaster-atmosphere-layout.spec.luau",
            "tests/engine/disaster-climax.spec.luau",
            "tests/engine/disaster-impact.spec.luau",
            "tests/engine/elimination-cause-rules.spec.luau",
            "tests/engine/disaster-residue.spec.luau",
            "tests/engine/disaster-runtime.spec.luau",
            "tests/engine/disaster-setpiece.spec.luau",
            "tests/engine/disaster-visuals.spec.luau",
            "tests/engine/flow-combo.spec.luau",
            "tests/engine/hazard-warning.spec.luau",
            "tests/engine/lobby-activities.spec.luau",
            "tests/engine/lobby-return-formation.spec.luau",
            "tests/engine/mapbuilder.spec.luau",
            "tests/engine/movement-safety.spec.luau",
            "tests/engine/round-challenge.spec.luau",
            "tests/engine/round-cleanup-resilience.spec.luau",
            "tests/engine/round-cleanup.spec.luau",
            "tests/engine/round-collectibles.spec.luau",
            "tests/engine/round-intensity.spec.luau",
            "tests/engine/round-medals.spec.luau",
            "tests/engine/round-momentum.spec.luau",
            "tests/engine/round-variety.spec.luau",
            "tests/engine/shrinking-arena.spec.luau",
          ]
          backend = "cloud"
          default = false

          [suites.matrix]
          include = ["tests/engine/gameplay-matrix.spec.luau"]
          backend = "cloud"
          default = false

          [place]
          universe_id = $ROBLOX_UNIVERSE_ID
          place_id = $ROBLOX_PLACE_ID

          [settings]
          backend = "native"
          timeout_ms = 10000
          EOF

      - name: Verify engine spec shard coverage
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import tomllib
          from collections import Counter

          with open("lest.ci.toml", "rb") as handle:
              config = tomllib.load(handle)

          assigned = []
          for suite in ("core_a", "core_b1", "core_b2", "gameplay", "matrix"):
              assigned.extend(config["suites"][suite]["include"])

          actual = sorted(glob.glob("tests/engine/**/*.spec.luau", recursive=True))
          counts = Counter(assigned)
          missing = sorted(set(actual) - set(assigned))
          duplicates = sorted(path for path, count in counts.items() if count != 1)
          extra = sorted(set(assigned) - set(actual))

          if missing or duplicates or extra:
              print("Invalid Open Cloud shard coverage")
              print("missing:", missing)
              print("duplicates:", duplicates)
              print("extra:", extra)
              raise SystemExit(1)

          print(f"All {len(actual)} engine specs are assigned exactly once.")
          PY

      - name: Batch and verify real-engine test specs
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          python tools/prepare_cloud_batches.py --self-test
          python tools/prepare_cloud_batches.py
          # Check generated Luau after expansion; the ordinary build
          # validates source specs but not these ephemeral bundles.
          curl --retry 4 --retry-all-errors --retry-delay 3 -fsSL -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          find tests/engine -maxdepth 1 -name '__ci_*.spec.luau' -print0 |
            xargs -0 -r -n1 /tmp/luau/luau-compile >/dev/null

      - name: Run sharded tests in real Roblox engine
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          run_suite() {
            suite="$1"
            max_attempts=4
            attempt=1

            echo "::group::Open Cloud suite: $suite"

            while [ "$attempt" -le "$max_attempts" ]; do
              log="/tmp/lest-$suite-attempt-$attempt.log"
              echo "Attempt $attempt/$max_attempts for $suite"

              set +e
              lest run --config lest.ci-batched.toml "$suite" 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
              set -e

              if [ "$status" -eq 0 ]; then
                echo "::endgroup::"
                return 0
              fi

              # Roblox may return HTTP 429 during high Open Cloud demand.
              # A rate limit is transient, unlike failed gameplay assertions.
              if grep -Eiq 'HTTP 429|Too Many Requests|rate.limit(ed|ing)?' "$log"; then
                cause="Open Cloud throttling"
                # Back off the owner-wide rate limit, not just the local
                # runner: every call still reaches the same Roblox owner.
                delay=$((75 * 2 ** (attempt - 1) + RANDOM % 20))
              elif grep -Eq 'did not finish within the deadline|last state: PROCESSING' "$log"; then
                cause="Open Cloud task timeout"
                delay=$((12 * attempt))
              else
                echo "Non-transient Open Cloud failure for $suite; not retrying."
                echo "::endgroup::"
                return "$status"
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Transient $cause persisted after $max_attempts attempts for $suite."
                echo "::endgroup::"
                return "$status"
              fi

              echo "Transient $cause for $suite; retrying after ${delay}s."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          # Keep each suite separately named/reported for release auditing.
          # No simultaneous jobs submit execution tasks to the same owner.
          for suite in gameplay matrix core_a core_b1 core_b2; do
            run_suite "$suite"
          done
