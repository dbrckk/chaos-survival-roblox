name: Roblox Open Cloud Engine Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Roblox Cloud configuration
        id: config
        shell: bash
        run: |
          if [ -n "$ROBLOX_API_KEY" ] && [ -n "$ROBLOX_UNIVERSE_ID" ] && [ -n "$ROBLOX_PLACE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Open Cloud test skipped: configure ROBLOX_API_KEY secret and ROBLOX_UNIVERSE_ID / ROBLOX_PLACE_ID repository variables."
          fi

      - name: Install Lest 0.6.0
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          curl -fsSL -o /tmp/lest.zip https://github.com/lest-luau/lest/releases/download/v0.6.0/lest-0.6.0-linux-x86_64.zip
          unzip -q /tmp/lest.zip -d /tmp/lest
          chmod +x /tmp/lest/lest
          echo "/tmp/lest" >> "$GITHUB_PATH"
          /tmp/lest/lest --version

      - name: Generate CI test config
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          cat > lest.ci.toml <<EOF
          [suites.engine]
          include = ["tests/engine/**/*.spec.luau"]
          backend = "cloud"
          default = false

          [place]
          universe_id = $ROBLOX_UNIVERSE_ID
          place_id = $ROBLOX_PLACE_ID
          rojo = "default.project.json"

          [settings]
          backend = "native"
          timeout_ms = 10000
          EOF

      - name: Run tests in real Roblox engine
        if: steps.config.outputs.ready == 'true'
        run: lest run --config lest.ci.toml engine
