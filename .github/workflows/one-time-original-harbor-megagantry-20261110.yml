# Authentic original Harbor Model upload ONLY; never publishes a Roblox Place.
name: One-time Original Harbor Sculpted Megagantry 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-harbor-megagantry-20261110.yml
permissions:
  contents: read
concurrency:
  group: chaos-original-harbor-megagantry-20261110
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate forged Harbor gantry geometry and seven genuine PBR glTF materials
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_signature_harbor_gantry.py --output "$RUNNER_TEMP/original_harbor_gantry.obj" > "$RUNNER_TEMP/original_harbor_gantry.json"
          python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/original_harbor_gantry.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/original_harbor_gantry.gltf" > "$RUNNER_TEMP/original_harbor_gantry-gltf.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          obj=(root/'original_harbor_gantry.obj').read_bytes()
          meta=json.loads((root/'original_harbor_gantry.json').read_text())
          gltf=json.loads((root/'original_harbor_gantry.gltf').read_text())
          assert meta['asset']=='signature_harbor_sculpted_gantry'
          assert hashlib.sha256(obj).hexdigest()==meta['sha256']
          assert 60<=meta['groups']<=260 and 1800<=meta['triangles']<=10000
          palette={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          assert set(meta['materials'])==palette
          w,h,d=meta['bounds']
          assert 40.5<=w<=41.05 and 13.85<=h<=14.35 and 8.75<=d<=9.30
          assert all(abs(v)<.25 for v in meta['center'])
          for required in (b'SweptSeventySixFacetForgeCraneGirder',
                           b'TriangulatedGantryWeb',
                           b'ContinuousCounterweightCore',
                           b'MilledCounterbalanceCoolingFin',
                           b'ClosedPilotHouseFraming',
                           b'FrontCabinWindshieldStrut',
                           b'RecessedPortSignalIndicator'):
              assert required in obj,required
          assert gltf['asset']['version']=='2.0'
          assert {m['name'] for m in gltf['materials']}==palette
          primitives=gltf['meshes'][0]['primitives']
          assert len(primitives)==7
          assert sum(gltf['accessors'][p['attributes']['POSITION']]['count']//3 for p in primitives)==meta['triangles']
          assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'}<=set(p['attributes']) for p in primitives)
          buffer=gltf['buffers'][0]
          assert len(base64.b64decode(buffer['uri'].split(',',1)[1],validate=True))==buffer['byteLength']
          # Assert the four gameplay-signature natives remain in the
          # MapBuilder source as an explicit future safe fallback.
          source=Path('src/server/MapBuilder.lua').read_text()
          for name in ('"QuayCraneSpanningBeam"','"QuayCraneCounterweight"',
                       '"QuayControlCab"','"QuayHoistPort"','"QuayHoistStarboard"'):
              assert name in source,name
          print('SOURCE PASS Harbor forged mega-gantry',meta['triangles'],meta['bounds'],meta['sha256'])
          print('NO ROBLOX PLACE PUBLICATION')
          PY
  owner-import:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: signature_harbor_sculpted_gantry
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
