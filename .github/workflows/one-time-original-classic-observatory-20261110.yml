# One-time original Model asset only. Never publish or edit a Roblox Place.
name: One-time Original Classic Dual Dish Observatory 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-classic-observatory-20261110.yml
permissions:
  contents: read
concurrency:
  group: chaos-original-classic-observatory-model-20261110
  cancel-in-progress: false

jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-authored twin concave receivers and 3D industrial mast
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_signature_classic_observatory.py --output "$RUNNER_TEMP/original_classic_observatory.obj" > "$RUNNER_TEMP/original_classic_observatory.json"
          python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/original_classic_observatory.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/original_classic_observatory.gltf" > "$RUNNER_TEMP/original_classic_observatory-gltf.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64, hashlib, json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          original=(root/'original_classic_observatory.obj').read_bytes()
          meta=json.loads((root/'original_classic_observatory.json').read_text())
          gltf=json.loads((root/'original_classic_observatory.gltf').read_text())
          assert meta['asset']=='signature_classic_sculpted_observatory'
          assert hashlib.sha256(original).hexdigest()==meta['sha256']
          assert 70<=meta['groups']<=240 and 3400<=meta['triangles']<=12500
          assert set(meta['materials'])=={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          x,y,z=meta['bounds']
          assert 8.96<=x<=9.23 and 15.06<=y<=15.13 and 1.01<=z<=1.11
          assert all(abs(v)<.12 for v in meta['center'])
          for label in ('West','East'):
              for required in ('TrueConcaveParabolicReceiverFront',
                               'ParabolicForgedDishBackHousing',
                               'TrueContinuousHollowMachinedReceiverRim',
                               'ForgedReceiverFeedHub','BackRadialDishWeb'):
                  assert (required+label).encode() in original,(required,label)
          for term in (b'ClosedTwelveFacetTaperedPrimaryRelayMast',
                       b'SculptedWedgeFreeCrownCanopy',
                       b'EightFacetContinuousReceiverSkybridge',
                       b'CrownSkywardSignalCap'):
              assert term in original,term
          assert gltf['asset']['version']=='2.0'
          assert {m['name'] for m in gltf['materials']}==set(meta['materials'])
          primitives=gltf['meshes'][0]['primitives']
          assert len(primitives)==7
          assert sum(gltf['accessors'][p['attributes']['POSITION']]['count']//3
                     for p in primitives)==meta['triangles']
          assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'} <=
                     set(p['attributes']) for p in primitives)
          buffer=gltf['buffers'][0]
          assert len(base64.b64decode(buffer['uri'].split(',',1)[1],validate=True))==buffer['byteLength']
          source=Path('src/server/MapBuilder.lua').read_text()
          for name in ('"PrimaryRelayMast"','"RelayHead"','"DishBridge"',
                       '"ReceiverDishWest"','"ReceiverDishEast"',
                       '"ReceiverHubWest"','"ReceiverHubEast"'):
              # The dish identifiers are produced by string ternaries.
              assert name in source,name
          print('SOURCE PASS Classic original dual dish observatory',
                meta['triangles'],meta['groups'],meta['bounds'],meta['sha256'])
          print('NO ROBLOX PLACE PUBLISH')
          PY

  owner-import:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: signature_classic_sculpted_observatory
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
