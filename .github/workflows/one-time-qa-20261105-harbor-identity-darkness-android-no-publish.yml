# Important visual milestone, source and real Roblox engine only. NEVER publish.
# Revalidated after correcting ci.yml's obsolete phase-only lighting guard.
# Refuse a phase-only short circuit: Darkness can arrive in slot 2 midround.
name: One-time QA 2026-11-05 Harbor Identity Darkness Android No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-harbor-identity-darkness-android-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-harbor-identity-android-darkness-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent Harbor identity and intentional Darkness on mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          nav=Path("src/client/arena-navigation-language.client.lua").read_text()
          reveal=Path("src/client/arena-reveal.client.lua").read_text()
          lighting=Path("src/client/arena-lighting.client.lua").read_text()
          rules=Path("src/shared/ArenaLightingReadabilityRules.lua").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          contract=Path("docs/VIS_HARBOR_REAL_IDENTITY_AND_ANDROID_DARKNESS_LIGHTING_2026-11-05.md").read_text()
          for marker in (
              'elseif variant == "Harbor" then',
              'CenterHarborPortBerth',
              'CenterHarborStarboardBerth',
              'side * span * 0.092',
              'ArenaFloorFollowerKit.bind(',
          ):
              assert marker in nav,marker
          for marker in (
              'local function spawnHarborSignature(',
              'spawnHarborSignature(center, base, theme, tier)',
              'LocalArenaRevealHarborBerth',
              'local count = tier.Name == "High" and 4 or 2',
              'if reducedMotion or tier.Name == "Low" then',
              'part.CanCollide = false',
          ):
              assert marker in reveal,marker
          for marker in (
              'local darknessActive = false',
              'and not darknessActive then',
              'ArenaLightingReadabilityRules.hasDarkness(state.disasterIds)',
              'LocalIdentityDarknessFillSuppressed',
              'if nextPhase == phase and nextDarkness == darknessActive then return end',
              'local hasIds = type(state.disasterIds) == "table"',
          ):
              assert marker in lighting,marker
          assert 'for index = 1, 2 do' in rules
          assert 'if disasterIds[index] == "Darkness" then return true end' in rules
          assert 'Source' not in "" 
          assert 'no new published Roblox build' in contract
          assert '"tests/engine/visual-budget-rules.spec.luau"' in cloud
          print("Harbor distinct visible identity and short noncolliding"
                " source-only reveal confirmed. Android normal round fill"
                " remains but Darkness slot 1/2 guard suppresses its override."
                " NO PUBLISH.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-harbor-darkness-android-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
