# Genuine physical H-junction connectivity prioritization, verified model quotas; never publish.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-05 Real Connected 3D Sky Route Junctions No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-real-connected-3d-sky-route-junctions-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-real-sky-route-junctions-3d-qa-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Guard genuine physically adjacent permanent-route 3D residency and engine examples
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          kit=Path("src/client/PremiumRouteMeshKit.lua").read_text()
          lod=Path("src/client/scenery-lod.client.lua").read_text()
          test=Path("tests/engine/visual-budget-rules.spec.luau").read_text()
          source=Path("src/server/PremiumRouteMeshAssets.lua").read_text()
          arena=Path("src/server/ArenaVariants.lua").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          census=Path("src/shared/VisualBudgetRules.lua").read_text()
          doc=Path("docs/APPROVED_CONTIGUOUS_3D_SKY_ROUTE_JUNCTIONS_2026-11-05.md").read_text()
          asserts=(
              'PremiumSkybridgeModule = 94023662427980',
              'Medium = {decks = 8, bridges = 3, segments = 3',
              'High = {decks = 12, bridges = 5, segments = 4',
              'local function realRouteJunction(first, second)',
              'PremiumRouteMeshKit.realRouteJunction = realRouteJunction',
              'function PremiumRouteMeshKit.connectedPairsCount()',
              'first.Parent.Name ~= "Platforms"',
              'first.Parent ~= second.Parent',
              'first.Anchored or not second.Anchored',
              'safePlatform(first) or not safePlatform(second)',
              'math.abs(stepA-stepB) ~= 1',
              'gap >= 0.35 and gap <= 4.5',
              'math.abs(alongA:Dot(alongB)) > 0.20',
              'spineStep ~= 1 and spineStep ~= 10',
              'promenadeStep ~= 4 and promenadeStep ~= 5',
              'score -= 38',
              'math.min(bridgeCap, #qualified)',
              'fit.longCoverage >= 0.68',
              'fit.widthCoverage >= 0.65',
              'function PremiumRouteMeshKit.coveredPanelCount()',
              'function PremiumRouteMeshKit.sourceFit(',
          )
          for check in asserts:
              assert check in kit, check
          assert 'LocalOriginalConnectedRoute3DPairs' in lod
          assert 'keeps genuine nearby 3D Sky Spine and promenade skins together' in test
          assert 'expect(real(a,b)).toBe(true)' in test
          assert 'expect(real(a,spine)).toBe(true)' in test
          assert 'expect(real(a,spine)).toBe(false)' in test
          assert 'expect(real(b,decoy)).toBe(false)' in test
          assert '"tests/engine/visual-budget-rules.spec.luau"' in cloud
          assert 'OriginalGroundPbrTemplates' in census or 'PremiumRouteMeshLocal' in census
          assert 'PermanentRoute = true' in arena and 'SkySpinePlatforms' in arena
          assert 'Original3DAssetId' in source and '94023662427980' in source
          assert 'aucune publication' in doc.lower()
          assert 'Instance.new(' not in kit[kit.index('local function routeFamily('):kit.index('local function eligible(')]
          assert 'RunService' not in kit and 'Heartbeat' not in kit
          print("Physical 2.4-stud jump gaps preserved; 2x8 promenade steps,"
                " 10 Sky Spine steps, true H junction, safe mobile 3/5"
                " authentic 3D selection and engine cases validated."
                " NO PUBLICATION.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-real-sky-route-junctions-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
