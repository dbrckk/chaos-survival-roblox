# Single-use, owner-authorized upload of ORIGINAL underdeck 3D geometry.
# This workflow is a staging step and NEVER publishes or edits the game.
# One exact-path main push only. Source gate occurs BEFORE any remote POST.
name: One-time Import Original Underdeck Chassis 3D 2026-11-03
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-import-original-underdeck-chassis-20261103.yml'
permissions:
  contents: read
concurrency:
  group: chaos-owner-original-underdeck-source-import-once-20261103
  cancel-in-progress: false
jobs:
  source-gate:
    name: Confirm original engineered underdeck triangles before upload
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Confirm genuine source geometry and material inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_underdeck_chassis.py \
            --output assets/source/chaos_underdeck_chassis.obj | tee "$RUNNER_TEMP/underdeck-source.json"
          python3 tools/obj_to_gltf.py \
            --source assets/source/chaos_underdeck_chassis.obj \
            --materials assets/source/chaos_route_kit.mtl \
            --output "$RUNNER_TEMP/chaos_underdeck_chassis.gltf"
          python3 - "$RUNNER_TEMP/underdeck-source.json" "$RUNNER_TEMP/chaos_underdeck_chassis.gltf" <<'PY'
          import json,sys,base64
          from pathlib import Path
          art=json.loads(Path(sys.argv[1]).read_text())
          doc=json.loads(Path(sys.argv[2]).read_text())
          assert art["name"]=="underdeck_chassis"
          assert 1400<=art["triangles"]<=8500
          assert art["bounds_max"][1]<=.001
          assert 22<=art["dimensions"][0]<=25
          assert 3<=art["dimensions"][1]<=8
          assert 8<=art["dimensions"][2]<=12
          assert doc["asset"]["version"]=="2.0"
          assert {m["name"] for m in doc["materials"]}=={
              "ARMOR","BRUSHED","CARBON","GRIP","ALLOY","CERAMIC","SIGNAL"}
          parts=doc["meshes"][0]["primitives"]
          assert len(parts)==7
          count=sum(doc["accessors"][p["attributes"]["POSITION"]]["count"]//3
                    for p in parts)
          assert count==art["triangles"],(count,art["triangles"])
          assert all({"POSITION","NORMAL","TEXCOORD_0","TANGENT"}
                     <=set(p["attributes"]) for p in parts)
          raw=base64.b64decode(doc["buffers"][0]["uri"].split(",",1)[1],validate=True)
          assert len(raw)==doc["buffers"][0]["byteLength"]
          print("AUTHORIZED SOURCE-GATE PASS: real authored underdeck geometry with 7 materials; no game change.",count)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chaos-original-underdeck-source-art
          path: |
            ${{ runner.temp }}/chaos_underdeck_chassis.gltf
            ${{ runner.temp }}/underdeck-source.json
          retention-days: 14
  import-approved-owner:
    name: Create creator-owned underdeck Roblox Model asset
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: underdeck_chassis
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
