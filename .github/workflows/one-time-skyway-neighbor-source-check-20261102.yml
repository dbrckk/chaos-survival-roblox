# Final candidate includes safe rooftop social pursuit and floor-only mobility filtering.
name: One-Time Skyway Neighbor Source Validation 2026-11-02
on:
  push:
    branches: [fix/skyway-neighbor-routing-20261102]
    paths:
      - .github/workflows/one-time-skyway-neighbor-source-check-20261102.yml

permissions:
  contents: read

jobs:
  source-build:
    if: github.repository == 'dbrckk/chaos-survival-roblox'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Parse all real Luau source and engine specs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 \
            -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          unzip -tq /tmp/luau.zip >/dev/null
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 |
            xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
      - name: Verify Android VFX first-frame budgets
        run: python tools/validate_mobile_vfx_first_frame.py
      - name: Build real place file from reviewed SHA
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 \
            -o /tmp/rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -tq /tmp/rojo.zip >/dev/null
          mkdir -p /tmp/rojo
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          python3 tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel CANDIDATE
          mkdir -p build
          /tmp/rojo/rojo build default.project.json -o build/ChaosSurvival.rbxlx
          test -s build/ChaosSurvival.rbxlx
          grep -Fq "$GITHUB_SHA" build/ChaosSurvival.rbxlx
