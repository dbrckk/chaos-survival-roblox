name: One-Time PR554 Luau and Roblox Build Review
on:
  push:
    branches:
      - feat/ai-detours-monument-supports-20261102
    paths:
      - .github/workflows/one-time-pr554-luau-build-review.yml

permissions:
  contents: read

jobs:
  source-build:
    if: github.repository == 'dbrckk/chaos-survival-roblox'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned Luau compiler archive and parse all source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 90 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          unzip -tq /tmp/luau.zip >/dev/null
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 |
            xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
      - name: Validate mobile effects budget
        run: python tools/validate_mobile_vfx_first_frame.py
      - name: Build exact review candidate with pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 90 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -o /tmp/rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -tq /tmp/rojo.zip >/dev/null
          mkdir -p /tmp/rojo
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          python3 tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel CANDIDATE
          mkdir -p build
          /tmp/rojo/rojo build default.project.json -o build/ChaosSurvival.rbxlx
          test -s build/ChaosSurvival.rbxlx
          grep -Fq "$GITHUB_SHA" build/ChaosSurvival.rbxlx
          echo "PR554 source compiled and place built for exact review SHA $GITHUB_SHA"
