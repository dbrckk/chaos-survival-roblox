# Only source-authentic gateway SIGNAL lights with active Darkness guard; never publish.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-05 Approved Sky Spine Signal Illumination No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-approved-sky-spine-signal-illumination-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-sky-spine-signal-lighting-qa-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Guard authenticated gateway SIGNAL light budget, Darkness protection and real-engine cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          kit=Path("src/client/SkySpineCrownMeshKit.lua").read_text()
          lod=Path("src/client/scenery-lod.client.lua").read_text()
          source=Path("src/server/PremiumRouteMeshAssets.lua").read_text()
          generator=Path("tools/generate_original_sky_spine_crown.py").read_text()
          budget=Path("src/shared/VisualBudgetRules.lua").read_text()
          disaster=Path("src/client/juice.client.lua").read_text()
          test=Path("tests/engine/mapbuilder-advanced.spec.luau").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          doc=Path("docs/SKY_SPINE_GENUINE_SIGNAL_LIGHTING_2026-11-05.md").read_text()
          assert 'OriginalSkySpineCrown = 71492051540032' in source
          assert '"SIGNAL"' in generator
          assert 'function Kit.lightBudget(' in kit
          assert 'function Kit.setDarknessGuard(' in kit
          assert 'function Kit.lightCount()' in kit
          assert 'local darknessGuard = true' in kit
          assert 'string.find(string.upper(part.Name), "SIGNAL", 1, true)' in kit
          assert 'Instance.new("PointLight")' in kit
          assert 'light.Name = "OriginalSkySpineSignalFill"' in kit
          assert 'light.Brightness = 0.31' in kit
          assert 'light.Range = 17' in kit
          assert 'light.Shadows = false' in kit
          assert 'if stress > 0 then return 0' in kit
          assert 'return touch == true and 1 or 2' in kit
          assert 'setSignalLight(entry, false)' in kit
          assert 'refreshLight(entry)' in kit
          assert 'GetAttributeChangedSignal("LocalDarknessLightGuard")' in lod
          assert 'SkySpineCrownMeshKit.setDarknessGuard(' in lod
          assert 'LocalOriginalSkySpineSignalLightCount' in lod
          assert '"OriginalSkySpineCrownLocal"' in budget
          assert 'instance:IsA("Light")' in budget
          assert 'player:SetAttribute("LocalDarknessLightGuard", darkness)' in disaster
          assert 'SkySpine_SIGNAL_Lens' in test
          assert 'expect(fill.Enabled).toBe(false)' in test
          assert 'expect(SkySpineCrownMeshKit.lightCount()).toBe(2)' in test
          assert '"tests/engine/mapbuilder-advanced.spec.luau"' in cloud
          assert 'aucune publication' in doc.lower() or 'publication désactivée' in doc.lower()
          assert 'RenderStepped' not in kit
          assert 'Heartbeat' not in kit
          assert 'RemoteEvent' not in kit
          assert 'LoadAssetAsync' not in kit
          print("Creator-approved 3D SIGNAL PointLights, actual mobile 0/1/1-2 "
                "caps, live Darkness/Warning suppression, shared GPU census, "
                "real Roblox engine regression. NO PUBLICATION.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-sky-spine-signal-lighting-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
