name: Roblox Studio E2E Playtest (Authenticated Runner)

on:
  workflow_dispatch:

concurrency:
  group: roblox-studio-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rojo 7.7.0
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\rojo.zip"
          $dir = "$env:RUNNER_TEMP\rojo"
          Invoke-WebRequest -Uri "https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Filter "rojo.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Rojo executable not found." }
          $exe.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $exe.FullName --version

      - name: Build local Roblox place
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          rojo build default.project.json -o build/ChaosSurvival.rbxlx
          if (!(Test-Path build/ChaosSurvival.rbxlx)) { throw "Rojo build did not create the place file." }

      - name: Download Roblox Studio installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://setup.rbxcdn.com/RobloxStudioInstaller.exe" -OutFile "$env:RUNNER_TEMP\RobloxStudioInstaller.exe"

      - name: Install and locate Roblox Studio
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\RobloxStudioInstaller.exe"
          $process = Start-Process -FilePath $installer -PassThru
          $process.WaitForExit()
          Start-Sleep -Seconds 3

          $studioPath = $null
          $running = Get-Process -Name "RobloxStudioBeta" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($running) {
            try { $studioPath = $running.Path } catch {}
          }

          if (-not $studioPath) {
            $roots = @(
              "$env:LOCALAPPDATA\Roblox",
              "$env:USERPROFILE\AppData\Local\Roblox",
              "C:\Program Files\Roblox",
              "C:\Program Files (x86)\Roblox"
            ) | Where-Object { Test-Path $_ }

            foreach ($root in $roots) {
              $candidate = Get-ChildItem $root -Filter "RobloxStudioBeta.exe" -Recurse -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
              if ($candidate) {
                $studioPath = $candidate.FullName
                break
              }
            }
          }

          if (-not $studioPath) { throw "Roblox Studio executable was not found after installation." }

          Get-Process -Name "RobloxStudioBeta" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          "STUDIO_EXE=$studioPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Studio: $studioPath"

      - name: Run four-client automated playtest
        shell: pwsh
        run: |
          $place = (Resolve-Path "build/ChaosSurvival.rbxlx").Path
          $script = (Resolve-Path "studio/ci-runner.luau").Path
          $output = Join-Path $env:GITHUB_WORKSPACE "build/studio-e2e.log"
          $stdout = Join-Path $env:GITHUB_WORKSPACE "build/studio-stdout.log"
          $stderr = Join-Path $env:GITHUB_WORKSPACE "build/studio-stderr.log"

          $arguments = @(
            "--task", "RunScript",
            "--localPlaceFile", $place,
            "--runScriptFile", $script,
            "--outputFile", $output,
            "--quitAfterExecution"
          )

          $process = Start-Process -FilePath "$env:STUDIO_EXE" -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddSeconds(120)

          while ((Get-Date) -lt $deadline) {
            if (Test-Path $output) {
              $contents = Get-Content $output -Raw -ErrorAction SilentlyContinue
              if ($contents -match "CHAOS_STUDIO_E2E_OK" -or $contents -match "CHAOS_STUDIO_E2E_FAILED") {
                break
              }
            }

            if ($process.HasExited) {
              Start-Sleep -Seconds 2
              if (Test-Path $output) { break }
            }

            Start-Sleep -Milliseconds 500
          }

          if (Test-Path $stdout) {
            Write-Host "=== Studio stdout ==="
            Get-Content $stdout
          }
          if (Test-Path $stderr) {
            Write-Host "=== Studio stderr ==="
            Get-Content $stderr
          }

          if (!(Test-Path $output)) {
            Write-Host "=== Roblox logs ==="
            $logRoots = @(
              "$env:LOCALAPPDATA\Roblox\logs",
              "$env:USERPROFILE\AppData\Local\Roblox\logs"
            ) | Where-Object { Test-Path $_ }

            foreach ($logRoot in $logRoots) {
              Get-ChildItem $logRoot -File -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 4 |
                ForEach-Object {
                  Write-Host "--- $($_.FullName) ---"
                  Get-Content $_.FullName -Tail 160 -ErrorAction SilentlyContinue
                }
            }

            throw "Studio produced no E2E output within 120 seconds."
          }

          Write-Host "=== Studio E2E output ==="
          Get-Content $output

          $contents = Get-Content $output -Raw
          if ($contents -notmatch "CHAOS_STUDIO_E2E_OK") {
            throw "Studio E2E playtest did not report success."
          }

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-studio-e2e
          path: |
            build/ChaosSurvival.rbxlx
            build/studio-e2e.log
            build/studio-stdout.log
            build/studio-stderr.log
          if-no-files-found: warn
