# Exact-SHA important original-3D kinetic visual milestone. NEVER publish.
name: One-time QA 2026-11-05 Original Animated 3D Sky Traffic No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-original-animated-sky-traffic-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-original-kinetic-sky-traffic-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: github.repository == 'dbrckk/chaos-survival-roblox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Contract — approved genuine moving craft, weld ownership and CFrame tween
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          kit=Path("src/client/ApprovedCinematicSkyTrafficMeshKit.lua").read_text()
          rules=Path("src/shared/CinematicTrafficMeshRules.lua").read_text()
          builder=Path("src/client/arena-cinematic-depth.client.lua").read_text()
          lod=Path("src/client/scenery-lod.client.lua").read_text()
          visual=Path("src/shared/VisualBudgetRules.lua").read_text()
          spec=Path("tests/engine/cinematic-depth-layout.spec.luau").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          server=Path("src/server/PremiumAmbientMotionAssets.lua").read_text()
          registry=Path("assets/source/roblox-asset-registry.json").read_text()
          doc=Path("docs/VIS_AUTHENTIC_ANIMATED_CINEMATIC_SKY_TRAFFIC_2026-11-05.md").read_text()
          for id in (
              '102850052145878','72210530094580',
              '116186226477876','127850230318627',
              '131294203899636',
          ):
              assert id in rules and id in server and id in registry,id
          assert 'function Rules.goal(from,to)' in rules
          assert 'CFrame.lookAt(to,to+(to-from))' in rules
          assert 'Low={0,0,0}' in rules
          assert 'Medium={2,1,0}' in rules
          assert 'High={4,2,0}' in rules
          assert 'MOBILE_HIGH={3,1,0}' in rules
          for tag in ('OriginalCinematicTrafficIndex','OriginalCinematicTrafficVariant'):
              assert tag in kit and tag in builder,tag
          assert '{CFrame = CinematicTrafficMeshRules.goal(from, to)}' in builder
          assert '{Position = to}' not in builder
          for fragment in (
              'ApprovedAmbientMotionTemplates',
              'ApprovedAmbientMotion3D',
              'Original3DAssetId',
              'OwnerVerified',
              'WeldConstraint',
              'weld.Part0=native',
              'weld.Part1=piece',
              'piece.Anchored=false',
              'piece.CanCollide=false',
              'piece.CanTouch=false',
              'piece.CanQuery=false',
              'native.Transparency=1',
              'entry.native.Transparency=entry.nativeOriginal',
              'source.AncestryChanged:Connect(invalidated)',
              'native.AncestryChanged:Connect(invalidated)',
              'function Kit.sync(',
              'function Kit.count()',
          ):
              assert fragment in kit,fragment
          assert 'ApprovedCinematicSkyTrafficMeshKit.sync(' in lod
          assert 'LocalOriginalCinematicTraffic3DCount' in lod
          assert 'OriginalCinematicSkyTraffic3DLocal' in visual
          for parts in ('Parts = 440','Parts = 680','Parts = 900'):
              assert parts in visual,parts
          assert '"tests/engine/cinematic-depth-layout.spec.luau"' in cloud
          assert 'tweens anchored welded original craft by CFrame' in spec
          assert 'CFrame=goal' in spec
          assert 'up to 20 theoretical paths' in doc.lower()
          for banned in ('LoadAssetAsync','RunService','RenderStepped',
                          'Heartbeat:Connect'):
              assert banned not in kit,banned
          print("Source-approved real MeshPart craft for all five worlds"
                " correctly inherit the ONLY authored CFrame-tween driver."
                " No new physics collisions or animation loops."
                " Same Android 440/680/900 Part census. NO PUBLISH.",
                flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-original-animated-sky-traffic-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
