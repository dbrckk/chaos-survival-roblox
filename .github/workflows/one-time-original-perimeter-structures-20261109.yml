# Source-verified original assets only; never changes a Roblox Place.
name: One-time Perimeter Truss Generator Shield 2026-11-09
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-perimeter-structures-20261109.yml
permissions:
  contents: read
concurrency:
  group: chaos-perimeter-structures-models-20261109
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Source-authenticate sculpted truss and shield, mesh bounds and materials
        shell: bash
        run: |
          set -euo pipefail
          for model in perimeter_crossbrace perimeter_generator_shield; do
            python3 tools/generate_original_perimeter_structures.py \
              --model "$model" --output "$RUNNER_TEMP/chaos_$model.obj" > "$RUNNER_TEMP/$model.json"
            python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/chaos_$model.obj" \
              --materials assets/source/chaos_route_kit.mtl \
              --output "$RUNNER_TEMP/chaos_$model.gltf" > "$RUNNER_TEMP/$model-gltf.json"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import base64,hashlib,json,sys
          root=Path(sys.argv[1])
          profiles={'perimeter_crossbrace':(9.1,.65,1.25),
                    'perimeter_generator_shield':(4.,.55,1.4)}
          palette={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          for name,expected in profiles.items():
              obj=(root/f'chaos_{name}.obj').read_bytes()
              info=json.loads((root/f'{name}.json').read_text())
              gltf=json.loads((root/f'chaos_{name}.gltf').read_text())
              assert info['asset']==name
              assert info['sha256']==hashlib.sha256(obj).hexdigest()
              assert 15<=info['groups']<=80
              assert 400<=info['triangles']<=3500
              assert set(info['materials'])==palette
              for val,limit in zip(info['dimensions'],expected):
                  assert limit*.77<=val<=limit*1.02,(name,info['dimensions'])
              for required in (('ClosedForgedLongitudinalRail','OpenTriangulatedWeb')
                               if name=='perimeter_crossbrace' else
                               ('GeneratorShockAbsorberRail','ClosedDiagonalHeatBridge')):
                  assert required.encode() in obj
              assert gltf['asset']['version']=='2.0'
              assert {material['name'] for material in gltf['materials']}==palette
              primitives=gltf['meshes'][0]['primitives']
              assert len(primitives)==7
              assert sum(gltf['accessors'][p['attributes']['POSITION']]['count']//3
                         for p in primitives)==info['triangles']
              assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'} <=
                         set(p['attributes']) for p in primitives)
              buffer=gltf['buffers'][0]
              assert len(base64.b64decode(buffer['uri'].split(',',1)[1],
                         validate=True))==buffer['byteLength']
              print('SOURCE-APPROVED',name,info['triangles'],
                    info['groups'],info['dimensions'],info['sha256'])
          print('NO Roblox Place upload')
          PY
  import-crossbrace:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: perimeter_crossbrace
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
  import-generator-shield:
    needs: import-crossbrace
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: perimeter_generator_shield
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
