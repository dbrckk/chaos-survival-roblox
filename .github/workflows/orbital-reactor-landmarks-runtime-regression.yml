name: Approved Orbital reactor nodes and open struts runtime regression
on:
  pull_request:
    paths:
      - src/client/ApprovedOrbitalReactorLandmarkMeshKit.lua
      - src/server/PremiumOrbitalReactorLandmarkAssets.lua
      - src/client/scenery-lod.client.lua
      - src/server/init.server.lua
      - src/server/MapBuilder.lua
      - assets/source/roblox-asset-registry.json
      - tools/generate_original_variant_orbital_landmarks.py
      - tools/verify_variant_orbital_landmarks_runtime.py
      - .github/workflows/orbital-reactor-landmarks-runtime-regression.yml
  push:
    branches: [main]
    paths:
      - src/client/ApprovedOrbitalReactorLandmarkMeshKit.lua
      - src/server/PremiumOrbitalReactorLandmarkAssets.lua
      - src/client/scenery-lod.client.lua
      - src/server/init.server.lua
      - src/server/MapBuilder.lua
      - assets/source/roblox-asset-registry.json
      - tools/generate_original_variant_orbital_landmarks.py
      - tools/verify_variant_orbital_landmarks_runtime.py
      - .github/workflows/orbital-reactor-landmarks-runtime-regression.yml
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual Approved models, 8 pair positions and native fallback
        run: python3 tools/verify_variant_orbital_landmarks_runtime.py
