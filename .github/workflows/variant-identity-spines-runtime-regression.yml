name: Approved Classic Grid and Towers spines runtime regression
on:
  pull_request:
    paths:
      - src/client/ApprovedVariantIdentitySpineMeshKit.lua
      - src/server/PremiumVariantIdentitySpineAssets.lua
      - src/client/scenery-lod.client.lua
      - src/client/arena-identity-motion.client.lua
      - src/server/init.server.lua
      - src/server/MapBuilder.lua
      - assets/source/roblox-asset-registry.json
      - tools/generate_original_variant_identity_spines.py
      - tools/verify_variant_identity_spines_runtime.py
      - .github/workflows/variant-identity-spines-runtime-regression.yml
  push:
    branches: [main]
    paths:
      - src/client/ApprovedVariantIdentitySpineMeshKit.lua
      - src/server/PremiumVariantIdentitySpineAssets.lua
      - src/client/scenery-lod.client.lua
      - src/client/arena-identity-motion.client.lua
      - src/server/init.server.lua
      - src/server/MapBuilder.lua
      - assets/source/roblox-asset-registry.json
      - tools/generate_original_variant_identity_spines.py
      - tools/verify_variant_identity_spines_runtime.py
      - .github/workflows/variant-identity-spines-runtime-regression.yml
permissions:
  contents: read
jobs:
  runtime-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check genuine moderated Models, 8 natives and 16 animated-signal fallbacks
        run: python3 tools/verify_variant_identity_spines_runtime.py
