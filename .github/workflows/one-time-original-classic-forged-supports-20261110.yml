# Reproducible original Classic 3D support Model, never a Roblox Place publish.
name: One-time Original Classic Forged Supports 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-classic-forged-supports-20261110.yml
permissions:
  contents: read
concurrency:
  group: chaos-classic-forged-supports-20261110
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate five authentic 3D support silhouettes and seven PBR meshes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_signature_classic_supports.py --output "$RUNNER_TEMP/classic_forged_supports.obj" > "$RUNNER_TEMP/classic_forged_supports.json"
          python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/classic_forged_supports.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/classic_forged_supports.gltf" > "$RUNNER_TEMP/classic_forged_supports-gltf.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          source=(root/'classic_forged_supports.obj').read_bytes()
          meta=json.loads((root/'classic_forged_supports.json').read_text())
          gltf=json.loads((root/'classic_forged_supports.gltf').read_text())
          assert meta['asset']=='signature_classic_forged_supports'
          assert hashlib.sha256(source).hexdigest()==meta['sha256']
          assert 85<=meta['groups']<=480 and 1400<=meta['triangles']<=10000
          palette={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          assert set(meta['materials'])==palette
          x,y,z=meta['bounds']
          assert 13.35<=x<=14.05 and 19.0<=y<=19.9 and 2.25<=z<=2.60
          for key in (b'OriginalTwelveFacetTaperedLoadButtress-1',
                      b'OriginalTwelveFacetTaperedLoadButtress1',
                      b'InclinedTenFacetOpenLoadSpar-1',
                      b'InclinedTenFacetOpenLoadSpar1',
                      b'ForgedRelayServicePanelChassis',
                      b'EmbossedDiagnosticBand',
                      b'ParallelStructuralCable',
                      b'MechanicalForgedButtressCollar',
                      b'InlaidLoadIndicator'):
              assert key in source,key
          assert gltf['asset']['version']=='2.0'
          assert {m['name'] for m in gltf['materials']}==palette
          primitives=gltf['meshes'][0]['primitives']
          assert len(primitives)==7
          assert sum(gltf['accessors'][p['attributes']['POSITION']]['count']//3 for p in primitives)==meta['triangles']
          assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'}<=set(p['attributes']) for p in primitives)
          buffer=gltf['buffers'][0]
          assert len(base64.b64decode(buffer['uri'].split(',',1)[1],validate=True))==buffer['byteLength']
          native=Path('src/server/MapBuilder.lua').read_text()
          for n in ('"RelayButtressWest"','"RelayButtressEast"',
                    '"RelaySparWest"','"RelaySparEast"','"ServicePanel"'):
              assert n in native,n
          print('SOURCE PASS genuine five-part Classic forged architecture',meta['triangles'],meta['bounds'],meta['sha256'])
          print('NO ROBLOX PLACE PUBLICATION')
          PY
  owner-import:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: signature_classic_forged_supports
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
