name: One-shot PR568 Floor and Lobby Luau Build (NO PUBLISH)
on:
  push:
    branches: [feat/complete-floor-apron-lobby-stage-20261103]
    paths: ['.github/workflows/one-shot-pr568-floor-lobby-final-source.yml']
permissions:
  contents: read
jobs:
  compile-and-build:
    if: github.repository == 'dbrckk/chaos-survival-roblox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile all Luau with pinned compiler 0.740
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          unzip -tq /tmp/luau.zip >/dev/null
          mkdir -p /tmp/luau && unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 |
            xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
      - name: Verify existing Android first-frame material/VFX budgets
        run: python tools/validate_mobile_vfx_first_frame.py
      - name: Install pinned Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -tq /tmp/rojo.zip >/dev/null
          mkdir -p /tmp/rojo && unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          echo /tmp/rojo >> "$GITHUB_PATH"
      - name: Exact source full Roblox place build
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel CANDIDATE
          mkdir -p build
          rojo build default.project.json -o build/ChaosSurvival.rbxlx
          test -s build/ChaosSurvival.rbxlx
          grep -Fq "$GITHUB_SHA" build/ChaosSurvival.rbxlx
          echo 'Validated PR568 full place source, not published'
