name: Publish Roblox Place

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to deploy the current main branch to Roblox'
        required: true
        default: ''
  push:
    branches:
      - publish-roblox

concurrency:
  group: roblox-place-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Require safe publish ref
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF_NAME" = "main" || {
              echo "Manual publication must be dispatched from main."
              exit 1
            }
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "publish-roblox" || {
              echo "Push publication is only allowed from publish-roblox."
              exit 1
            }
          fi

      - name: Verify exact SHA automated certification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          required = {
              "Build Validation": False,
              "Roblox Open Cloud Engine Tests": False,
          }

          for run in payload.get("workflow_runs", []):
              name = run.get("name")
              if name in required and run.get("status") == "completed" and run.get("conclusion") == "success":
                  required[name] = True

          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit(
                  "Refusing Roblox publish for uncertified SHA "
                  + sha
                  + ". Missing green workflows: "
                  + ", ".join(missing)
              )

          print("Exact SHA automated certification verified:", sha)
          PY

      - name: Install Rojo 7.7.0
        shell: bash
        run: |
          curl -fsSL -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          echo "/tmp/rojo" >> "$GITHUB_PATH"
          /tmp/rojo/rojo --version

      - name: Build place
        shell: bash
        run: |
          mkdir -p build
          rojo build default.project.json -o build/ChaosSurvival.rbxlx
          test -s build/ChaosSurvival.rbxlx

      - name: Publish place to Roblox
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: "8998396328"
          ROBLOX_PLACE_ID: "101933452561772"
        run: |
          test -n "$ROBLOX_API_KEY" || {
            echo "ROBLOX_API_KEY secret is missing."
            exit 1
          }

          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location             --output "$response_file"             --write-out "%{http_code}"             --request POST             "https://apis.roblox.com/universes/v1/$ROBLOX_UNIVERSE_ID/places/$ROBLOX_PLACE_ID/versions?versionType=Published"             --header "x-api-key: $ROBLOX_API_KEY"             --header "Content-Type: application/xml"             --data-binary @build/ChaosSurvival.rbxlx)"

          cat "$response_file"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo
            echo "Roblox publish failed with HTTP $status."
            echo "The API key must have universe-places:write access for this universe."
            exit 1
          fi

          if ! grep -q '"versionNumber"' "$response_file"; then
            echo
            echo "Roblox did not return a published version number."
            exit 1
          fi

          mkdir -p build
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "universe=$ROBLOX_UNIVERSE_ID"
            echo "place=$ROBLOX_PLACE_ID"
            echo -n "roblox_response="
            tr -d '\n' < "$response_file"
            echo
          } > build/publish-metadata.txt

      - name: Upload published place artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaos-survival-published-place
          path: |
            build/ChaosSurvival.rbxlx
            build/publish-metadata.txt
