name: Publish Roblox Place

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to deploy the current main branch to Roblox'
        required: true
        default: ''
concurrency:
  group: roblox-place-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public experience/place supplied in the owner's Creator Dashboard.
      # Unlike repo variables, these are not independently user-editable.
      EXPECTED_PUBLIC_UNIVERSE: "10771083668"
      EXPECTED_PUBLIC_PLACE: "95351659174730"

    steps:
      - name: Validate publish confirmation
        shell: bash
        # Dispatch input is untrusted text, never interpolate it as shell code.
        env:
          PUBLISH_CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$PUBLISH_CONFIRM" = "PUBLISH" || {
            echo "Type PUBLISH to deploy the selected main commit."
            exit 1
          }

      - uses: actions/checkout@v4

      - name: Require safe publish ref
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || {
            echo "::error::Production publication requires an explicit manual dispatch."
            exit 1
          }
          test "$GITHUB_REF_NAME" = "main" || {
            echo "::error::Production publication must be dispatched from main."
            exit 1
          }

      - name: Verify exact SHA release certification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          required = {
              "Build Validation": False,
              "Roblox Open Cloud Engine Tests": False,
              "Release Candidate Gate": False,
          }

          for run in payload.get("workflow_runs", []):
              name = run.get("name")
              if name not in required:
                  continue

              trusted = run.get("head_branch") == "main"
              if name == "Build Validation":
                  trusted = trusted and run.get("event") == "push"
              elif name == "Roblox Open Cloud Engine Tests":
                  trusted = trusted and run.get("event") in {"push", "workflow_dispatch"}
              else:
                  trusted = trusted and run.get("event") == "workflow_dispatch"

              if (
                  trusted
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
              ):
                  required[name] = True

          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit(
                  "Refusing Roblox publish for uncertified SHA "
                  + sha
                  + ". Missing green workflows: "
                  + ", ".join(missing)
              )

          print("Exact SHA release certification verified:", sha)
          PY

      - name: Install Rojo 7.7.0
        shell: bash
        run: |
          curl -fsSL -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          echo "/tmp/rojo" >> "$GITHUB_PATH"
          /tmp/rojo/rojo --version

      - name: Build place
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel PRODUCTION
          mkdir -p build
          rojo build default.project.json -o build/ChaosSurvival.rbxlx
          test -s build/ChaosSurvival.rbxlx
          grep -Fq "$GITHUB_SHA" build/ChaosSurvival.rbxlx

      - name: Publish place to Roblox
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: |
          set -euo pipefail
          # Production variables were demonstrably inconsistent with the
          # owner's live experience during the staging identity incident.
          # Never send a POST to a mutable, unverified publishing target.
          if [ "$ROBLOX_UNIVERSE_ID" != "$EXPECTED_PUBLIC_UNIVERSE" ] \
             || [ "$ROBLOX_PLACE_ID" != "$EXPECTED_PUBLIC_PLACE" ]; then
            echo "::error::Production publishing target does not match the owner's documented public Roblox experience/place. No API call made."
            exit 1
          fi
          test ! -e src/shared/VisualStagingStamp.lua || {
            echo "::error::Staging-only SHA marker detected in production source. No publication."
            exit 1
          }
          test -n "$ROBLOX_API_KEY" || {
            echo "ROBLOX_API_KEY secret is missing."
            exit 1
          }
          test -n "$ROBLOX_UNIVERSE_ID" || {
            echo "ROBLOX_UNIVERSE_ID repository variable is missing."
            exit 1
          }
          test -n "$ROBLOX_PLACE_ID" || {
            echo "ROBLOX_PLACE_ID repository variable is missing."
            exit 1
          }

          # No redirects with an API key and never print an untrusted response.
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 \
            --output "$response_file" --write-out "%{http_code}" \
            --request POST \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header "Content-Type: application/xml" \
            --data-binary @build/ChaosSurvival.rbxlx \
            "https://apis.roblox.com/universes/v1/$ROBLOX_UNIVERSE_ID/places/$ROBLOX_PLACE_ID/versions?versionType=Published")"

          case "$status" in
            2??) ;;
            *)
              echo "::error::Roblox publication returned HTTP $status; response body redacted."
              exit 1
              ;;
          esac

          version="$(python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  payload = json.load(f)
              version = payload.get("versionNumber")
              if type(version) is not int or version < 1:
                  raise ValueError("missing positive versionNumber")
          except (ValueError, OSError, UnicodeError, AttributeError):
              raise SystemExit("Roblox publication response lacks a valid version number (body redacted)")
          print(version)
          PY
          )"

          mkdir -p build
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "universe=$ROBLOX_UNIVERSE_ID"
            echo "place=$ROBLOX_PLACE_ID"
            echo "published_version=$version"
          } > build/publish-metadata.txt

      - name: Upload published place artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaos-survival-published-place
          path: |
            build/ChaosSurvival.rbxlx
            build/publish-metadata.txt
