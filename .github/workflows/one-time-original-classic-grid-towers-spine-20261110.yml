# Single-use gated upload of two real owner-created Model assets.
# Does NOT deploy or publish the playable Roblox Place.
name: One-time Original Classic Grid and Towers Spine 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-classic-grid-towers-spine-20261110.yml
permissions:
  contents: read
concurrency:
  group: chaos-original-identity-spines-20261110
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Reject incorrect original bounds or changed animated signal sources
        run: python3 tools/verify_original_variant_identity_spines.py
  import-classic:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: variant_classic_grid_marker_sculpt
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
  import-towers:
    needs: import-classic
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: variant_towers_spine_sculpt
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
