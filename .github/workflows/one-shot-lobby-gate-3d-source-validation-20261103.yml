name: One-shot Authentic 3D Lobby Gate Source Validation
on:
  push:
    branches: [feat/original-premium-lobby-gate-3d-20261103]
    paths: [.github/workflows/one-shot-lobby-gate-3d-source-validation-20261103.yml]
permissions:
  contents: read
jobs:
  original-gate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate original portal geometry and GLTF with normal and UV tangents
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_lobby_gate.py --output assets/source/chaos_lobby_gate.obj > /tmp/lobby_gate.json
          python3 tools/obj_to_gltf.py --source assets/source/chaos_lobby_gate.obj --materials assets/source/chaos_route_kit.mtl --output /tmp/lobby_gate.gltf
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          src=json.loads(Path("/tmp/lobby_gate.json").read_text())
          doc=json.loads(Path("/tmp/lobby_gate.gltf").read_text())
          assert src["name"]=="lobby_gate" and 1000<=src["triangles"]<=8500
          assert 24<=src["dimensions"][0]<=28
          assert 18<=src["dimensions"][1]<=22
          assert 4<=src["dimensions"][2]<=8
          assert doc["asset"]["version"]=="2.0"
          assert {m["name"] for m in doc["materials"]}=={"ARMOR","BRUSHED","CARBON","GRIP","ALLOY","CERAMIC","SIGNAL"}
          primitives=doc["meshes"][0]["primitives"]
          assert len(primitives)==7
          count=sum(doc["accessors"][p["attributes"]["POSITION"]]["count"]//3 for p in primitives)
          assert count==src["triangles"]
          assert all({"POSITION","NORMAL","TEXCOORD_0","TANGENT"}<=set(p["attributes"]) for p in primitives)
          payload=base64.b64decode(doc["buffers"][0]["uri"].split(",",1)[1],validate=True)
          assert len(payload)==doc["buffers"][0]["byteLength"]
          print("Original lobby gate 3D source / UV / tangent gate PASS",src,count)
          PY
      - name: Compile all source and produce real place using pinned tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          mkdir -p /tmp/luau && unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 | xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
          python3 tools/validate_mobile_vfx_first_frame.py
          curl -fLsS --retry 3 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          mkdir -p /tmp/rojo && unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          python3 tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel CANDIDATE
          /tmp/rojo/rojo build default.project.json -o /tmp/ChaosSurvival.rbxlx
          test -s /tmp/ChaosSurvival.rbxlx
          grep -Fq "$GITHUB_SHA" /tmp/ChaosSurvival.rbxlx
