# Two genuine original 3D sources replace nonphysical Orbital spheres only.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-04 Authentic Orbital Station 3D No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261104-orbital-compact-stations-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-orbital-compact-station-3d-qa-20261104
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Audit authentic Orbital station sources, mobile budgets and native safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          kit=Path("src/client/OriginalOrbitalStationsMeshKit.lua").read_text()
          mid=Path("src/client/arena-midground-mass.client.lua").read_text()
          sampler=Path("src/client/scenery-lod.client.lua").read_text()
          visual_budget=Path("src/shared/VisualBudgetRules.lua").read_text()
          ambient=Path("src/server/PremiumAmbientMotionAssets.lua").read_text()
          service=Path("src/server/PremiumServiceEquipmentAssets.lua").read_text()
          init=Path("src/server/init.server.lua").read_text()
          docs=Path("docs/ORIGINAL_ORBITAL_STATIONS_COMPACT_3D_2026-11-04.md").read_text()
          registry=json.loads(Path("assets/source/roblox-asset-registry.json").read_text())
          models=registry["models"]
          assert len(models)==62
          approved={int(m["asset_id"]):m for m in models if m["moderation"]=="Approved"}
          assert len(approved)==62
          satellite=127850230318627
          containment=127295681925871
          assert satellite in approved and containment in approved
          assert approved[satellite]["name"]=="ambient_satellite"
          assert approved[containment]["name"]=="service_orbital"
          assert str(satellite) in kit and str(satellite) in ambient
          assert str(containment) in kit and str(containment) in service
          assert str(satellite) in docs and str(containment) in docs
          assert "PremiumAmbientMotionAssets.start" in init
          assert "PremiumServiceEquipmentAssets.start" in init
          assert "ApprovedAmbientMotionTemplates" in kit
          assert "ApprovedServiceEquipmentTemplates" in kit
          assert 'source:GetAttribute("Original3DAssetId") ~= spec.id' in kit
          assert 'source:GetAttribute("OwnerVerified") ~= true' in kit
          assert 'source:GetAttribute(spec.flag) ~= true' in kit
          assert 'part:IsA("LuaSourceContainer")' in kit
          assert "count ~= 7" in kit and "#pieces ~= 7" in kit
          assert "clone:ScaleTo(scale)" in kit
          assert "local reach = math.max(bounds.X,bounds.Z)*.7072" in kit
          assert "body.Shape ~= Enum.PartType.Ball" in kit
          assert "not station(body,base,mid,index)" in kit
          assert "OriginalOrbitalStationIndex" in kit
          assert 'part:SetAttribute("OriginalOrbitalStationIndex", i)' in mid
          assert "OriginalOrbitalStationsMeshKit.sync(arena,cameraPoint" in sampler
          assert "LocalOriginalOrbitalStationCount" in sampler
          assert "LocalOriginalOrbitalNativeReplaced" in sampler
          assert '"OriginalOrbitalStationsLocal"' in visual_budget
          for text in (
              "cap = stress==0 and 1 or 0",
              "cap = stress==0 and 3 or (stress==1 and 1 or 0)",
              "cap = stress==0 and 6 or (stress==1 and 3 or 0)",
              "part.CanCollide = false",
              "part.CanTouch = false",
              "part.CanQuery = false",
              "part.CastShadow = false",
              "part.Transparency = alpha",
              "part.Transparency = 1",
          ):
              assert text in kit, text
          assert "RunService" not in kit and "LoadAssetAsync" not in kit
          assert "task.spawn(" not in kit and "task.wait(" not in kit
          print("Verified two existing 7-MeshPart approved Orbital sources, "
                "six indexed native sphere fallbacks, mobile 1/3/6 quotas, "
                "outboard geometry and no extra client loop. NO PUBLICATION.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-orbital-station-3d-source-only",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
