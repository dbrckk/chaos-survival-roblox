name: Public Release Readiness (Read Only)

on:
  workflow_dispatch:
  # Run the same read-only preflight automatically after the exact-SHA
  # real-engine test job finishes. Never fire after publishing workflows.
  workflow_run:
    workflows: ["Roblox Open Cloud Engine Tests"]
    types: [completed]

# This workflow CANNOT publish or mutate Roblox, GitHub settings or branches.
# No Roblox key/secrets, checkout, artifacts or write permission are used.
permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Audit source, checks and release targets
    # workflow_run loads its YAML from the trusted default branch. Ignore
    # feature-branch and fork runs, even if they finish successfully.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public release readiness without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # workflow_run's github.sha is the default-branch HEAD, NOT the
          # completed engine run SHA. Use the triggering SHA explicitly;
          # the Python gate rejects it if main has already moved on.
          DISPATCH_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          DISPATCH_REF: ${{ github.event_name == 'workflow_run' && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
          PROD_UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID }}
          PROD_PLACE: ${{ vars.ROBLOX_PLACE_ID }}
          STAGING_UNIVERSE: ${{ vars.ROBLOX_STAGING_UNIVERSE_ID }}
          STAGING_PLACE: ${{ vars.ROBLOX_STAGING_PLACE_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          api_root = "https://api.github.com/repos/" + os.environ["REPO"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "chaos-read-only-release-preflight",
          }

          def api(path):
              req = urllib.request.Request(api_root + path, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          def row(name, status, explanation):
              mark = "PASS" if status == "PASS" else ("CHECK" if status == "CHECK" else "BLOCKED")
              rows.append(f"| {name} | **{mark}** | {explanation} |")
              if mark == "BLOCKED":
                  blocking.append(name)

          rows = []
          blocking = []
          notes = []
          sha = os.environ["DISPATCH_SHA"]
          current_branch = os.environ["DISPATCH_REF"] == "refs/heads/main"

          if not current_branch:
              row("Source branch", "BLOCKED", "Run this read-only audit from main")
          else:
              row("Source branch", "PASS", "main")

          try:
              main = api("/branches/main")
              main_sha = main["commit"]["sha"]
              row("Exact current SHA", "PASS" if sha == main_sha else "BLOCKED",
                  f"dispatch `{sha[:12]}` / main `{main_sha[:12]}`")
          except (urllib.error.URLError, ValueError, KeyError) as exc:
              row("Exact current SHA", "BLOCKED", "Could not verify main via GitHub API")
              notes.append(f"Main inspection unavailable: {type(exc).__name__}")

          expected = {
              "ROBLOX_UNIVERSE_ID": "10771083668",
              "ROBLOX_PLACE_ID": "95351659174730",
          }
          # GitHub's supported vars context can read Actions variables without
          # granting an API token a forbidden Variables permission.
          variables = {
              "ROBLOX_UNIVERSE_ID": os.environ.get("PROD_UNIVERSE", ""),
              "ROBLOX_PLACE_ID": os.environ.get("PROD_PLACE", ""),
              "ROBLOX_STAGING_UNIVERSE_ID": os.environ.get("STAGING_UNIVERSE", ""),
              "ROBLOX_STAGING_PLACE_ID": os.environ.get("STAGING_PLACE", ""),
          }
          for key, value in expected.items():
              observed = variables.get(key, "")
              row(key, "PASS" if observed == value else "BLOCKED",
                  f"Expected `{value}`; configured `{observed or '(missing)'}`")

          staging_universe = variables["ROBLOX_STAGING_UNIVERSE_ID"]
          staging_place = variables["ROBLOX_STAGING_PLACE_ID"]
          staging_safe = bool(staging_universe and staging_place
                              and staging_universe != expected["ROBLOX_UNIVERSE_ID"]
                              and staging_place != expected["ROBLOX_PLACE_ID"])
          # Staging isolation is mandatory for the *certified* release
          # pipeline, but the owner-approved public-playtest workflow
          # deliberately targets the EXISTING public game. Do not mark the
          # unrelated public-playtest preflight as failed just because the
          # full-release certification path has not been provisioned.
          row("Isolated private staging (certified release only)",
              "PASS" if staging_safe else "CHECK",
              "Separate target IDs configured" if staging_safe else
              "Not isolated: FULL release certification remains blocked; "
              "this is not required for the explicitly uncertified public playtest")

          try:
              query = urllib.parse.urlencode({
                  "head_sha": sha,
                  "event": "push",
                  "per_page": 100,
              })
              data = api("/actions/runs?" + query)
              matching = [
                  run for run in data.get("workflow_runs", [])
                  if run.get("head_sha") == sha
                  and run.get("event") == "push"
                  and run.get("head_branch") == "main"
              ]
              for required in ("Build Validation", "Roblox Open Cloud Engine Tests"):
                  named = sorted(
                      (run for run in matching if run.get("name") == required),
                      key=lambda run: (run.get("created_at", ""), run.get("id", 0)),
                      reverse=True,
                  )
                  latest = named[0] if named else None
                  good = bool(latest and latest.get("status") == "completed"
                              and latest.get("conclusion") == "success")
                  row(required, "PASS" if good else "BLOCKED",
                      ("Successful exact-main push run" if good else
                       f"Missing, pending or failing exact-main push check: "
                       f"{(latest or {}).get('status', 'missing')}/"
                       f"{(latest or {}).get('conclusion', 'none')}"))
          except (urllib.error.URLError, ValueError, KeyError) as exc:
              row("GitHub automated checks", "BLOCKED",
                  "Could not verify exact main SHA workflow conclusions")
              notes.append(f"Actions inspection unavailable: {type(exc).__name__}")

          report = [
              "# Chaos Survival — READ-ONLY public-playtest source preflight",
              "",
              f"Candidate: `{sha}`",
              "",
              "| Gate | Status | Evidence |",
              "| --- | --- | --- |",
              *rows,
              "",
              ("**Public-playtest source/target preflight: BLOCKED.**" if blocking
               else "**Public-playtest source/target preflight: PASS.**"),
              "",
              ("**Full-release certification: BLOCKED — no isolated staging.**"
               if not staging_safe else
               "**Full-release certification: NOT VERIFIED — additional "
               "Studio, Android and player checks are required.**"),
              "",
              "The playtest preflight does not override the Release Candidate Gate,",
              "and a PASS here is NOT a certified release or permission to publish.",
              "This report does **not** publish the place, prove Roblox API-key permissions,",
              "verify the live place version, or certify real device/Studio results.",
              "Do not declare 1.0 certified until authenticated Studio, Android,",
              "persistence/rejoin and real-player acceptance are documented.",
              "",
              "For a public playtest update, use the separate, explicitly",
              "acknowledged public workflow ONLY after successful exact-SHA",
              "build and engine checks and verified production target IDs.",
              "Private staging credentials are not needed for this path.",
          ]
          if notes:
              report.extend(["", "Inspection notes:", *["- " + note for note in notes]])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(report) + "\n")
          print("\n".join(report))
          if blocking:
              sys.exit(1)
          PY
