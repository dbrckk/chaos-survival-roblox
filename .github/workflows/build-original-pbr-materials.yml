name: Build Original 2K PBR Texture Atlas (No Upload)

on:
  pull_request:
    paths:
      - 'tools/generate_pbr_materials.py'
      - 'default.project.json'
      - '.github/workflows/build-original-pbr-materials.yml'
      - '.github/workflows/upload-original-pbr-material.yml'
      - '.github/workflows/recover-original-pbr-diamondplate.yml'
      - 'assets/source/roblox-pbr-upload-receipts.json'
      - 'assets/source/roblox-pbr-approval-evidence.json'
  push:
    branches: [main]
    paths:
      - 'tools/generate_pbr_materials.py'
      - 'default.project.json'
      - '.github/workflows/upload-original-pbr-material.yml'
      - '.github/workflows/recover-original-pbr-diamondplate.yml'
      - 'assets/source/roblox-pbr-upload-receipts.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-pbr-texture-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and validate 16 original 2048 PBR maps
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.12 with supported NumPy and Pillow wheels
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pillow==11.1.0' 'PyYAML==6.0.2'

      - name: Verify manual upload uses supported image runtime without uploading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          source = Path(".github/workflows/upload-original-pbr-material.yml").read_text()
          # Parse full YAML before checking semantics: an unquoted pip option
          # containing a colon can make GitHub Actions reject the entire flow.
          workflow = yaml.safe_load(source)
          assert isinstance(workflow, dict), "Upload workflow must be valid YAML"
          triggers = workflow.get("on", workflow.get(True, {}))
          assert isinstance(triggers, dict), "Upload events must be configured"
          assert set(triggers) == {"workflow_dispatch"}, "Uploading must remain manual-only"
          job = workflow["jobs"]["material-upload"]
          assert "github.ref == 'refs/heads/main'" in job["if"], "Main-only upload gate"
          steps = job["steps"]
          setup = next(x for x in steps if x.get("uses", "").startswith("actions/setup-python@"))
          assert setup["with"]["python-version"] == "3.12", "Use supported image wheel runtime"
          install = next(x for x in steps if x.get("name", "").startswith("Install deterministic image dependencies"))
          assert "--only-binary=:all:" in install["run"], "Never attempt Pillow source builds"
          upload = next(x for x in steps if x.get("name", "").startswith("Upload four owned Image assets"))
          assert upload["if"] == "inputs.dry_run == false", "Preserve explicit upload-only gate"
          assert "UPLOAD_CHAOS_PBR_2K" in source, "Preserve upload confirmation"
          validator = next(x for x in steps if x.get("name", "").startswith("Validate explicit"))
          assert "roblox-pbr-upload-receipts.json" in validator["run"], "Full upload must check existing receipts"
          assert "BLOCKED:" in validator["run"], "Full upload must reject duplicates"
          assert "get(material)" in validator["run"], "Check every material for uploaded IDs"

          print("PASS: valid manual-only YAML; Python 3.12 wheels and safety gates verified.")

          # The recovery workflow is a MANUAL single-channel repair, never
          # a disguised reupload of two already created Roblox images.
          recovery_path = Path(".github/workflows/recover-original-pbr-diamondplate.yml")
          recovery = yaml.safe_load(recovery_path.read_text())
          assert isinstance(recovery, dict), "Recovery workflow has invalid YAML"
          recovery_triggers = recovery.get("on", recovery.get(True, {}))
          assert set(recovery_triggers) == {"workflow_dispatch"}, "Recovery must remain manual-only"
          choices = recovery_triggers["workflow_dispatch"]["inputs"]["channel"]["options"]
          assert choices == ["roughness", "metallic"], "Recovery cannot upload existing color or normal"
          assert recovery_triggers["workflow_dispatch"]["inputs"]["dry_run"]["default"] is True
          repair_job = recovery["jobs"]["recover-one-map"]
          assert "github.ref == 'refs/heads/main'" in repair_job["if"]
          repair_steps = repair_job["steps"]
          repair_python = next(x for x in repair_steps if x.get("uses", "").startswith("actions/setup-python@"))
          assert repair_python["with"]["python-version"] == "3.12"
          repair_install = next(x for x in repair_steps if x.get("name","").startswith("Install image dependencies"))
          assert "--only-binary=:all:" in repair_install["run"]
          create = next(x for x in repair_steps if x.get("name","").startswith("Upload only this one"))
          assert create["if"] == "inputs.dry_run == false"
          assert "UPLOAD_CHAOS_PBR_2K" in recovery_path.read_text()
          assert "for channel in" not in create["run"], "Never upload multiple channels in one recovery"
          assert "armored_diamondplate_$CHANNEL" in create["run"]
          assert "--write-out '%{http_code}'" in create["run"], "Capture HTTP 400 details"
          evidence = next(x for x in repair_steps if x.get("name","").startswith("Preserve partial receipts"))
          assert evidence["if"] == "always()"

          # Exact real upload receipts are necessary for avoiding duplicates.
          import json
          receipts=json.loads(Path("assets/source/roblox-pbr-upload-receipts.json").read_text())
          assert receipts["creator_user_id"] == "9774173158"
          materials=receipts["materials"]
          for name in ("brushed_titanium", "oxidized_steel", "reactor_ceramic"):
              assert set(materials[name]["channels"]) == {"color","normal","roughness","metallic"}
              assert all(str(entry["id"]).isdecimal() for entry in materials[name]["channels"].values())
          armor=materials["armored_diamondplate"]
          assert armor["channels"]["color"]["id"] == "86680602350796"
          assert armor["channels"]["normal"]["id"] == "94326474312318"
          assert armor["channels"]["roughness"]["id"] == "121848704472466"
          assert armor["channels"]["metallic"]["id"] == "106394628880013"
          assert armor["missing"] == [], "Both formerly missing channels now have valid Image IDs"
          assert armor["final_recovery"]["run_id"] == 40679576853
          assert armor["final_recovery"]["result"] == "SUCCESS"
          all_asset_ids = [
              material["channels"][channel]["id"]
              for material in materials.values()
              for channel in ("color", "normal", "roughness", "metallic")
          ]
          assert len(all_asset_ids) == 16 and len(set(all_asset_ids)) == 16
          assert all(str(asset).isdecimal() for asset in all_asset_ids)
          # Do not rewrite the checked-in fallback MaterialVariants until
          # all 16 image assets are independently confirmed approved/access.
          print("PASS: 16 unique created Roblox Image IDs preserved; manual recovery safely blocked by completed receipts.")
          PY

      - name: Render four complete original 2K material sets
        run: python tools/generate_pbr_materials.py --size 2048 --output build/pbr-2k

      - name: Inspect maps, file budgets, authorship and baked Roblox fallbacks
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import numpy as np
          from PIL import Image

          root = pathlib.Path("build/pbr-2k")
          manifest = json.loads((root / "manifest.json").read_text())
          project = json.loads(pathlib.Path("default.project.json").read_text())
          assert manifest["resolution"] == [2048, 2048]
          assert manifest["normal_convention"] == "OpenGL positive Y tangent-space"
          assert manifest["texture_upload_status"] == "NOT_UPLOADED_TO_ROBLOX"
          assert len(manifest["materials"]) == 4
          expected = {"color", "normal", "roughness", "metallic"}
          for material in manifest["materials"]:
              assert set(material["maps"]) == expected
              for channel, entry in material["maps"].items():
                  path = root / entry["path"]
                  with Image.open(path) as image:
                      assert image.size == (2048, 2048)
                      assert image.mode == ("RGB" if channel in {"color", "normal"} else "L")
                      assert image.format == "PNG"
                      probe = np.asarray(image.resize((256, 256), Image.Resampling.BOX))
                      if channel == "normal":
                          assert float(np.mean(probe[:, :, 2])) > 190, channel
                      elif channel != "metallic":
                          assert float(np.std(probe)) > 5, (material["name"], channel)
                  assert 0 < path.stat().st_size < 20 * 1024 * 1024
                  assert entry["roblox_asset_id"] is None

          choices = project["tree"]["MaterialService"]
          for material in choices.values():
              if not isinstance(material, dict) or material.get("$className") != "MaterialVariant":
                  continue
              props = material["$properties"]
              assert props["BaseMaterial"] in {"Foil", "CorrodedMetal", "DiamondPlate", "CeramicTiles"}
              assert all(props[key].startswith("rbxassetid://") for key in
                         ("ColorMap", "NormalMap", "MetalnessMap", "RoughnessMap"))
          # The shipped Rojo project must use the 16 exact original Images
          # independently verified APPROVED and creator-owned via Roblox API.
          receipts = json.loads(pathlib.Path(
              "assets/source/roblox-pbr-upload-receipts.json").read_text())
          audit = json.loads(pathlib.Path(
              "assets/source/roblox-pbr-approval-evidence.json").read_text())
          assert audit["run_id"] == 40682190586
          assert audit["artifact_id"] == 12813106994
          assert audit["approved_current_at_audit"] == 16
          assert audit["all_approved_at_audit"] is True
          assert audit["creator_user_id"] == receipts["creator_user_id"] == "9774173158"
          variants = {
              "brushed_titanium": "ChaosBrushedTitanium",
              "oxidized_steel": "ChaosOxidizedSteel",
              "armored_diamondplate": "ChaosDiamondArmor",
              "reactor_ceramic": "ChaosReactorCeramic",
          }
          props = {
              "color": "ColorMap", "normal": "NormalMap",
              "roughness": "RoughnessMap", "metallic": "MetalnessMap",
          }
          seen_ids = set()
          for family, variant in variants.items():
              actual = choices[variant]["$properties"]
              for channel, prop in props.items():
                  receipt_id = receipts["materials"][family]["channels"][channel]["id"]
                  evidence = audit["materials"][family][channel]
                  assert evidence["id"] == receipt_id
                  assert evidence["current_moderation_at_audit"] == "APPROVED"
                  assert evidence["ownership_at_audit"] == "9774173158"
                  assert evidence["asset_metadata_http_status"] == 200
                  assert actual[prop] == "rbxassetid://" + receipt_id, (family, channel)
                  seen_ids.add(receipt_id)
          assert len(seen_ids) == 16
          print("PASS: 16 original 2K maps match the real 16/16 Roblox-approved and creator-owned Image IDs.")

          PY

      - name: Attach the actual PNG pack and mobile contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: chaos-survival-original-pbr-2k
          path: build/pbr-2k/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Record non-publication status
        shell: bash
        run: |
          {
            echo '### Chaos Survival — original 2K PBR materials'
            echo ''
            echo '- 4 material families × 4 maps (Color / OpenGL Normal / Roughness / Metallic)'
            echo '- All images: 2048 × 2048 pixels, separate PNG channels'
            echo '- Original deterministic procedural art, no scraped textures'
            echo '- ZIP / contact sheet published as build artifact, NOT as Roblox IDs'
            echo '- **No Roblox asset upload or live-place publication**'
          } >> "$GITHUB_STEP_SUMMARY"
