name: One-time Original South Towers Finishing 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-south-towers-finishing-20261110.yml
permissions:
  contents: read
concurrency:
  group: chaos-original-south-towers-finishing-20261110
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify the seven original cosmetic South Towers meshes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_south_towers_finishing.py --output "$RUNNER_TEMP/finishing.obj" > "$RUNNER_TEMP/finishing.json"
          python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/finishing.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/finishing.gltf" > "$RUNNER_TEMP/finishing-gltf.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          obj=(root/'finishing.obj').read_bytes()
          m=json.loads((root/'finishing.json').read_text())
          g=json.loads((root/'finishing.gltf').read_text())
          assert m['asset']=='south_towers_forged_finishing'
          assert hashlib.sha256(obj).hexdigest()==m['sha256']
          assert 120<=m['groups']<=900 and 3000<=m['triangles']<=18000
          palette={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          assert set(m['materials'])==palette
          x,y,z=m['bounds']
          assert 18.4<=x<=19.1 and 17.3<=y<=18.2 and 4.95<=z<=5.32
          assert all(abs(v)<.55 for v in m['center'])
          for name in (b'BeveledArmoredFoundryFooting',
                       b'DeepRecessedCarbonDeck',
                       b'MachinedVerticalGuide',b'TwistedSuspensionStrand',
                       b'PressedSuspensionCoupler',
                       b'ForgedTransferBeaconBody',
                       b'PiercedSignalBeaconFin'):
              assert name in obj,name
          assert g['asset']['version']=='2.0'
          assert {v['name'] for v in g['materials']}==palette
          prim=g['meshes'][0]['primitives']
          assert len(prim)==7
          assert sum(g['accessors'][v['attributes']['POSITION']]['count']//3
                     for v in prim)==m['triangles']
          assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'}<=set(v['attributes'])
                     for v in prim)
          buf=g['buffers'][0]
          assert len(base64.b64decode(buf['uri'].split(',',1)[1],validate=True))==buf['byteLength']
          source=Path('src/server/MapBuilder.lua').read_text()
          for name in ('"Foundation"','"FloorInset"','"WestLiftRail"',
                       '"EastLiftRail"','"WestSuspension"',
                       '"EastSuspension"','"TransferSignal"'):
              assert name in source,name
          print('SOURCE PASS original South Towers finishing',m['triangles'],m['bounds'],m['sha256'])
          print('NO ROBLOX PLACE PUBLICATION')
          PY
  owner-import:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: south_towers_forged_finishing
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
