# Major milestone: real five-arena 3D coverage, safe Towers bridge trusses, native route fallback.
# Exact-SHA source+engine verification ONLY. NEVER PUBLICLY PUBLISH.
name: One-time QA 2026-11-05 Five Arena Mesh Coverage No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-five-arena-spatial-mesh-bridge-shutter-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-five-arena-spatial-3d-qa-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Verify real creator-owned 3D bridge selection and complete safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          mesh=Path("src/client/PremiumPlatformSideMeshKit.lua").read_text()
          owner=Path("src/client/arena-platform-identity.client.lua").read_text()
          finish=Path("src/client/PlatformFinishKit.lua").read_text()
          routes=Path("src/client/PremiumRouteMeshKit.lua").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          doc=Path("docs/VIS_3D_PLATFORM_SPATIAL_COVERAGE_2026-11-05.md").read_text()
          for marker in (
              "function Kit.selectCarapaceDecks(",
              "local nearCount=math.min(#candidates,math.ceil(limit*.625))",
              "local spreadCap=math.max(base.Size.X,base.Size.Z)*.72",
              "while #selected<math.min(#candidates,limit) do",
              "function Kit.selectBridgeGirders(",
              'local source,bounds=verified("Bridge")',
              'platform.Name:match("^Skybridge%d+$")',
              'platform:GetAttribute("ChaosSkybridge")==true',
              'local shutter=platform:GetAttribute("BridgeShutterPhase")',
              'and scale>=.75 then',
              "selected ~= true",
              "if tier == \"Low\" or selected == false",
              'if not obj:IsA("MeshPart") then return nil end',
          ):
              assert marker in mesh, marker
          for marker in (
              "local nearBridgeGirders = PremiumPlatformSideMeshKit.selectBridgeGirders(",
              "nearBridgeGirders[platform] == true",
              "mountedBridgeGirders += 1",
              'LocalOriginalNearBridgeGirderCount',
              'local bridgeShutterConnections = {}',
              'platform:GetAttributeChangedSignal("BridgeShutterPhase")',
              'if shutter and shutter~="Idle" then',
              'piece.Transparency=1',
              'connection:Disconnect()',
          ):
              assert marker in owner, marker
          assert 'selectedBridge)' in finish
          assert 'parent, platform, tier, index, selectedBridge)' in finish
          for marker in (
              'local function modelsIntact(entry)',
              'model.DescendantRemoving:Connect(function(child)',
              'or not modelsIntact(entry) then',
          ):
              assert marker in routes, marker
          assert 'NO PUBLIC PUBLISH' in doc
          assert '"tests/engine/visual-budget-rules.spec.luau"' in cloud
          assert 'RunService' not in mesh
          assert 'RenderStepped' not in mesh
          print("Verified existing approved meshes, bounded five-arena"
                " distribution, true shutter-safe bridge source owners,"
                " partial-stream restoration and no new render sampler."
                " EXACT SHA QA ONLY, NO PUBLICATION.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-five-arena-mesh-shutter-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
