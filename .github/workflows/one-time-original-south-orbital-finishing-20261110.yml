name: One-time Original South Orbital Finishing 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-south-orbital-finishing-20261110.yml
      - tools/generate_original_south_orbital_finishing.py
permissions:
  contents: read
concurrency:
  group: chaos-original-south-orbital-finishing-20261110
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify real sculpture, suspended spherical core, material groups and glTF
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_south_orbital_finishing.py --output "$RUNNER_TEMP/orbital.obj" > "$RUNNER_TEMP/orbital.json"
          python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/orbital.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/orbital.gltf" > "$RUNNER_TEMP/orbital-gltf.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          obj=(root/'orbital.obj').read_bytes()
          m=json.loads((root/'orbital.json').read_text())
          g=json.loads((root/'orbital.gltf').read_text())
          assert m['asset']=='south_orbital_forged_finishing'
          assert hashlib.sha256(obj).hexdigest()==m['sha256']
          assert 150<=m['groups']<=850 and 3500<=m['triangles']<=16000
          palette={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          assert set(m['materials'])==palette
          x,y,z=m['bounds']
          assert 18.35<=x<=19.1 and 11.0<=y<=11.7 and 4.95<=z<=5.35
          assert all(abs(v)<.35 for v in m['center'])
          for name in (b'BeveledOrbitalPlinthChassis',
                       b'ForgedTwelveFacetOrbitalRingPylon',
                       b'GeodesicOrbitalGlassCore',
                       b'InnerShieldedEnergyNucleus',
                       b'PressForgedClampJaw',
                       b'ClampCeramicRelayContact'):
              assert name in obj,name
          assert g['asset']['version']=='2.0'
          assert {v['name'] for v in g['materials']}==palette
          prim=g['meshes'][0]['primitives']
          assert len(prim)==7
          assert sum(g['accessors'][v['attributes']['POSITION']]['count']//3 for v in prim)==m['triangles']
          assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'}<=set(v['attributes']) for v in prim)
          buf=g['buffers'][0]
          assert len(base64.b64decode(buf['uri'].split(',',1)[1],validate=True))==buf['byteLength']
          source=Path('src/server/MapBuilder.lua').read_text()
          for name in ('"Foundation"','"FloorInset"','"LeftRingSupport"',
                       '"RightRingSupport"','"SuspendedOrb"','"OrbClamp"'):
              assert name in source,name
          print('SOURCE PASS original South Orbital finishing',m['triangles'],m['bounds'],m['sha256'])
          print('NO ROBLOX PLACE PUBLICATION')
          PY
  owner-import:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: south_orbital_forged_finishing
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
