# Important major milestone: approved original 3D Harbor container freighter, no
# game publishing. This file alone triggers the checks on exact main SHA.
# Final exact SHA includes approved asset provenance registry and roadmap.
name: One-time QA 2026-11-04 Harbor Freighter 3D No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261104-harbor-freighter-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-harbor-freighter-3d-qa-20261104
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Source integrity guard for the actual visual batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          asset=Path("src/server/PremiumHarborFreighterAssets.lua").read_text()
          client=Path("src/client/HarborFreighterMeshKit.lua").read_text()
          art=Path("tools/generate_original_harbor_freighter.py").read_text()
          workflow=Path(".github/workflows/upload-original-3d-models.yml").read_text()
          init=Path("src/server/init.server.lua").read_text()
          lod=Path("src/client/scenery-lod.client.lua").read_text()
          budget=Path("src/shared/VisualBudgetRules.lua").read_text()
          native=Path("src/server/HarborScenery.lua").read_text()
          assert "128820723471019" in asset and "128820723471019" in client
          assert "OriginalMeshScenery.sanitize(imported)" in asset
          assert "ApprovedHarborFreighterTemplates" in asset
          assert "PremiumHarborFreighterAssets.start" in init
          assert "HarborFreighterMeshKit.sync" in lod
          assert "LocalOriginalHarborFreighterCount" in lod
          assert "OriginalHarborFreighterLocal" in budget
          assert "HarborCargoVessel" in client and "HarborCargoVessel" in native
          assert "MainCargoDeck" in client and "MainCargoDeck" in native
          assert "HarborVesselScenery" in client and "HarborVesselScenery" in native
          assert "CanCollide=false" in client and "CanTouch=false" in client
          assert "part.Transparency=visible and 1 or alpha" in client
          assert 'quality=="Low"' in client and 'quality=="High"' in client
          assert "harbor_freighter" in workflow
          assert "NineStationChinedDisplacementHull" in art
          assert "ISOContainerBody" in art
          assert "CommandBridgeGlazing" in art
          assert "SOURCE_SCALE = 3.5" in client
          print("Verified original Harbor cargo freighter 3D, native vessel fallback and Android census; NO PUBLISH")
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-harbor-freighter-source-only",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
