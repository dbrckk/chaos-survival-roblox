name: Platform original 3D streaming ownership regression
on:
  pull_request:
    paths:
      - src/client/PlatformNativeTrimReplacementKit.lua
      - src/client/PremiumPlatformSideMeshKit.lua
      - src/client/PremiumLargeStructureMeshKit.lua
      - src/client/arena-platform-identity.client.lua
      - src/server/MapBuilder.lua
      - src/server/PremiumPlatformSideAssets.lua
      - tools/verify_platform_trim_mesh_ownership.py
      - .github/workflows/platform-trim-streaming-regression.yml
  push:
    branches: [main]
    paths:
      - src/client/PlatformNativeTrimReplacementKit.lua
      - src/client/PremiumPlatformSideMeshKit.lua
      - src/client/PremiumLargeStructureMeshKit.lua
      - src/client/arena-platform-identity.client.lua
      - src/server/MapBuilder.lua
      - src/server/PremiumPlatformSideAssets.lua
      - tools/verify_platform_trim_mesh_ownership.py
      - .github/workflows/platform-trim-streaming-regression.yml
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/verify_platform_trim_mesh_ownership.py
