# Creator-owned original Mesh asset import, never publishes the game.
# This workflow is intentionally single-use and source-gated.
name: One-time Towers Original Machinery Sculpture 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-towers-machinery-20261110.yml
permissions:
  contents: read
concurrency:
  group: chaos-one-time-original-towers-machinery-20261110
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Confirm real original sculpted seven-material geometry before API call
        run: python3 tools/verify_variant_towers_machinery_source.py
  owner-import:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: variant_towers_sculpted_machinery
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
