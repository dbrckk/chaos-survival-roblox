# Existing approved 2K source materials across authentic bridge and Sky Spine UV MeshParts; never publish.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-05 Approved 2K Bridge and Sky Spine PBR No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-approved-2k-bridge-arch-pbr-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-approved-route-arch-pbr-qa-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Verify genuine source-approved 2K bridge-to-crown PBR material, engine contracts and hazard rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pbr=Path("src/client/PremiumRoutePbrKit.lua").read_text()
          bridge=Path("src/client/PremiumRouteMeshKit.lua").read_text()
          crown=Path("src/client/SkySpineCrownMeshKit.lua").read_text()
          lod=Path("src/client/scenery-lod.client.lua").read_text()
          originals=Path("src/client/PremiumGroundPbrKit.lua").read_text()
          source=Path("src/server/PremiumRouteMeshAssets.lua").read_text()
          proj=Path("default.project.json").read_text()
          spec=Path("tests/engine/visual-budget-rules.spec.luau").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          doc=Path("docs/APPROVED_2K_PBR_BRIDGE_TO_SKY_SPINE_JOINTS_2026-11-05.md").read_text()
          assert 'OriginalGroundPbrTemplates' in proj
          for name in ('BrushedTitanium','OxidizedSteel','DiamondArmor','ReactorCeramic'):
              assert '"'+name+'"' in proj,name
              assert '"'+name+'"' in pbr or name in pbr,name
          assert 'OriginalSkySpineCrown = 71492051540032' in source
          assert 'PremiumSkybridgeModule = 94023662427980' in source
          assert 'route = 94023662427980' in pbr
          assert 'crown = 71492051540032' in pbr
          assert 'OriginalPremiumRouteAssetId' in pbr
          assert 'Original3DAssetId' in pbr
          assert 'CosmeticOnly' in pbr
          assert 'name:find("SIGNAL", 1, true)' in pbr
          assert 'name:find("GRIP", 1, true)' in pbr
          assert 'name:find("CARBON", 1, true)' in pbr
          assert 'function Kit.entryBudget(' in pbr
          assert 'function Kit.apply(' in pbr
          assert 'function Kit.detach(' in pbr
          assert 'function Kit.count(' in pbr
          assert 'entry.routePbrStates = states' in pbr
          assert 'OriginalApprovedBridgePbr2K' in pbr
          assert 'for _, model in ipairs(models) do' in pbr
          assert 'for _, existing in ipairs(states) do release(existing) end' in pbr
          assert 'old.appearance.Parent = part' in pbr
          assert 'return GroundFinishes.family(variant)' in pbr
          assert 'local function syncVisibility(entry, platform)' in bridge
          assert 'if not safe then PremiumRoutePbrKit.detach(entry) end' in bridge
          assert 'PremiumRoutePbrKit.detach(entry)' in crown
          assert 'PremiumRoutePbrKit.entryBudget(' in bridge
          assert 'PremiumRoutePbrKit.entryBudget(' in crown
          assert 'PremiumRoutePbrKit.apply(entry, "route"' in bridge
          assert 'PremiumRoutePbrKit.apply(entry, "crown"' in crown
          assert 'function PremiumRouteMeshKit.pbrCount()' in bridge
          assert 'function Kit.pbrCount()' in crown
          assert 'LocalOriginalRoutePbr2KAppearanceCount' in lod
          assert 'LocalOriginalSkySpinePbr2KAppearanceCount' in lod
          assert 'player:GetAttribute("PbrMaterialsDisabled") == true' in lod
          assert 'isTouch' in lod
          assert 'finishes authenticated bridge joints and Sky Spine crowns' in spec
          assert 'expect(kit.apply(entry, "route", "Classic", true)).toBe(3)' in spec
          assert 'expect(original.Parent).toBe(metal)' in spec
          assert 'expect(kit.apply(portico, "crown", "Towers", true)).toBe(1)' in spec
          assert '"tests/engine/visual-budget-rules.spec.luau"' in cloud
          assert 'ce lot crée du code source' in doc.lower()
          assert 'SurfaceAppearance' in originals
          for target in (pbr,bridge,crown):
              assert 'RenderStepped' not in target
              assert 'Heartbeat' not in target
              assert 'LoadAssetAsync' not in target
          assert 'ColorMap =' not in pbr and 'NormalMap =' not in pbr
          print("Verified authentic UV PBR continuity across ALL true bridge "
                "segments and approved Sky Spine arches, original importer "
                "restoration, protected grip/signal, bounded Android pressure "
                "and real Roblox engine PBR suites. NEVER PUBLISH.", flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-approved-route-arch-pbr-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
