# Important milestone: approved original Harbor hero signal station + live hoist, no
# game publishing. This file alone triggers the checks on exact main SHA.
# Exact main SHA has 58 approved assets, 7 MeshParts, native radar/cable/weight animations.
name: One-time QA 2026-11-04 Harbor Hero Signal Station 3D No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261104-harbor-hero-signal-station-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-harbor-hero-signal-station-qa-20261104
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Source integrity guard for the actual visual batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          asset=Path("src/server/PremiumHarborHeroStationAssets.lua").read_text()
          client=Path("src/client/HarborHeroStationMeshKit.lua").read_text()
          art=Path("tools/generate_original_harbor_hero_station.py").read_text()
          importer=Path(".github/workflows/upload-original-3d-models.yml").read_text()
          init=Path("src/server/init.server.lua").read_text()
          lod=Path("src/client/scenery-lod.client.lua").read_text()
          ledger=Path("src/shared/VisualBudgetRules.lua").read_text()
          native=Path("src/client/arena-hero-scenery.client.lua").read_text()
          motion=Path("src/client/arena-hero-motion.client.lua").read_text()
          registry=json.loads(Path("assets/source/roblox-asset-registry.json").read_text())
          assert len(registry["models"])==58
          item=next(x for x in registry["models"]
                    if x["name"]=="harbor_hero_station")
          assert item["asset_id"]=="73237902371094"
          assert item["moderation"]=="Approved"
          assert item["workflow_run_id"]==41859877575
          assert item["source"]=="tools/generate_original_harbor_hero_station.py"
          assert "73237902371094" in asset and "73237902371094" in client
          assert "OriginalMeshScenery.sanitize(raw)" in asset
          assert "ApprovedHarborHeroStationTemplates" in asset
          assert "PremiumHarborHeroStationAssets.start" in init
          assert "HarborHeroStationMeshKit.sync" in lod
          assert "LocalOriginalHarborHeroStationCount" in lod
          assert "OriginalHarborHeroStationLocal" in ledger
          assert "OriginalHarborHeroMotionRole" in client
          assert "OriginalHarborHeroMotionRole" in asset
          assert "counts.Static ~= 4" in asset
          assert "roles.Static~=4" in client
          assert "SOURCE_SCALE=.74" in client
          assert "SOURCE_CENTER=Vector3.new(5.05801,-.60865,0)" in client
          assert "SOURCE_SHIFT_Y=20" in client
          assert "HarborHeroGantryCrosshead" in native
          assert "HarborHeroPierFoundation" in native
          assert "HarborHeroRadarArm" in native and "HarborHeroRadarArm" in client
          assert "HarborHeroStormLens" in native and "HarborHeroStormLens" in client
          assert "HarborHeroHoistCable" in native and "HarborHeroHoistCable" in client
          assert "HarborHeroHoistWeight" in native and "HarborHeroHoistWeight" in client
          assert "harborRadar" in motion and "harborCable" in motion
          assert "harborWeight" in motion
          assert 'native:GetPropertyChangedSignal("CFrame")' in client
          assert 'native:GetPropertyChangedSignal("Transparency")' in client
          assert "syncMotion(e)" in client
          assert "part.Transparency=show and 1 or original" in client
          assert "native.Transparency=1" in client
          assert "p.CanCollide=false" in client and "p.CanTouch=false" in client
          assert "Low={count=0" in client
          assert "Medium={count=1" in client
          assert "High={count=1" in client
          assert "harbor_hero_station" in importer
          assert "MOVING" in art and "MaritimeTenFacetedLoadPier" in art
          assert "RadarArm_ClosedOctagonalRoot" in art
          assert "Cable_TrueSwagedHoistCore" in art
          assert "Weight_OriginalSuspendedMarineCase" in art
          assert "RunService" not in client and "task.spawn" not in client
          print("Verified REAL approved Harbor hero 3D station, three native-animated mesh roles, safe source/natives, mobile LOD, 58 approved receipts. NO PUBLICATION.")
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-harbor-hero-station-source-only",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
