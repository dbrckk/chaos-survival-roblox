name: One-Shot Approved Recovery of Two Remaining PBR Images

# Owner explicitly requested automation of the two remaining diamondplate
# Image uploads, not a public Roblox place publish. First-run-only gate:
# an exact approved squash-merge title + changed workflow path on main.
# No workflow_dispatch; do not rerun the job if an Image POST is uncertain.
on:
  pull_request:
    paths:
      - '.github/workflows/one-shot-owned-pbr-recovery.yml'
      - 'tools/one_shot_recover_diamondplate.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-owned-pbr-recovery.yml'

permissions:
  contents: read

concurrency:
  group: chaos-pbr-one-shot-owner-short-names-20261028
  cancel-in-progress: false

jobs:
  verify-no-upload:
    name: Verify both original 2K maps without uploading
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image generation dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'numpy==2.1.3' 'pillow==11.1.0'

      - name: Generate only original diamondplate maps
        run: |
          python tools/generate_pbr_materials.py --size 2048 --material armored_diamondplate --output build/pbr-recovery-once

      - name: Prove two missing channels can be recovered without Image POSTs
        run: |
          python tools/one_shot_recover_diamondplate.py --dry-run

      - name: Preserve inspectable dry-run source and proof
        uses: actions/upload-artifact@v4
        with:
          name: chaos-pbr-remaining-two-dry-run
          path: build/pbr-recovery-once/
          if-no-files-found: error
          retention-days: 14

  approved-one-shot-upload:
    name: Owner-approved one-time two-image recovery
    needs: verify-no-upload
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.run_attempt == 1
      && startsWith(github.event.head_commit.message, 'fix(pbr): approved one-shot retry after rejected asset names')
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CHAOS_PBR_OWNER_APPROVED_ONCE: 'true'
      ROBLOX_ASSET_API_KEY: ${{ secrets.ROBLOX_ASSET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install original PNG dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'numpy==2.1.3' 'pillow==11.1.0'

      - name: Reproduce original 2048x2048 source images
        run: |
          python tools/generate_pbr_materials.py --size 2048 --material armored_diamondplate --output build/pbr-recovery-once

      - name: Upload ONLY missing roughness and metallic, once each
        run: |
          python tools/one_shot_recover_diamondplate.py --execute

      - name: Preserve every attempted operation even after an HTTP error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-owner-approved-pbr-short-name-recovery
          path: build/pbr-recovery-once/roblox-operations/
          if-no-files-found: warn
          retention-days: 30
