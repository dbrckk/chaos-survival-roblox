# Authentic original SOUTH Orbital torus only; NEVER publishes a Roblox Place.
name: One-time Original South Orbital Observation 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-south-orbital-ring-20261110.yml
permissions:
  contents: read
concurrency:
  group: chaos-original-south-orbital-20261110
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate real hollow South 3D ring source, normals, tangents, UV and 7 PBR materials
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_south_orbital_observation_ring.py --output "$RUNNER_TEMP/south_orbital_ring.obj" > "$RUNNER_TEMP/south_orbital_ring.json"
          python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/south_orbital_ring.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/south_orbital_ring.gltf" > "$RUNNER_TEMP/south_orbital_ring.gltf.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          obj=(root/'south_orbital_ring.obj').read_bytes()
          meta=json.loads((root/'south_orbital_ring.json').read_text())
          gltf=json.loads((root/'south_orbital_ring.gltf').read_text())
          assert meta['asset']=='south_orbital_observation_torus'
          assert hashlib.sha256(obj).hexdigest()==meta['sha256']
          assert 44<=meta['groups']<=58 and 5700<=meta['triangles']<=8700
          w,h,d=meta['bounds']
          assert 14.65<=w<=15.10 and 14.65<=h<=15.10
          assert 1.0<=d<=1.6
          palette={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          assert set(meta['materials'])==palette
          for required in (b'ContinuousSouthSeventyTwoSegmentForgedHull',
                           b'BrushedSouthInnerObservationTrack',
                           b'SubsurfaceCarbonRearContainment',
                           b'SatinCeramicSouthShield',
                           b'BracedSouthAngularFieldCoupler',
                           b'SouthRadialVentedMetalCassette',
                           b'SouthCeramicLightReader'):
              assert required in obj,required
          assert gltf['asset']['version']=='2.0'
          assert {m['name'] for m in gltf['materials']}==palette
          primitives=gltf['meshes'][0]['primitives']
          assert len(primitives)==7
          assert sum(gltf['accessors'][p['attributes']['POSITION']]['count']//3 for p in primitives)==meta['triangles']
          assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'}<=set(p['attributes']) for p in primitives)
          buf=gltf['buffers'][0]
          assert len(base64.b64decode(buf['uri'].split(',',1)[1],validate=True))==buf['byteLength']
          source=Path('src/server/MapBuilder.lua').read_text()
          for required in ('"SouthHorizonMonument"','"ObservationArc"',
                           '"SuspendedOrb"','"OrbClamp"'):
              assert required in source
          print('SOURCE PASS SOUTH hollow Orbital ring',meta['triangles'],meta['bounds'],meta['sha256'])
          print('NO ROBLOX PLACE UPDATE')
          PY
  owner-import:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: south_orbital_observation_torus
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
