name: One-time Original South Towers Forged Skytransfer 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-south-towers-skytransfer-20261110.yml
permissions:
  contents: read
concurrency:
  group: chaos-original-south-towers-skytransfer-20261110
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify authentic South Towers truss and elevator geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_south_towers_skytransfer.py --output "$RUNNER_TEMP/south_towers.obj" > "$RUNNER_TEMP/south_towers.json"
          python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/south_towers.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/south_towers.gltf" > "$RUNNER_TEMP/south_towers-gltf.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          obj=(root/'south_towers.obj').read_bytes()
          m=json.loads((root/'south_towers.json').read_text())
          g=json.loads((root/'south_towers.gltf').read_text())
          assert m['asset']=='south_towers_forged_skytransfer'
          assert hashlib.sha256(obj).hexdigest()==m['sha256']
          assert 50<=m['groups']<=300 and 1300<=m['triangles']<=9000
          palette={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          assert set(m['materials'])==palette
          x,y,z=m['bounds']
          assert 19.5<=x<=20.4 and 4.35<=y<=4.85 and 2.75<=z<=3.2
          assert all(abs(v)<.3 for v in m['center'])
          for name in (b'ContinuousTenSidedLoadChord',b'DiagonalForgedTruss',
                       b'CrossBracedTransfer',b'SuspendedLiftDeck',
                       b'HangingLiftCorner',b'VisibleCableGrille',
                       b'TransferNavigationLamp'):
              assert name in obj,name
          assert g['asset']['version']=='2.0'
          assert {v['name'] for v in g['materials']}==palette
          prim=g['meshes'][0]['primitives']
          assert len(prim)==7
          assert sum(g['accessors'][v['attributes']['POSITION']]['count']//3 for v in prim)==m['triangles']
          assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'}<=set(v['attributes']) for v in prim)
          buf=g['buffers'][0]
          assert len(base64.b64decode(buf['uri'].split(',',1)[1],validate=True))==buf['byteLength']
          source=Path('src/server/MapBuilder.lua').read_text()
          for name in ('"SkyTransfer"','"UnderslungLift"','"WestLift"','"EastLift"'):
              assert name in source,name
          print('SOURCE PASS original South Towers sky-transfer',m['triangles'],m['bounds'],m['sha256'])
          print('NO ROBLOX PLACE PUBLICATION')
          PY
  owner-import:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: south_towers_forged_skytransfer
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
