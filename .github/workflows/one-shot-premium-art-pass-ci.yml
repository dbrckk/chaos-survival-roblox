name: One-shot Premium Art Pass Luau Rojo and Mobile Build
on:
  push:
    branches: [feat/premium-art-direction-ui-light-surface-20261103]
    paths: ['.github/workflows/one-shot-premium-art-pass-ci.yml']
permissions:
  contents: read
jobs:
  compile-and-build:
    if: github.repository == 'dbrckk/chaos-survival-roblox'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Compile ALL Luau source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          unzip -tq /tmp/luau.zip >/dev/null
          mkdir -p /tmp/luau && unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 |
            xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
      - name: Existing Android first-frame and VFX budget gate
        run: python tools/validate_mobile_vfx_first_frame.py
      - name: Verify material assets & app source gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'addMachinedFrame' src/shared/UITheme.lua
          grep -q 'OriginalStructuralBevel' src/server/MapBuilder.lua
          grep -q 'ORIGINAL_MESH_LIMIT' src/client/scenery-lod.client.lua
          grep -q '32 Medium / 72 High' docs/PREMIUM_ART_PASS_2026-11-03.md
          grep -q 'PremiumArchitecturalSurface' src/server/ArenaGroundArchitecture.lua
      - name: Install pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -tq /tmp/rojo.zip >/dev/null
          mkdir -p /tmp/rojo && unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          echo /tmp/rojo >> "$GITHUB_PATH"
      - name: Build full place for real engine
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel CANDIDATE
          mkdir -p build
          rojo build default.project.json -o build/ChaosSurvival.rbxlx
          test -s build/ChaosSurvival.rbxlx
          grep -Fq "$GITHUB_SHA" build/ChaosSurvival.rbxlx
          echo "PASS: full Luau compile and original place build. NO PUBLIC PUBLISH."
