# One-shot source-gated owner import of a REAL new original 3D Sky Spine
# monument. No Roblox place mutation. Future runtime mounting must be
# separately verified and guarded after Roblox moderation is Approved.
name: One-time Sky Spine 3D Import Diagnostics 2026-11-03
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-import-sky-spine-diagnostics-20261103.yml'
permissions:
  contents: read
concurrency:
  group: chaos-sky-spine-3d-diagnostic-20261103
  cancel-in-progress: false
jobs:
  source-gate:
    name: Validate authentic sculpted open crown, UV tangents and Android geometry
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check original source, real triangles and self-contained glTF
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_sky_spine_crown.py --output assets/source/chaos_sky_spine_crown.obj > "$RUNNER_TEMP/sky-spine-crown.json"
          python3 tools/obj_to_gltf.py --source assets/source/chaos_sky_spine_crown.obj --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/sky-spine-crown.gltf"
          python3 - "$RUNNER_TEMP/sky-spine-crown.json" "$RUNNER_TEMP/sky-spine-crown.gltf" <<'PY'
          import base64,json,sys
          from pathlib import Path
          src=json.loads(Path(sys.argv[1]).read_text())
          doc=json.loads(Path(sys.argv[2]).read_text())
          assert src["name"]=="sky_spine_crown" and 1000<=src["triangles"]<=6500
          assert 16<=src["dimensions"][0]<=21 and 19<=src["dimensions"][1]<=23
          assert 3<=src["dimensions"][2]<=7 and src["bounds_min"][1]>=-0.01
          assert doc["asset"]["version"]=="2.0"
          assert {m["name"] for m in doc["materials"]}=={"ARMOR","BRUSHED","CARBON","GRIP","ALLOY","CERAMIC","SIGNAL"}
          parts=doc["meshes"][0]["primitives"]
          assert len(parts)==7
          assert sum(doc["accessors"][p["attributes"]["POSITION"]]["count"]//3 for p in parts)==src["triangles"]
          assert all({"POSITION","NORMAL","TEXCOORD_0","TANGENT"}<=set(p["attributes"]) for p in parts)
          payload=base64.b64decode(doc["buffers"][0]["uri"].split(",",1)[1],validate=True)
          assert len(payload)==doc["buffers"][0]["byteLength"]
          # Source-authored aperture invariant: no triangle in the lower
          # 12-stud height may project into the center 12-stud walkway.
          vertices=[tuple(map(float,line.split()[1:]))
                    for line in Path("assets/source/chaos_sky_spine_crown.obj").read_text().splitlines()
                    if line.startswith("v ")]
          assert all(not(abs(x)<6.0 and y<12.0)
                     for x,y,z in vertices)
          print("AUTHENTIC SKY SPINE CROWN VALIDATED",src)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chaos-original-sky-spine-crown-3d-source
          path: |
            ${{ runner.temp }}/sky-spine-crown.gltf
            ${{ runner.temp }}/sky-spine-crown.json
          retention-days: 14
  import-approved-owner:
    name: Upload only verified source to existing owner Roblox Model library
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: sky_spine_crown
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
