# Four original owned Models only; no Roblox Place publish.
name: One-time Original Sculpted Exterior Towers 2026-11-09
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-exterior-towers-20261109.yml
permissions:
  contents: read
concurrency:
  group: chaos-original-exterior-silhouette-towers-20261109
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Source-validate four sculpted 3D silhouettes and seven PBR materials
        shell: bash
        run: |
          set -euo pipefail
          for model in exterior_tower_21 exterior_tower_24 exterior_tower_27 exterior_tower_30; do
            python3 tools/generate_original_exterior_towers.py --model "$model" --output "$RUNNER_TEMP/chaos_$model.obj" > "$RUNNER_TEMP/$model.json"
            python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/chaos_$model.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/chaos_$model.gltf" > "$RUNNER_TEMP/$model-export.json"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import base64,hashlib,json,sys
          root=Path(sys.argv[1])
          materials={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          for height in (21,24,27,30):
              profile=f'exterior_tower_{height}'
              obj=(root/f'chaos_{profile}.obj').read_bytes()
              info=json.loads((root/f'{profile}.json').read_text())
              gltf=json.loads((root/f'chaos_{profile}.gltf').read_text())
              assert info['asset']==profile and info['native_height']==height
              assert info['sha256']==hashlib.sha256(obj).hexdigest()
              assert 25<=info['groups']<=120 and 550<=info['triangles']<=7000
              assert materials==set(info['materials'])
              w,h,d=info['bounds']
              assert 11.65<=w<=11.99 and height+.9<=h<=height+1.25 and 9.70<=d<=9.99
              for term in (b'TwelveFacetStaggeredFoundryCore',
                           b'InclinedLeftRightLoadSpar',
                           b'DeepInsetVent', b'ClosedCastWeatherRoof',
                           b'RecessedRoofAssetCode'):
                  assert term in obj,term
              assert gltf['asset']['version']=='2.0'
              assert {m['name'] for m in gltf['materials']}==materials
              primitives=gltf['meshes'][0]['primitives']
              assert len(primitives)==7
              assert sum(gltf['accessors'][p['attributes']['POSITION']]['count']//3
                         for p in primitives)==info['triangles']
              assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'}
                         <=set(p['attributes']) for p in primitives)
              b=gltf['buffers'][0]
              assert len(base64.b64decode(b['uri'].split(',',1)[1],validate=True))==b['byteLength']
              print('VERIFIED SCULPTED EXTERIOR TOWER',profile,info['triangles'],
                    info['groups'],info['bounds'],info['sha256'])
          print('NO ROBLOX PLACE PUBLISH')
          PY
  import-21:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: exterior_tower_21
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
  import-24:
    needs: import-21
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: exterior_tower_24
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
  import-27:
    needs: import-24
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: exterior_tower_27
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
  import-30:
    needs: import-27
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: exterior_tower_30
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
