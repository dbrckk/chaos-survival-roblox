# Major Harbor milestone: four original nearshore 3D cargo barges, no
# game publishing. This file alone triggers the checks on exact main SHA.
# Exact main SHA has 59 approved creator assets, four source-gated original 3D barges.
name: One-time QA 2026-11-04 Harbor Original Midground Barges 3D No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261104-harbor-nearshore-barges-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-harbor-nearshore-barges-qa-20261104
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Source integrity guard for the actual visual batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          asset=Path("src/server/PremiumHarborMidgroundBargeAssets.lua").read_text()
          client=Path("src/client/HarborMidgroundBargeMeshKit.lua").read_text()
          art=Path("tools/generate_original_harbor_barge.py").read_text()
          importer=Path(".github/workflows/upload-original-3d-models.yml").read_text()
          init=Path("src/server/init.server.lua").read_text()
          lod=Path("src/client/scenery-lod.client.lua").read_text()
          budget=Path("src/shared/VisualBudgetRules.lua").read_text()
          source=Path("src/client/arena-midground-mass.client.lua").read_text()
          ci=Path(".github/workflows/ci.yml").read_text()
          registry=json.loads(Path("assets/source/roblox-asset-registry.json").read_text())
          assert len(registry["models"])==59
          model=next(x for x in registry["models"]
              if x["name"]=="harbor_midground_barge")
          assert model["asset_id"]=="132891280963772"
          assert model["moderation"]=="Approved"
          assert model["source"]=="tools/generate_original_harbor_barge.py"
          assert model["workflow_run_id"]==41862430789
          assert "132891280963772" in asset and "132891280963772" in client
          assert "OriginalMeshScenery.sanitize(raw)" in asset
          assert "ApprovedHarborBargeTemplates" in asset
          assert "CoastalFreightBarge" in asset and "CoastalFreightBarge" in client
          assert "authenticShape" in asset and "n~=7" in asset
          assert "Original3DTriangleCount" in asset
          assert "PremiumHarborMidgroundBargeAssets.start" in init
          assert "OriginalHarborMidgroundBargeIndex" in source
          assert "HarborFreightBargeHull" in source
          assert "ArenaDetailKit.build" in source
          assert "HarborMidgroundBargeMeshKit.sync" in lod
          assert "LocalOriginalHarborBargeCount" in lod
          assert "OriginalHarborMidgroundBargesLocal" in budget
          assert "APPROVED_ID=132891280963772" in client
          assert "ORIGINAL_CENTER=Vector3.new(-.025,3.56,0)" in client
          assert 'Low={models=0' in client
          assert 'Medium={models=2' in client
          assert 'High={models=4' in client
          assert "press" in client and "cameraPoint" in client
          assert "part.Transparency=show and 1 or original" in client
          assert "part.Transparency=original" in client
          assert "part.CanCollide=false" in client
          assert "part.CanTouch=false" in client
          assert "part.CanQuery=false" in client
          assert "GetDescendants()" in client
          assert 'index=1,4' in client
          assert "HarborFreightBargeHull([1-4])" in client
          assert "ThirteenStationChinedShallowDraftHull" in art
          assert "OriginalISOContainerShell" in art
          assert "DoubleGlazedHarborWheelhouse" in art
          assert "MooringHawseSpoke" in art
          assert "harbor_midground_barge" in importer
          assert "harbor_midground_barge" in ci
          assert "assert len(models) == 59" in ci
          assert "RunService" not in client and "task.spawn" not in client
          print("VERIFIED 4 sculpted authentic Harbor barges, Approved 3718-triangle Model, exact center, Low/mobile fallback, 59 owner assets; NO PUBLIC PUBLISH")
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-harbor-midground-barges-source-only",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
