name: Approved Crossroads open gantry runtime regression
on:
  pull_request:
    paths:
      - src/client/ApprovedCrossroadsOpenGantryMeshKit.lua
      - src/server/PremiumCrossroadsGantryAssets.lua
      - src/client/scenery-lod.client.lua
      - src/server/init.server.lua
      - src/server/MapBuilder.lua
      - assets/source/roblox-asset-registry.json
      - tools/generate_original_variant_crossroads_gantry.py
      - tools/verify_variant_crossroads_gantry_runtime.py
      - .github/workflows/crossroads-gantry-runtime-regression.yml
  push:
    branches: [main]
    paths:
      - src/client/ApprovedCrossroadsOpenGantryMeshKit.lua
      - src/server/PremiumCrossroadsGantryAssets.lua
      - src/client/scenery-lod.client.lua
      - src/server/init.server.lua
      - src/server/MapBuilder.lua
      - assets/source/roblox-asset-registry.json
      - tools/generate_original_variant_crossroads_gantry.py
      - tools/verify_variant_crossroads_gantry_runtime.py
      - .github/workflows/crossroads-gantry-runtime-regression.yml
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify genuine approved truss, four placements and fallback
        run: python3 tools/verify_variant_crossroads_gantry_runtime.py
