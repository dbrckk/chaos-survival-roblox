name: One-Time PR561 Luau and Place Build
on:
  push:
    branches:
      - feat/major-android-bot-obstacle-navigation-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luau-and-rojo:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 15 --max-time 90 \
            -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          unzip -tq /tmp/luau.zip
          unzip -q /tmp/luau.zip -d /tmp
          chmod +x /tmp/luau-compile
      - name: Compile actual game source and existing engine checks
        shell: bash
        run: |
          set -euo pipefail
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 |
            xargs -0 -n1 /tmp/luau-compile >/dev/null
      - name: Validate Android VFX and physical navigation integration
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_mobile_vfx_first_frame.py
          python - <<'PY'
          from pathlib import Path
          s = Path("src/server/AISurvivorService.lua").read_text()
          for requirement in (
              'PathfindingService:CreatePath',
              'path:ComputeAsync(start, goal)',
              'record.groundNavigationToken ~= token',
              'hit.Instance == base',
              'cancelGroundNavigation(record)',
              'advanceGroundNavigation(record, root, now)',
          ):
              assert requirement in s, requirement
          print("Physical route integration present")
          PY
      - name: Download pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 15 --max-time 90 \
            -o /tmp/rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -tq /tmp/rojo.zip
          unzip -q /tmp/rojo.zip -d /tmp
          chmod +x /tmp/rojo
      - name: Build source Roblox place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          /tmp/rojo build default.project.json -o build/ChaosSurvival.rbxlx
          test -s build/ChaosSurvival.rbxlx
