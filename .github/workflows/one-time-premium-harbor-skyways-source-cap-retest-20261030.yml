# Final verification after preserving 94 native Harbor decks and correcting
# test source ownership for the authoritative candidate skyway jump rules.
# Tests only: NEVER publishes Roblox. All five engine suites + build on exact SHA.
name: One-time Storm Harbor Freighter 2K PBR Corrected Final QA 2026-10-30
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-premium-harbor-skyways-source-cap-retest-20261030.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: storm-harbor-cargo-pbr-corrected-final-20261030
  cancel-in-progress: false
jobs:
  final-quality:
    if: github.repository == 'dbrckk/chaos-survival-roblox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Dispatch final build and real Roblox engine verification for exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo, sha = os.environ['REPO'], os.environ['CANDIDATE_SHA']
          root = 'https://api.github.com/repos/' + repo
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'chaos-survival-harbor-qa',
          }

          def request(path, payload=None):
              data = json.dumps(payload).encode('utf-8') if payload is not None else None
              req = urllib.request.Request(
                  root + path, data=data,
                  method='POST' if data is not None else 'GET',
                  headers={**headers, 'Content-Type': 'application/json'},
              )
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=40) as response:
                          if data is not None:
                              if response.status != 204:
                                  raise RuntimeError('Unexpected dispatch response')
                              return {}
                          return json.load(response)
                  except (OSError, TimeoutError):
                      if attempt == 3:
                          raise
                      time.sleep(3 * (attempt + 1))

          def assert_head():
              actual = request('/git/ref/heads/main')['object']['sha']
              if actual != sha:
                  raise SystemExit('main changed: refusing stale candidate ' + sha)

          assert_head()
          checks = {
              'Build Validation': 'ci.yml',
              'Roblox Open Cloud Engine Tests': 'roblox-cloud-test.yml',
          }
          for label, workflow in checks.items():
              request('/actions/workflows/' + workflow + '/dispatches', {'ref': 'main'})
              print('Dispatched existing final milestone:', label, sha, flush=True)
              time.sleep(3)

          for i in range(440):
              assert_head()
              runs = request('/actions/runs?head_sha=' + sha + '&per_page=100')
              found = {}
              for run in runs.get('workflow_runs', []):
                  label = run.get('name')
                  if label not in checks or run.get('head_sha') != sha:
                      continue
                  if run.get('head_branch') != 'main' or run.get('event') != 'workflow_dispatch':
                      continue
                  old = found.get(label)
                  if old is None or run['id'] > old['id']:
                      found[label] = run
              states = {k: (found.get(k) or {}).get('status', 'pending')
                        + '/' + str((found.get(k) or {}).get('conclusion'))
                        for k in checks}
              if i % 4 == 0:
                  print('Exact-SHA final milestone:', states, flush=True)
              for label in checks:
                  run = found.get(label)
                  if run and run['status'] == 'completed' and run['conclusion'] != 'success':
                      raise SystemExit(label + ' FAILED: no certification and NO PUBLICATION')
              if all(found.get(label, {}).get('status') == 'completed'
                     and found[label].get('conclusion') == 'success'
                     for label in checks):
                  print('FINAL BUILD AND ENGINE PASS', sha, flush=True)
                  for label in checks:
                      print(label, found[label]['html_url'], flush=True)
                  print('No public publishing was requested or executed by this workflow.', flush=True)
                  print('Studio/Android visual and tactile checks remain unverified.', flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit('Timed out waiting for both final checks; NO PUBLICATION')
          PY
