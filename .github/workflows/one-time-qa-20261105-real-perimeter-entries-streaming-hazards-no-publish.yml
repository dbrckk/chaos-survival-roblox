# Important first-minute gameplay safety milestone: real route entry hints on late Android streaming.
# Dispatch Build Validation + seven real Roblox Cloud engine suites on identical SHA. NEVER publish.
name: One-time QA 2026-11-05 Real Four-Route Guidance No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-real-perimeter-entries-streaming-hazards-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-four-real-entry-guides-qa-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Guard server-physical entry provenance, Android late streaming and hazard-safe wayfinding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          server=Path("src/server/MapBuilder.lua").read_text()
          client=Path("src/client/arena-navigation-language.client.lua").read_text()
          ready=Path("src/shared/MapVisualReadiness.lua").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          contract=Path("docs/VIS_REAL_PERIMETER_ENTRY_STREAMING_AND_HAZARD_GUIDES_2026-11-05.md").read_text()
          assert 'if definition.PerimeterStep == 1 then' in server
          assert 'CollectionService:AddTag(platform, "ChaosPerimeterEntry")' in server
          assert server.index('if definition.PerimeterStep == 1 then') < server.index('CollectionService:AddTag(platform, "ChaosPerimeterEntry")')
          for marker in (
              'local CollectionService = game:GetService("CollectionService")',
              'local perimeterGuides = {}',
              'local function routeEntrySafe(target, platforms, routeId)',
              'target.Parent ~= platforms',
              'CollectionService:HasTag(target, "ChaosPerimeterEntry")',
              'target:GetAttribute("PerimeterStep") ~= 1',
              'not target.CanCollide or target.Transparency >= 0.75',
              'collapse == nil or collapse == "Normal" or collapse == "Safe"',
              'local function refreshPerimeterGuides()',
              'part:GetAttribute("NavBaseTransparency") or 1',
              'refreshPerimeterGuides()',
              'local function watchEntry(part)',
              'GetInstanceAddedSignal("ChaosPerimeterEntry")',
              'GetInstanceRemovedSignal("ChaosPerimeterEntry")',
              'GetAttributeChangedSignal("CollapsePhase")',
              'GetPropertyChangedSignal("CanCollide")',
              'GetPropertyChangedSignal("Transparency")',
              'GetAttributeChangedSignal(attribute):Connect(scheduleRebuild)',
              'local function bindPlatforms(platforms)',
              'bindPlatforms(nil)',
              'bindPlatforms(arena:FindFirstChild("Platforms"))',
              'task.delay(0.12, function()',
              'disconnectPlatformsWatch = MapVisualReadiness.watch(',
              'ArenaFloorFollowerKit.bind(',
          ):
              assert marker in client, marker
          assert 'for _, child in ipairs(container:GetChildren()) do' in ready
          assert 'four first-step landings' in contract
          assert '"tests/engine/visual-budget-rules.spec.luau"' in cloud
          # No fabricated route, collision, remote, or extra render loop.
          # Check executable subscriptions; an existing explanatory
          # comment can mention RenderStepped without creating a loop.
          assert 'RenderStepped:Connect(' not in client
          assert 'Heartbeat:Connect(' not in client
          assert 'BindToRenderStep(' not in client
          assert 'CollectionService:GetInstanceAddedSignal' in client
          print("Four server-tagged REAL physical entrances. Late mobile"
                " PerimeterRoute/Step metadata rehydrates genuine floor arrows,"
                " and server collapse/visibility disables fake guidance"
                " immediately. No new gameplay paths or publish.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-real-perimeter-entries-qa-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
