# Exact-SHA, one-time cinematic visual milestone. Never publish Roblox.
name: One-time QA 2026-11-05 Fixed Cinematic Depth Five Worlds No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-fixed-cinematic-depth-no-publish.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: chaos-cinematic-depth-five-world-20261105
  cancel-in-progress: false
jobs:
  validate-exact-sha:
    if: github.repository == 'dbrckk/chaos-survival-roblox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Check immutable cinematic source identities and real-engine test registration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rules=Path("src/shared/CinematicDepthLayoutRules.lua").read_text()
          client=Path("src/client/arena-cinematic-depth.client.lua").read_text()
          test=Path("tests/engine/cinematic-depth-layout.spec.luau").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          assert 'Low={1,3,5,7,10}' in rules
          assert 'Medium={1,2,3,5,6,7,9,10}' in rules
          assert 'Medium={1,2,4,5,6,8,9,11,12,13}' in rules
          assert 'Medium={1,3,5}' in rules and 'Medium={1,3}' in rules
          assert '((index-1)/info.total)*math.pi*2+info.offset' in rules
          for group in ('Horizon','OrbitalHalo','Beacon','Traffic'):
              assert 'CinematicDepthLayoutRules.angle("'+group+'", i)' in client
          assert 'CinematicDepthLayoutRules.indices("Horizon", tier.Name)' in client
          assert 'CinematicDepthLayoutRules.indices("Beacon", tier.Name)' in client
          assert 'CinematicDepthLayoutRules.indices("Traffic", tier.Name)' in client
          assert '"OrbitalHalo", tier.Name' in client
          assert '"tests/engine/cinematic-depth-layout.spec.luau"' in cloud
          assert '78 engine specs assigned exactly once' in Path("README.md").read_text()
          assert 'immutable cinematic skyline ring layouts' in test
          assert 'expect(#low).toBe(budget[1])' in test
          assert 'RenderStepped:Connect(' not in rules
          assert 'Instance.new(' not in rules
          print("Five authentic world backdrops preserve all cinematic"
                " tier counts and source positions; engine test included."
                " No publication.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-fixed-cinematic-depth-five-world-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
