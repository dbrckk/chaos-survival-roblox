# Genuine owner-approved Classic and Crossroads native-midground replacements.
# One-time main-SHA milestone. Never publish.
name: One-time QA 2026-11-04 Authentic Classic Crossroads Midground 3D No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261104-midground-3d-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-classic-crossroads-approved-midground-qa-20261104
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Audit real approved source, native fallback and Android residency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          kit=Path("src/client/ApprovedMidgroundSkylineMeshKit.lua").read_text()
          mid=Path("src/client/arena-midground-mass.client.lua").read_text()
          sampler=Path("src/client/scenery-lod.client.lua").read_text()
          budget=Path("src/shared/VisualBudgetRules.lua").read_text()
          loader=Path("src/server/PremiumDistrictFacadeAssets.lua").read_text()
          init=Path("src/server/init.server.lua").read_text()
          docs=Path("docs/APPROVED_MIDGROUND_SKYLINE_REPLACEMENT_2026-11-04.md").read_text()
          registry=json.loads(Path("assets/source/roblox-asset-registry.json").read_text())
          sourceids={"Observatory":132020956214241,
              "Freight":88725004643299,"Turbine":84217436280282,
              "Aerial":135791763112202}
          registered={int(x["asset_id"]) for x in registry["models"]
              if x["moderation"]=="Approved"}
          assert len(registry["models"])==62 and len(registered)==62
          for name, asset in sourceids.items():
              assert str(asset) in loader and str(asset) in kit
              assert str(asset) in docs and asset in registered
              assert name in loader and name in kit
          assert "PremiumDistrictFacadeAssets.start" in init
          assert "ApprovedDistrictFacadeTemplates" in kit
          assert 'source:GetAttribute("Original3DAssetId") ~= SOURCE_IDS[name]' in kit
          assert 'source:GetAttribute("OwnerVerified")' in kit
          assert 'source:GetAttribute("DistrictFacade3D")' in kit
          assert 'part:IsA("LuaSourceContainer")' in kit
          assert "part.CanCollide" in kit and "part.CanTouch" in kit
          assert "part.CanQuery" in kit
          assert "outsideX" in kit and "outsideZ" in kit
          assert "outsideZ) >= 18" in kit
          assert "clone:ScaleTo(scale)" in kit
          assert "part:IsDescendantOf(entry.model)" in kit
          assert "OriginalMidgroundSkylineIndex" in kit
          assert "OriginalMidgroundSkylineVariant" in kit
          assert 'markMidgroundParts(before, "Classic", i)' in mid
          assert 'markMidgroundParts(before, "Crossroads", i)' in mid
          assert "OriginalMidgroundSkylineLocal" in budget
          assert "ApprovedMidgroundSkylineMeshKit.sync(arena,cameraPoint" in sampler
          assert "LocalOriginalMidgroundSkylineCount" in sampler
          assert "LocalOriginalMidgroundNativeReplaced" in sampler
          assert "cap = stress == 0 and 1 or 0" in kit
          assert "cap = stress == 0 and 2 or (stress == 1 and 1 or 0)" in kit
          assert "cap = stress == 0 and 4 or (stress == 1 and 2 or 0)" in kit
          assert "part.CanCollide = false" in kit
          assert "part.CanTouch = false" in kit
          assert "part.CanQuery = false" in kit
          assert "native.Transparency = original" in kit
          assert "native.Transparency = 1" in kit
          assert "RunService" not in kit and "LoadAssetAsync" not in kit
          assert "task.spawn(" not in kit and "task.wait(" not in kit
          print("Approved four-profile Classic/Crossroads outboard true 3D + safe native restoration + Android 1/2/4. NO PUBLISH.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-classic-crossroads-source-only",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
