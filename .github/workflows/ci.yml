name: Build Validation

# Release-gate repair: exercise the ACTUAL full build on PRs that edit this
# workflow, the real 3D district census or its budget-security gate.
# Ordinary feature changes still do NOT trigger expensive Roblox suites.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - tests/engine/visual-budget-rules.spec.luau
      - tests/engine/native-premium-fallback.spec.luau
      - src/shared/DistrictVisualCensusRules.lua
      - tools/verify_original_3d_budget_census.py
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - tests/engine/visual-budget-rules.spec.luau
      - tests/engine/native-premium-fallback.spec.luau
      - src/shared/DistrictVisualCensusRules.lua
      - tools/verify_original_3d_budget_census.py

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Complete source/architecture/security/build checks; run only as
  # an explicitly requested milestone, not for each feature branch.
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # A build is NOT release-ready if the real Roblox Cloud runner
      # cannot package one of its 88 source specs. Check the identical
      # composer and per-file 105-KiB limit before reporting green CI.
      - name: Validate all real Roblox Cloud test bundles fit source limits
        run: |
          python3 tools/prepare_cloud_batches.py --self-test
          python3 tools/prepare_cloud_batches.py

      - name: Validate original MeshPart source exports (no Roblox uploads)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mesh-previews
          # Approved and source-gated full-size original 18x18 hub hull.
          python3 tools/generate_original_large_deck_support.py \
            --model large_deck_hull --output assets/source/chaos_large_deck_hull.obj \
            > build/mesh-previews/chaos_large_deck_hull-source.json
          python3 tools/obj_to_gltf.py \
            --source assets/source/chaos_large_deck_hull.obj \
            --materials assets/source/chaos_route_kit.mtl \
            --output build/mesh-previews/chaos_large_deck_hull.gltf
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/mesh-previews")
          source=json.loads((root/"chaos_large_deck_hull-source.json").read_text())
          gltf=json.loads((root/"chaos_large_deck_hull.gltf").read_text())
          assert source["asset"]=="large_deck_hull"
          assert 350<=source["triangles"]<=6200
          assert 20<=source["groups"]<=160
          x,y,z=source["dimensions"]
          assert 16.6<=x<=18 and 2.4<=y<=4 and 16.6<=z<=18
          assert len(gltf["meshes"][0]["primitives"])==7
          assert {m["name"] for m in gltf["materials"]}=={
              "ARMOR","BRUSHED","CARBON","GRIP","ALLOY","CERAMIC","SIGNAL"}
          total=0
          for prim in gltf["meshes"][0]["primitives"]:
              attrs=prim["attributes"]
              assert {"POSITION","NORMAL","TEXCOORD_0","TANGENT"}<=set(attrs)
              total+=gltf["accessors"][attrs["POSITION"]]["count"]//3
          assert total==source["triangles"]
          PY
          # Six newly Approved creator-owned tall structural supports and
          # under-bridge cradles. Verify the executable source each milestone.
          for kind in column_classic column_towers column_crossroads column_orbital column_harbor long_route_cradle; do
            python3 tools/generate_original_large_supports.py \
              --model "$kind" --output "assets/source/chaos_${kind}.obj" \
              > "build/mesh-previews/chaos_${kind}-source.json"
            python3 tools/obj_to_gltf.py \
              --source "assets/source/chaos_${kind}.obj" \
              --materials assets/source/chaos_route_kit.mtl \
              --output "build/mesh-previews/chaos_${kind}.gltf"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for kind in ("column_classic","column_towers","column_crossroads",
                       "column_orbital","column_harbor","long_route_cradle"):
              stem=Path("build/mesh-previews/chaos_"+kind)
              meta=json.loads(Path(str(stem)+"-source.json").read_text())
              document=json.loads(Path(str(stem)+".gltf").read_text())
              assert meta["asset"]==kind
              assert 380<=meta["triangles"]<=5500
              assert 19<=meta["groups"]<=150
              assert {m["name"] for m in document["materials"]}=={
                  "ARMOR","BRUSHED","CARBON","GRIP","ALLOY","CERAMIC","SIGNAL"}
              prims=document["meshes"][0]["primitives"]
              assert len(prims)==7
              n=0
              for prim in prims:
                  attrs=prim["attributes"]
                  assert {"POSITION","NORMAL","TEXCOORD_0","TANGENT"}<=set(attrs)
                  n+=document["accessors"][attrs["POSITION"]]["count"]//3
              assert n==meta["triangles"]
              x,y,z=meta["dimensions"]
              if kind=="long_route_cradle":
                  assert 21.5<=x<=23 and 2<=y<=4 and 9.4<=z<=10.5
              else:
                  assert 1.7<=x<=2.4 and 13.6<=y<=14.5 and 1.6<=z<=2.4
          PY
          # Six new moderated original platform/skybridge models. Rebuild
          # their actual OBJ and embedded glTF at every release milestone;
          # a registry ID alone does not prove real UV/tangent geometry.
          for kind in deck_carapace_classic deck_carapace_towers deck_carapace_crossroads deck_carapace_orbital deck_carapace_harbor bridge_side_girder; do
            python3 tools/generate_original_platform_carapaces.py \
              --model "$kind" --output "assets/source/chaos_${kind}.obj" \
              > "build/mesh-previews/chaos_${kind}-source.json"
            python3 tools/obj_to_gltf.py \
              --source "assets/source/chaos_${kind}.obj" \
              --materials assets/source/chaos_route_kit.mtl \
              --output "build/mesh-previews/chaos_${kind}.gltf"
          done
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          kinds = ("deck_carapace_classic", "deck_carapace_towers",
                   "deck_carapace_crossroads", "deck_carapace_orbital",
                   "deck_carapace_harbor", "bridge_side_girder")
          for kind in kinds:
              base=Path("build/mesh-previews/chaos_" + kind)
              desc=json.loads(Path(str(base)+"-source.json").read_text())
              gltf=json.loads(Path(str(base)+".gltf").read_text())
              assert desc["asset"] == kind
              assert 350 <= desc["triangles"] <= 5000
              assert 18 <= desc["groups"] <= 145
              assert gltf["asset"]["version"] == "2.0"
              assert {m["name"] for m in gltf["materials"]} == {
                  "ARMOR","BRUSHED","CARBON","GRIP","ALLOY","CERAMIC","SIGNAL"}
              segments=gltf["meshes"][0]["primitives"]
              assert len(segments)==7
              total=0
              for segment in segments:
                  attrs=segment["attributes"]
                  assert {"POSITION","NORMAL","TEXCOORD_0","TANGENT"} <= set(attrs)
                  total+=gltf["accessors"][attrs["POSITION"]]["count"]//3
              assert total==desc["triangles"]
              blob=gltf["buffers"][0]
              raw=base64.b64decode(blob["uri"].split(",",1)[1],validate=True)
              assert len(raw)==blob["byteLength"]
              x,y,z=desc["dimensions"]
              if kind=="bridge_side_girder":
                  assert 9.3<=x<=10.6 and 1.3<=y<=2.3 and .5<=z<=1.3
              else:
                  assert 10.8<=x<=12 and 2.1<=y<=3.5 and 8.1<=z<=9.1
              print("Original noncolliding platform structure:",kind,total,
                    "triangles, 7 authentic material MeshParts")
          PY
          # Six genuine source-authored 14-stud columns/22-stud open-lattice
          # foundations. Validate self-contained glTF, geometric bounds,
          # normals, UV/tangent and SEVEN distinct mesh/material groups.
          for kind in column_classic column_towers column_crossroads column_orbital column_harbor long_route_cradle; do
            python3 tools/generate_original_large_supports.py \
              --model "$kind" --output "assets/source/chaos_${kind}.obj" \
              > "build/mesh-previews/chaos_${kind}-source.json"
            python3 tools/obj_to_gltf.py \
              --source "assets/source/chaos_${kind}.obj" \
              --materials assets/source/chaos_route_kit.mtl \
              --output "build/mesh-previews/chaos_${kind}.gltf"
          done
          python3 - <<'PY'
          import json,base64
          from pathlib import Path
          kinds=("column_classic","column_towers","column_crossroads",
                 "column_orbital","column_harbor","long_route_cradle")
          for kind in kinds:
              base=Path("build/mesh-previews/chaos_"+kind)
              desc=json.loads(Path(str(base)+"-source.json").read_text())
              gltf=json.loads(Path(str(base)+".gltf").read_text())
              assert desc["asset"]==kind
              assert 380<=desc["triangles"]<=5500
              assert 19<=desc["groups"]<=150
              assert {m["name"] for m in gltf["materials"]}=={
                  "ARMOR","BRUSHED","CARBON","GRIP","ALLOY","CERAMIC","SIGNAL"}
              prims=gltf["meshes"][0]["primitives"]
              assert len(prims)==7
              tris=0
              for part in prims:
                  attrs=part["attributes"]
                  assert {"POSITION","NORMAL","TEXCOORD_0","TANGENT"}<=set(attrs)
                  tris+=gltf["accessors"][attrs["POSITION"]]["count"]//3
              assert tris==desc["triangles"]
              buf=gltf["buffers"][0]
              raw=base64.b64decode(buf["uri"].split(",",1)[1],validate=True)
              assert len(raw)==buf["byteLength"]
              x,y,z=desc["dimensions"]
              if kind=="long_route_cradle":
                  assert 21.5<=x<=23 and 2<=y<=4 and 9.4<=z<=10.5
              else:
                  assert 1.7<=x<=2.4 and 13.6<=y<=14.5 and 1.6<=z<=2.4
              print("Genuine original 3D tall support:",kind,tris,"triangles")
          PY
          python3 tools/generate_premium_ground_tile.py --output assets/source/chaos_premium_ground_tile.obj
          python3 tools/generate_district_profile_meshes.py --output-dir assets/source
          python3 tools/generate_original_skyfleet_carrier.py --output assets/source/chaos_skyfleet_carrier.obj
          # Roblox creator-approved original 1,696-triangle Sky Spine crown:
          # existing source-run #41660854748 returned moderation Approved.
          python3 tools/generate_original_sky_spine_crown.py --output assets/source/chaos_sky_spine_crown.obj
          # Verified source of Roblox owner-approved Model 84582262145054,
          # approval receipt #41644715829. Independently revalidate
          # authored triangles, UV/tangents and 7-source PBR material groups.
          python3 tools/generate_original_underdeck_chassis.py --output assets/source/chaos_underdeck_chassis.obj
          python3 tools/obj_to_gltf.py \
            --source assets/source/chaos_underdeck_chassis.obj \
            --materials assets/source/chaos_route_kit.mtl \
            --output build/mesh-previews/chaos_underdeck_chassis.gltf
          python3 - <<'PY'
          import json, base64
          from pathlib import Path
          doc = json.loads(Path("build/mesh-previews/chaos_underdeck_chassis.gltf").read_text())
          assert doc["asset"]["version"] == "2.0"
          assert {v["name"] for v in doc["materials"]} == {
              "ARMOR", "BRUSHED", "CARBON", "GRIP", "ALLOY", "CERAMIC", "SIGNAL"
          }
          primitives = doc["meshes"][0]["primitives"]
          assert len(primitives) == 7
          triangles = sum(
              doc["accessors"][p["attributes"]["POSITION"]]["count"] // 3
              for p in primitives
          )
          assert 1400 <= triangles <= 8500, triangles
          assert all({"POSITION", "NORMAL", "TEXCOORD_0", "TANGENT"}
                     <= set(p["attributes"]) for p in primitives)
          buf = doc["buffers"][0]
          binary = base64.b64decode(buf["uri"].split(",",1)[1], validate=True)
          assert len(binary) == buf["byteLength"] and len(binary) > 1000
          print(f"Staged original underdeck OBJ→glTF passed: {triangles} real triangles, 7 material families.")
          PY
          # Work-in-progress, ORIGINAL sculpted arena keel: source validation
          # ONLY. Never claim Roblox approval or load a fabricated asset ID.
          python3 tools/generate_original_arena_keel.py \
            --output assets/source/chaos_arena_keel.obj > build/mesh-previews/arena-keel-source.json
          python3 tools/obj_to_gltf.py \
            --source assets/source/chaos_arena_keel.obj \
            --materials assets/source/chaos_route_kit.mtl \
            --output build/mesh-previews/chaos_arena_keel.gltf
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          summary = json.loads(Path("build/mesh-previews/arena-keel-source.json").read_text())
          assert summary["asset"] == "arena_keel"
          assert 1800 <= summary["triangles"] <= 8000
          assert summary["bounds_max"][1] <= -0.48
          assert all(0 < n < 65 for n in summary["dimensions"])
          art = json.loads(Path("build/mesh-previews/chaos_arena_keel.gltf").read_text())
          assert art["asset"]["version"] == "2.0"
          assert {m["name"] for m in art["materials"]} == {
              "ARMOR", "BRUSHED", "CARBON", "GRIP", "ALLOY", "CERAMIC", "SIGNAL"}
          sections = art["meshes"][0]["primitives"]
          assert len(sections) == 7
          assert sum(art["accessors"][p["attributes"]["POSITION"]]["count"] // 3
                     for p in sections) == summary["triangles"]
          assert all({"POSITION", "NORMAL", "TEXCOORD_0", "TANGENT"}
                     <= set(p["attributes"]) for p in sections)
          payload = base64.b64decode(art["buffers"][0]["uri"].split(",",1)[1], validate=True)
          assert len(payload) == art["buffers"][0]["byteLength"]
          print("Original Arena Keel real 3D source passed geometry, UV, tangent, seven-material and 65-stud safety gates. NO Roblox upload.")
          PY
          for model in reactor_spire service_crane perimeter_gate plasma_foundry sky_transit_exchange orbital_halo_array premium_jump_deck premium_skybridge_module premium_ground_tile district_observatory district_freight district_turbine district_aerial skyfleet_carrier underdeck_chassis sky_spine_crown; do
            palette="assets/source/chaos_industrial_materials.mtl"
            if [ "$model" = "perimeter_gate" ]; then
              palette="assets/source/chaos_perimeter_gate.mtl"
            elif [ "$model" = "premium_jump_deck" ] || [ "$model" = "premium_skybridge_module" ] || [ "$model" = "premium_ground_tile" ] || [[ "$model" == district_* ]] || [ "$model" = "skyfleet_carrier" ] || [ "$model" = "underdeck_chassis" ] || [ "$model" = "sky_spine_crown" ]; then
              palette="assets/source/chaos_route_kit.mtl"
            fi
            python tools/obj_to_gltf.py \
              --source "assets/source/chaos_${model}.obj" \
              --materials "$palette" \
              --output "build/mesh-previews/chaos_${model}.gltf"
          done
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = {"source_commit": os.environ["GITHUB_SHA"],
                      "import_status": "BUILD_ONLY_NO_NEW_ASSET_UPLOAD",
                      "models": []}
          for name in ("reactor_spire", "service_crane", "perimeter_gate",
                       "plasma_foundry", "sky_transit_exchange", "orbital_halo_array",
                       "premium_jump_deck", "premium_skybridge_module",
                       "premium_ground_tile", "district_observatory",
                       "district_freight", "district_turbine", "district_aerial",
                       "skyfleet_carrier", "underdeck_chassis", "sky_spine_crown"):
              gltf = json.loads(Path("build/mesh-previews/chaos_" + name + ".gltf").read_text())
              assert gltf["asset"]["version"] == "2.0"
              buffer = gltf["buffers"][0]
              raw = base64.b64decode(buffer["uri"].split(",", 1)[1], validate=True)
              assert len(raw) == buffer["byteLength"]
              assert all(x["byteOffset"] + x["byteLength"] <= len(raw)
                         for x in gltf["bufferViews"])
              primitives = gltf["meshes"][0]["primitives"]
              assert len(primitives) >= 3
              assert gltf["scenes"][0]["nodes"] == [0]
              assert all(primitive["mode"] == 4 for primitive in primitives)
              required = {"POSITION", "NORMAL", "TEXCOORD_0", "TANGENT"}
              assert all(required <= set(p["attributes"]) for p in primitives)
              assert all(gltf["accessors"][p["attributes"]["POSITION"]]["count"] % 3 == 0
                         for p in primitives)
              for primitive in primitives:
                  attributes = primitive["attributes"]
                  counts = [gltf["accessors"][attributes[key]]["count"]
                            for key in ("POSITION", "NORMAL", "TEXCOORD_0", "TANGENT")]
                  assert len(set(counts)) == 1, "UV/tangent vertex counts must agree"
                  assert gltf["accessors"][attributes["TEXCOORD_0"]]["type"] == "VEC2"
                  assert gltf["accessors"][attributes["TANGENT"]]["type"] == "VEC4"
              expected = {"FRAME", "BRUSHED", "CYAN", "INDIGO"} if name == "perimeter_gate" else None
              if expected:
                  assert {m["name"] for m in gltf["materials"]} == expected
              file = Path("build/mesh-previews/chaos_" + name + ".gltf")
              manifest["models"].append({
                  "name": name,
                  "filename": file.name,
                  "bytes": file.stat().st_size,
                  "sha256": hashlib.sha256(file.read_bytes()).hexdigest(),
                  "triangle_count": sum(gltf["accessors"][p["attributes"]["POSITION"]]["count"] // 3
                                        for p in primitives),
                  "materials": [m["name"] for m in gltf["materials"]],
              })
              print(name, "glTF source generated and validated:", len(raw), "bytes")
          Path("build/mesh-previews/manifest.json").write_text(
              json.dumps(manifest, indent=2) + chr(10), encoding="utf-8"
          )
          PY

      - name: Validate Roblox-approved original asset registry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("assets/source/roblox-asset-registry.json").read_text())
          assert registry["schema_version"] == 1
          assert registry["creator"]["type"] in ("user", "group")
          assert registry["creator"]["id"].isdecimal()
          assert registry["asset_type"] == "Roblox Model package"
          assert registry["publication"]["models_inserted_in_game"] is False
          assert registry["publication"]["android_visual_qa_completed"] is False
          models = registry["models"]
          scenery_names = {
              "reactor_spire", "service_crane", "perimeter_gate",
              "plasma_foundry", "sky_transit_exchange", "orbital_halo_array"
          }
          route_names = {"premium_jump_deck", "premium_skybridge_module", "premium_ground_tile"}
          district_names = {"district_observatory", "district_freight",
                            "district_turbine", "district_aerial",
                            "district_sidewall_shell"}
          skyfleet_names = {"skyfleet_carrier"}
          underdeck_names = {"underdeck_chassis"}
          lobby_gate_names = {"lobby_gate"}
          sky_spine_crown_names = {"sky_spine_crown"}
          arena_keel_names = {"arena_keel"}
          service_names = {
              "service_camera", "service_maintenance", "service_wayfinder",
              "service_orbital", "service_mooring",
          }
          ambient_names = {
              "ambient_drone", "ambient_lift", "ambient_transit",
              "ambient_satellite", "ambient_cargo",
          }
          relief_names = {
              "relief_essential", "relief_classic", "relief_towers",
              "relief_crossroads", "relief_orbital", "relief_harbor",
          }
          floor_hardware_names = {
              "floor_corner_guard", "floor_anchor_bolt_large",
              "floor_harbor_tie",
          }
          platform_side_names = {
              "deck_carapace_classic", "deck_carapace_towers",
              "deck_carapace_crossroads", "deck_carapace_orbital",
              "deck_carapace_harbor", "bridge_side_girder",
          }
          large_hull_names = {"large_deck_hull"}
          rim_names = {"platform_rim_rect", "platform_rim_long"}
          harbor_original_names = {
              "harbor_promenade_portal", "harbor_dock_caisson",
              "harbor_freighter",
              "harbor_gantry_container", "harbor_gantry_drum",
              "harbor_gantry_kinetic_container", "harbor_gantry_kinetic_drum",
              "harbor_hero_station", "harbor_midground_barge",
              "harbor_sea_apron", "towers_cooling_spire", "towers_cooling_stack",
          }
          large_support_names = {
              "column_classic", "column_towers", "column_crossroads",
              "column_orbital", "column_harbor", "long_route_cradle",
          }
          # Owner-Approved premium 3D models added after the original 62-source
          # registry milestone. Keep this explicit, never silently trust any
          # unregistered or invented asset ID in production.
          premium_extension_names = {
              "perimeter_rotor", "perimeter_wing", "perimeter_cap",
              "perimeter_crossbrace", "perimeter_generator_shield", "perimeter_towers_apex",
              "perimeter_orbital_apex", "perimeter_crossroads_apex", "perimeter_relay_apex",
              "exterior_tower_21", "exterior_tower_24", "exterior_tower_27",
              "exterior_tower_30", "signature_orbital_reactor_ring", "signature_towers_forged_bridge",
              "signature_crossroads_forged_interchange", "signature_harbor_sculpted_gantry", "signature_classic_sculpted_observatory",
              "signature_classic_forged_supports", "south_orbital_observation_torus", "south_towers_forged_skytransfer",
              "south_towers_forged_lift_twins", "south_towers_forged_finishing", "south_crossroads_forged_exchange",
              "south_orbital_forged_finishing", "south_harbor_sculpted_drydock", "south_classic_sculpted_observatory",
              "exterior_ridges_nw", "exterior_ridges_ne", "exterior_ridges_sw",
              "exterior_ridges_se", "variant_towers_sculpted_machinery", "variant_crossroads_forged_gantry",
              "variant_classic_sculpted_broadcast_fin", "variant_orbital_sculpted_node", "variant_orbital_trussed_strut",
              "variant_crossroads_sculpted_entrance_portal", "variant_classic_grid_marker_sculpt", "variant_towers_spine_sculpt",
              "skyline_depth_sculpt",
              # Five genuine original, Roblox-moderated P0 structure sculptures.
              "ascension_access_arch", "ascension_transfer_arch",
              "ascension_summit_arch", "architectural_column_casing",
              "orbital_helix_underframe",
          }
          assert len(premium_extension_names) == 45
          assert len(models) == 110
          rim_ids = {"platform_rim_rect": "131482590870627",
                     "platform_rim_long": "127617571835277"}
          assert {m["name"]: m["asset_id"] for m in models
                  if m["name"] in rim_ids} == rim_ids
          assert all(m["moderation"] == "Approved" and
                     m.get("workflow_run_id") == 43499366621
                     for m in models if m["name"] in rim_ids)
          assert {m["name"] for m in models} == (
              scenery_names | route_names | district_names
              | skyfleet_names | underdeck_names | lobby_gate_names
              | sky_spine_crown_names | arena_keel_names | service_names
              | ambient_names | relief_names | floor_hardware_names
              | platform_side_names | large_hull_names | rim_names
              | large_support_names
              | harbor_original_names | premium_extension_names)
          ids = [m["asset_id"] for m in models]
          assert len(set(ids)) == len(ids)
          for model in models:
              assert model["asset_id"].isdecimal() and int(model["asset_id"]) > 0
              assert model["moderation"] == "Approved"
              assert isinstance(model["workflow_run_id"], int)
              assert model["workflow_run_id"] > 0
              for attr in ("source", "source_materials"):
                  path = Path(model[attr])
                  if attr == "source" and model["name"] in (
                      "lobby_gate", "sky_spine_crown", "arena_keel",
                      "service_camera", "service_maintenance", "service_wayfinder",
                      "service_orbital", "service_mooring",
                      "ambient_drone", "ambient_lift", "ambient_transit",
