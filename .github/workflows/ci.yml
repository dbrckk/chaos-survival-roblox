          worlds = ("Classic", "Towers", "Crossroads", "Orbital", "Harbor")
          art = {}
          for index, world in enumerate(worlds):
              start = script.index("    " + world + " = {", script.index("local MOODS = {"))
              end = script.find("\n    },", start)
              assert end > start
              body = script[start:end]
              def number(field):
                  match = re.search(r"^        " + field + r" = ([0-9.]+),", body, re.M)
                  assert match, (world,field)
                  return float(match.group(1))
              time = number("ClockTime")
              latitude = number("Latitude")
              density = number("Density")
              diffuse = number("EnvironmentDiffuse")
              specular = number("EnvironmentSpecular")
              assert 10 <= time < 17 and 20 <= latitude <= 80
              assert 0.10 <= density <= 0.20
              assert 0.35 <= diffuse <= 0.55
              assert 0.6 <= specular <= 0.80
              art[world] = (time,latitude)
          assert len(set(art.values())) == 5
          assert "GeographicLatitude = mood.Latitude or 36" in script
          # Original phase-only short circuit rejected real Darkness
          # transitions (including disaster slot 2) within an active
          # round. It is now a double-key guard: no spurious 1s timer
          # tweens, but immediate optical correction when hazards change.
          assert "if nextPhase == phase and nextDarkness == darknessActive then return end" in script
          assert "ArenaLightingReadabilityRules.hasDarkness(state.disasterIds)" in script
          assert "elseif UserInputService.TouchEnabled and not darknessActive then" in script
          assert "LocalIdentityDarknessFillSuppressed = darknessActive" in script
          assert "disasterOwnsEnvironment = phase == \"round\" or phase == \"ready\"" in script
          assert "disasterOwnsPostProcess = disasterOwnsEnvironment" in script
          assert "PbrDistrictRules" in pbr
          assert "return touch and 32 or 48" in pbr
          assert "return touch and 72 or 144" in pbr
          assert "return 0" in pbr
          assert "if tierName == \"Low\" then" in focals
          assert "return 3" in focals
          assert "local neutral = Color3.fromRGB(" in focal_source
          for world in worlds:
              block = theme.split("    " + world + " = {", 1)[1].split("\n    },", 1)[0]
