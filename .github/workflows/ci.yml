      - name: Guard authentic five-arena sun and native-PBR art budget
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          script = Path("src/client/arena-lighting.client.lua").read_text()
          theme = Path("src/shared/VisualTheme.lua").read_text()
          focals = Path("src/shared/ArenaFocalLightingRules.lua").read_text()
