name: Build Validation

# Owner-directed validation policy: no tests at all during feature work.
# Dispatch only once a merged release candidate is ready to publish.
on:
  workflow_dispatch:

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Complete source/architecture/security/build checks; run only as
  # an explicitly requested milestone, not for each feature branch.
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate original MeshPart source exports (no Roblox uploads)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mesh-previews
          python3 tools/generate_premium_ground_tile.py --output assets/source/chaos_premium_ground_tile.obj
          python3 tools/generate_district_profile_meshes.py --output-dir assets/source
          python3 tools/generate_original_skyfleet_carrier.py --output assets/source/chaos_skyfleet_carrier.obj
          # Roblox creator-approved original 1,696-triangle Sky Spine crown:
          # existing source-run #41660854748 returned moderation Approved.
          python3 tools/generate_original_sky_spine_crown.py --output assets/source/chaos_sky_spine_crown.obj
          # Verified source of Roblox owner-approved Model 84582262145054,
          # approval receipt #41644715829. Independently revalidate
          # authored triangles, UV/tangents and 7-source PBR material groups.
          python3 tools/generate_original_underdeck_chassis.py --output assets/source/chaos_underdeck_chassis.obj
          python3 tools/obj_to_gltf.py \
            --source assets/source/chaos_underdeck_chassis.obj \
            --materials assets/source/chaos_route_kit.mtl \
            --output build/mesh-previews/chaos_underdeck_chassis.gltf
          python3 - <<'PY'
          import json, base64
          from pathlib import Path
          doc = json.loads(Path("build/mesh-previews/chaos_underdeck_chassis.gltf").read_text())
          assert doc["asset"]["version"] == "2.0"
          assert {v["name"] for v in doc["materials"]} == {
              "ARMOR", "BRUSHED", "CARBON", "GRIP", "ALLOY", "CERAMIC", "SIGNAL"
          }
          primitives = doc["meshes"][0]["primitives"]
          assert len(primitives) == 7
          triangles = sum(
              doc["accessors"][p["attributes"]["POSITION"]]["count"] // 3
              for p in primitives
          )
          assert 1400 <= triangles <= 8500, triangles
          assert all({"POSITION", "NORMAL", "TEXCOORD_0", "TANGENT"}
                     <= set(p["attributes"]) for p in primitives)
          buf = doc["buffers"][0]
          binary = base64.b64decode(buf["uri"].split(",",1)[1], validate=True)
          assert len(binary) == buf["byteLength"] and len(binary) > 1000
          print(f"Staged original underdeck OBJ→glTF passed: {triangles} real triangles, 7 material families.")
          PY
          # Work-in-progress, ORIGINAL sculpted arena keel: source validation
          # ONLY. Never claim Roblox approval or load a fabricated asset ID.
          python3 tools/generate_original_arena_keel.py \
            --output assets/source/chaos_arena_keel.obj > build/mesh-previews/arena-keel-source.json
          python3 tools/obj_to_gltf.py \
            --source assets/source/chaos_arena_keel.obj \
            --materials assets/source/chaos_route_kit.mtl \
            --output build/mesh-previews/chaos_arena_keel.gltf
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          summary = json.loads(Path("build/mesh-previews/arena-keel-source.json").read_text())
          assert summary["asset"] == "arena_keel"
          assert 1800 <= summary["triangles"] <= 8000
          assert summary["bounds_max"][1] <= -0.48
          assert all(0 < n < 65 for n in summary["dimensions"])
          art = json.loads(Path("build/mesh-previews/chaos_arena_keel.gltf").read_text())
          assert art["asset"]["version"] == "2.0"
          assert {m["name"] for m in art["materials"]} == {
              "ARMOR", "BRUSHED", "CARBON", "GRIP", "ALLOY", "CERAMIC", "SIGNAL"}
          sections = art["meshes"][0]["primitives"]
          assert len(sections) == 7
          assert sum(art["accessors"][p["attributes"]["POSITION"]]["count"] // 3
                     for p in sections) == summary["triangles"]
          assert all({"POSITION", "NORMAL", "TEXCOORD_0", "TANGENT"}
                     <= set(p["attributes"]) for p in sections)
          payload = base64.b64decode(art["buffers"][0]["uri"].split(",",1)[1], validate=True)
          assert len(payload) == art["buffers"][0]["byteLength"]
          print("Original Arena Keel real 3D source passed geometry, UV, tangent, seven-material and 65-stud safety gates. NO Roblox upload.")
          PY
          for model in reactor_spire service_crane perimeter_gate plasma_foundry sky_transit_exchange orbital_halo_array premium_jump_deck premium_skybridge_module premium_ground_tile district_observatory district_freight district_turbine district_aerial skyfleet_carrier underdeck_chassis sky_spine_crown; do
            palette="assets/source/chaos_industrial_materials.mtl"
            if [ "$model" = "perimeter_gate" ]; then
              palette="assets/source/chaos_perimeter_gate.mtl"
            elif [ "$model" = "premium_jump_deck" ] || [ "$model" = "premium_skybridge_module" ] || [ "$model" = "premium_ground_tile" ] || [[ "$model" == district_* ]] || [ "$model" = "skyfleet_carrier" ] || [ "$model" = "underdeck_chassis" ] || [ "$model" = "sky_spine_crown" ]; then
              palette="assets/source/chaos_route_kit.mtl"
            fi
            python tools/obj_to_gltf.py \
              --source "assets/source/chaos_${model}.obj" \
              --materials "$palette" \
              --output "build/mesh-previews/chaos_${model}.gltf"
          done
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = {"source_commit": os.environ["GITHUB_SHA"],
                      "import_status": "BUILD_ONLY_NO_NEW_ASSET_UPLOAD",
                      "models": []}
          for name in ("reactor_spire", "service_crane", "perimeter_gate",
                       "plasma_foundry", "sky_transit_exchange", "orbital_halo_array",
                       "premium_jump_deck", "premium_skybridge_module",
                       "premium_ground_tile", "district_observatory",
                       "district_freight", "district_turbine", "district_aerial",
                       "skyfleet_carrier", "underdeck_chassis", "sky_spine_crown"):
              gltf = json.loads(Path("build/mesh-previews/chaos_" + name + ".gltf").read_text())
              assert gltf["asset"]["version"] == "2.0"
              buffer = gltf["buffers"][0]
              raw = base64.b64decode(buffer["uri"].split(",", 1)[1], validate=True)
              assert len(raw) == buffer["byteLength"]
              assert all(x["byteOffset"] + x["byteLength"] <= len(raw)
                         for x in gltf["bufferViews"])
              primitives = gltf["meshes"][0]["primitives"]
              assert len(primitives) >= 3
              assert gltf["scenes"][0]["nodes"] == [0]
              assert all(primitive["mode"] == 4 for primitive in primitives)
              required = {"POSITION", "NORMAL", "TEXCOORD_0", "TANGENT"}
              assert all(required <= set(p["attributes"]) for p in primitives)
              assert all(gltf["accessors"][p["attributes"]["POSITION"]]["count"] % 3 == 0
                         for p in primitives)
              for primitive in primitives:
                  attributes = primitive["attributes"]
                  counts = [gltf["accessors"][attributes[key]]["count"]
                            for key in ("POSITION", "NORMAL", "TEXCOORD_0", "TANGENT")]
                  assert len(set(counts)) == 1, "UV/tangent vertex counts must agree"
                  assert gltf["accessors"][attributes["TEXCOORD_0"]]["type"] == "VEC2"
                  assert gltf["accessors"][attributes["TANGENT"]]["type"] == "VEC4"
              expected = {"FRAME", "BRUSHED", "CYAN", "INDIGO"} if name == "perimeter_gate" else None
              if expected:
                  assert {m["name"] for m in gltf["materials"]} == expected
              file = Path("build/mesh-previews/chaos_" + name + ".gltf")
              manifest["models"].append({
                  "name": name,
                  "filename": file.name,
                  "bytes": file.stat().st_size,
                  "sha256": hashlib.sha256(file.read_bytes()).hexdigest(),
                  "triangle_count": sum(gltf["accessors"][p["attributes"]["POSITION"]]["count"] // 3
                                        for p in primitives),
                  "materials": [m["name"] for m in gltf["materials"]],
              })
              print(name, "glTF source generated and validated:", len(raw), "bytes")
          Path("build/mesh-previews/manifest.json").write_text(
              json.dumps(manifest, indent=2) + chr(10), encoding="utf-8"
          )
          PY

      - name: Validate Roblox-approved original asset registry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("assets/source/roblox-asset-registry.json").read_text())
          assert registry["schema_version"] == 1
          assert registry["creator"]["type"] in ("user", "group")
          assert registry["creator"]["id"].isdecimal()
          assert registry["asset_type"] == "Roblox Model package"
          assert registry["publication"]["models_inserted_in_game"] is False
          assert registry["publication"]["android_visual_qa_completed"] is False
          models = registry["models"]
          scenery_names = {
              "reactor_spire", "service_crane", "perimeter_gate",
              "plasma_foundry", "sky_transit_exchange", "orbital_halo_array"
          }
          route_names = {"premium_jump_deck", "premium_skybridge_module", "premium_ground_tile"}
          district_names = {"district_observatory", "district_freight",
                            "district_turbine", "district_aerial"}
          skyfleet_names = {"skyfleet_carrier"}
          underdeck_names = {"underdeck_chassis"}
          lobby_gate_names = {"lobby_gate"}
          sky_spine_crown_names = {"sky_spine_crown"}
          assert {m["name"] for m in models} == (
              scenery_names | route_names | district_names
              | skyfleet_names | underdeck_names | lobby_gate_names
              | sky_spine_crown_names)
          ids = [m["asset_id"] for m in models]
          assert len(set(ids)) == len(ids)
          for model in models:
              assert model["asset_id"].isdecimal() and int(model["asset_id"]) > 0
              assert model["moderation"] == "Approved"
              assert isinstance(model["workflow_run_id"], int)
              assert model["workflow_run_id"] > 0
              for attr in ("source", "source_materials"):
                  path = Path(model[attr])
                  if attr == "source" and model["name"] in (
                      "lobby_gate", "sky_spine_crown"):
                      # Reproducible 3D authoring scripts generate the real
                      # approved OBJ before the verified Roblox owner upload.
                      origin = {
                          "lobby_gate": "tools/generate_original_lobby_gate.py",
                          "sky_spine_crown": "tools/generate_original_sky_spine_crown.py",
                      }[model["name"]]
                      assert path == Path(origin) and path.is_file()
                  else:
                      assert path.is_file() and path.is_relative_to("assets/source")
          # The runtime must use real approved MODEL package IDs from
          # the registry, never fabricated MeshPart IDs or unrelated assets.
          import re
          source = Path("src/server/OriginalMeshScenery.lua").read_text()
          block = re.search(r"local ASSETS = \{(.*?)\n\}", source, re.S)
          assert block, "Owned scenery asset table missing"
          deployed_ids = dict(re.findall(
              r"(reactor_spire|service_crane|perimeter_gate|plasma_foundry|sky_transit_exchange|orbital_halo_array)\s*=\s*(\d+)",
              block.group(1),
          ))
          assert deployed_ids == {
              m["name"]: m["asset_id"] for m in models
              if m["name"] in scenery_names
          }, "Original skyline 3D IDs diverged from approved registry"
          route_source = Path("src/server/PremiumRouteMeshAssets.lua").read_text()
          route_block = re.search(r"local APPROVED = \{(.*?)\n\}", route_source, re.S)
          assert route_block, "Missing real original jump/skybridge asset allowlist"
          route_ids = dict(re.findall(
              r"(PremiumJumpDeck|PremiumSkybridgeModule|PremiumGroundTile|OriginalUnderdeckChassis|OriginalSkySpineCrown)\s*=\s*(\d+)",
              route_block.group(1),
          ))
          approved = {m["name"]: m["asset_id"] for m in models}
          assert route_ids == {
              "PremiumJumpDeck": approved["premium_jump_deck"],
              "PremiumSkybridgeModule": approved["premium_skybridge_module"],
              "PremiumGroundTile": approved["premium_ground_tile"],
              "OriginalUnderdeckChassis": approved["underdeck_chassis"],
              "OriginalSkySpineCrown": approved["sky_spine_crown"],
          }, "Approved production 3D route IDs do not match runtime allowlist"
          facade_source = Path("src/server/PremiumDistrictFacadeAssets.lua").read_text()
          facade_block = re.search(r"local APPROVED = \{(.*?)\n\}", facade_source, re.S)
          assert facade_block, "Original facade package allowlist missing"
          facade_ids = dict(re.findall(
              r"(Observatory|Freight|Turbine|Aerial)\s*=\s*(\d+)",
              facade_block.group(1)))
          assert facade_ids == {
              "Observatory": approved["district_observatory"],
              "Freight": approved["district_freight"],
              "Turbine": approved["district_turbine"],
              "Aerial": approved["district_aerial"],
          }, "Approved source 3D facade IDs diverged from owned Roblox receipts"
          assert "AssetService.LoadAssetAsync" in source
          assert "OriginalMeshScenery.sanitize(imported)" in source
          assert "OriginalMeshScenery.sanitize(raw)" in route_source
          assert "OriginalMeshScenery.sanitize(raw)" in facade_source
          skyfleet_source = Path("src/server/PremiumSkyfleetMeshAssets.lua").read_text()
          asset_match = re.search(r"local ASSET_ID = (\d+)", skyfleet_source)
          assert asset_match, "Original 3D skyfleet owned asset ID constant is missing"
          assert asset_match.group(1) == approved["skyfleet_carrier"], (
              "Original 3D skyfleet live ID diverges from verified Roblox owner record")
          assert "OriginalMeshScenery.sanitize(raw)" in skyfleet_source
          gate_source = Path("src/server/PremiumLobbyGateMeshAssets.lua").read_text()
          gate_client = Path("src/client/lobby-gate-original-3d.client.lua").read_text()
          gate_asset = re.search(r"local ASSET_ID = (\d+)", gate_source)
          assert gate_asset and gate_asset.group(1) == approved["lobby_gate"]
          assert "OriginalMeshScenery.sanitize(raw)" in gate_source
          assert "AssetService.LoadAssetAsync" in gate_source
          assert 'local ASSET_ID = 136009650118642' in gate_client
          assert 'part.CanCollide = false' in gate_client
          assert 'part.CanTouch = false' in gate_client
          assert 'part.CanQuery = false' in gate_client
          assert 'part.CastShadow = false' in gate_client
          assert '"OriginalLobbyGate3DLocal"' in Path(
              "src/shared/VisualBudgetRules.lua").read_text()
          assert next(m["workflow_run_id"] for m in models
                      if m["name"] == "lobby_gate") == 41648061984
          assert approved["underdeck_chassis"] == "84582262145054"
          assert next(
              m["workflow_run_id"] for m in models
              if m["name"] == "underdeck_chassis"
          ) == 41644715829
          client = Path("src/client/PremiumRouteMeshKit.lua").read_text()
          assert "OriginalUnderdeckChassis = 84582262145054" in client
          assert "OriginalUnderdeckArt" in client
          assert "function PremiumRouteMeshKit.underdeckCount()" in client
          assert "underdecks = 0" in client and "underdecks = 2" in client
          assert "underdecks = 4" in client
          assert "part.CanCollide = false" in client
          assert "part.CanQuery = false" in client
          assert "part.CanTouch = false" in client
          assert "OriginalUnderdeckSafeCosmeticWeld" in client
          assert "base.Size.X < 318 or base.Size.Z < 318" in client
          census = Path("src/shared/VisualBudgetRules.lua").read_text()
          assert '"PremiumRouteMeshLocal"' in census
          assert "LocalOriginalUnderdeckMeshCount" in Path(
              "src/client/scenery-lod.client.lua").read_text()
          crown = Path("src/client/SkySpineCrownMeshKit.lua").read_text()
          scenery = Path("src/client/scenery-lod.client.lua").read_text()
          assert approved["sky_spine_crown"] == "71492051540032"
          assert next(m["workflow_run_id"] for m in models
                      if m["name"] == "sky_spine_crown") == 41660854748
          assert "OriginalSkySpineCrown = 71492051540032" in route_source
          assert 'PremiumSkySpineCrown3D' in route_source
          assert 'local ASSET_ID = 71492051540032' in crown
          assert 'SkySpineStep' in crown and 'SkySpineInterchange' in crown
          assert 'ChaosPermanentRoute' in crown
          assert "Low = {count = 1, distance = 122" in crown
          assert "Medium = {count = 1" in crown
          assert "High = {count = 2" in crown
          for safety in ("piece.CanCollide = false", "piece.CanTouch = false",
                         "piece.CanQuery = false", "SkySpineCrownCosmeticWeld",
                         "CollapsePhase", "BridgeShutterPhase",
                         "base.Size.X < 318 or base.Size.Z < 318"):
              assert safety in crown, safety
          assert 'OriginalSkySpineCrownLocal' in census
          assert 'SkySpineCrownMeshKit.sync(arena, cameraPoint' in scenery
          assert 'LocalOriginalSkySpineCrownCount' in scenery
          assert 'model:GetAttribute("PremiumSkySpineCrown3D") ~= true' in crown
          assert 'OriginalSkySpineCrown' in Path(
              "tests/engine/mapbuilder-advanced.spec.luau").read_text()
          # Match the imported Model's own seven-group real source and
          # validate triangles, normals, UV/tangents without faking the
          # on-device artwork's appearance.
          sky_doc = json.loads(Path(
              "build/mesh-previews/chaos_sky_spine_crown.gltf").read_text())
          sky_parts = sky_doc["meshes"][0]["primitives"]
          sky_triangles = sum(
              sky_doc["accessors"][p["attributes"]["POSITION"]]["count"] // 3
              for p in sky_parts)
          assert sky_triangles == 1696 and len(sky_parts) == 7
          assert {m["name"] for m in sky_doc["materials"]} == {
              "ARMOR", "BRUSHED", "CARBON", "GRIP", "ALLOY", "CERAMIC", "SIGNAL"}
          print("Verified 17 genuine owned approved Models, original 1696-triangle Sky Spine sculpture, 1/1/2 Android resident caps, native hazard fallbacks and source asset provenance.")
          PY

      - name: Install Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 90 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -o /tmp/rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -tq /tmp/rojo.zip >/dev/null || {
            echo "::error::Pinned Rojo archive is truncated or invalid."
            exit 1
          }
          mkdir -p /tmp/rojo
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          echo "/tmp/rojo" >> "$GITHUB_PATH"
          /tmp/rojo/rojo --version

      - name: Guard Android first-frame VFX budgets
        shell: bash
        run: python tools/validate_mobile_vfx_first_frame.py

      - name: Validate Luau syntax
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 90 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          unzip -tq /tmp/luau.zip >/dev/null || {
            echo "::error::Pinned Luau compiler archive is truncated or invalid."
            exit 1
          }
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 |
            xargs -0 -n1 /tmp/luau/luau-compile >/dev/null

      - name: Self-test real-engine Cloud task batching
        shell: bash
        run: python tools/prepare_cloud_batches.py --self-test

      - name: Enforce persistent purchase session guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cosmetic = Path("src/server/CosmeticService.lua").read_text()
          monetization = Path("src/server/MonetizationService.lua").read_text()

          def between(source, start, end=None):
              a = source.find(start)
              if a < 0:
                  raise SystemExit(f"Missing guarded section: {start}")
              b = source.find(end, a + len(start)) if end else len(source)
              if end and b < 0:
                  raise SystemExit(f"Missing section terminator: {end}")
              return source[a:b]

          guarded = [
              (
                  "Cosmetic equip",
                  between(
                      cosmetic,
                      "local function equipCosmetic",
                      "local function buyCosmetic",
                  ),
              ),
              (
                  "Cosmetic coin purchase",
                  between(
                      cosmetic,
                      "local function buyCosmetic",
                      "function CosmeticService.grant",
                  ),
              ),
              (
                  "Cosmetic premium grant",
                  between(
                      cosmetic,
                      "function CosmeticService.grant",
                      "function CosmeticService.sync",
                  ),
              ),
              (
                  "Premium purchase prompt",
                  between(
                      monetization,
                      'if action ~= "buy_pass"',
                      "MarketplaceService.PromptGamePassPurchaseFinished",
                  ),
              ),
              (
                  "Premium purchase completion",
                  between(
                      monetization,
                      "MarketplaceService.PromptGamePassPurchaseFinished",
                      "Players.PlayerAdded",
                  ),
              ),
          ]

          failures = []
          for label, section in guarded:
              if "PlayerData.canMutate(player)" not in section:
                  failures.append(label)

          if failures:
              print("Persistent mutation path missing active-session guard:")
              for label in failures:
                  print(" -", label)
              raise SystemExit(1)

          print("Persistent purchase/grant session guards verified.")
          PY

      - name: Enforce fair-play monetization boundary
        shell: bash
        run: |
          test -f src/server/MonetizationService.lua
          grep -q 'CosmeticOnly:true' src/server/MonetizationService.lua
          if grep -Eq 'WalkSpeed|JumpPower|MaxHealth|WinCoins|WinXP|PlayerData\.add|ParticipationCoins|ParticipationXP' src/server/MonetizationService.lua; then
            echo "Paid monetization must never modify gameplay power or progression rewards."
            exit 1
          fi

      - name: Enforce client protocol contracts
        shell: bash
        run: |
          if grep -RFn --include='*.lua' --include='*.luau' 'phase == "results"' src; then
            echo 'Round phase contract is "result", not "results".'
            exit 1
          fi
          if grep -RFn --include='*.lua' --include='*.luau' 'feedback.survivalStreak' src/client; then
            echo 'Round feedback streak key is "streak".'
            exit 1
          fi

      - name: Guard post-win settlement and replay contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path("src/server/init.server.lua").read_text()
          journey = Path("src/shared/RoundJourneyRules.lua").read_text()
          required = {
              "return the played round challenge from the disaster runner":
                  "}, roundChallenge\nend\n\nwhile true do" in server,
              "receive the challenge in round settlement":
                  "balanceMetrics, roundChallenge =\n        runDisasterSet(" in server,
              "validate challenge before paying rewards":
                  'assert(type(roundChallenge) == "table"' in server,
              "stamp the winner receipt with the round number":
                  "roundNumber = roundNumber,\n                coins =" in server,
              "stamp the READY countdown with the upcoming round number":
                  'phase = "ready",\n            roundNumber = upcomingRoundNumber,' in server,
              "restore human health at accepted READY spawn":
                  "SurvivalFeedback.restoreForNextRound(humanoid)" in server,
              "verify actual RESULT to next READY rather than decorative result":
                  "function RoundJourneyRules.replayStarted(" in journey,
          }

          missing = [name for name, present in required.items() if not present]
          if missing:
              raise SystemExit("Post-win protocol regression: " + ", ".join(missing))
          print("Server settlement, reward receipt and replay continuity contracts intact.")
          PY

      - name: Guard real 3D permanent sky-route residency and repaired material contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path("src/client/PremiumRouteMeshKit.lua").read_text()
          lod = Path("src/client/scenery-lod.client.lua").read_text()
          map_builder = Path("src/server/MapBuilder.lua").read_text()
          truth = Path("tests/engine/mapbuilder.spec.luau").read_text()
