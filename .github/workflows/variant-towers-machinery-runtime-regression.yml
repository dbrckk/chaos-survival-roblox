name: Approved Towers corner machinery runtime regression
on:
  pull_request:
    paths:
      - src/client/ApprovedVariantTowersLandmarkMeshKit.lua
      - src/server/PremiumVariantTowersLandmarkAssets.lua
      - src/client/scenery-lod.client.lua
      - src/server/init.server.lua
      - src/server/MapBuilder.lua
      - assets/source/roblox-asset-registry.json
      - tools/generate_original_variant_towers_machinery.py
      - tools/verify_variant_towers_machinery_runtime.py
      - .github/workflows/variant-towers-machinery-runtime-regression.yml
  push:
    branches: [main]
    paths:
      - src/client/ApprovedVariantTowersLandmarkMeshKit.lua
      - src/server/PremiumVariantTowersLandmarkAssets.lua
      - src/client/scenery-lod.client.lua
      - src/server/init.server.lua
      - src/server/MapBuilder.lua
      - assets/source/roblox-asset-registry.json
      - tools/generate_original_variant_towers_machinery.py
      - tools/verify_variant_towers_machinery_runtime.py
      - .github/workflows/variant-towers-machinery-runtime-regression.yml
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner approved sculpted Towers art, auth and rollback
        run: python3 tools/verify_variant_towers_machinery_runtime.py
