name: One-shot Real Imported Route Mesh Runtime Source Gate
on:
  push:
    branches: [feat/live-real-3d-premium-route-mesh-integration-20261103]
    paths: ['.github/workflows/one-shot-real-route-mesh-runtime-gate-20261103.yml']
permissions:
  contents: read
jobs:
  full-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact verified Roblox asset allowlists and original 3D source geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          registry=json.loads(pathlib.Path("assets/source/roblox-asset-registry.json").read_text())
          approved={m["name"]:m["asset_id"] for m in registry["models"]}
          assert len(approved)==8 and len(set(approved.values()))==8
          source=pathlib.Path("src/server/PremiumRouteMeshAssets.lua").read_text()
          ids=dict(re.findall(r"(PremiumJumpDeck|PremiumSkybridgeModule)\s*=\s*(\d+)", source))
          assert ids=={"PremiumJumpDeck":approved["premium_jump_deck"],"PremiumSkybridgeModule":approved["premium_skybridge_module"]}
          for m in registry["models"]:
              assert m["moderation"]=="Approved"
              assert pathlib.Path(m["source"]).is_file()
              assert pathlib.Path(m["source_materials"]).is_file()
          assert "OriginalMeshScenery.sanitize(raw)" in source
          print("8 approved owned IDs and shared sanitizer validated")
          PY
          for model in premium_jump_deck premium_skybridge_module; do
            python tools/obj_to_gltf.py --source "assets/source/chaos_${model}.obj" --materials assets/source/chaos_route_kit.mtl --output "/tmp/${model}.gltf"
          done
      - name: Compile all Luau source and specs
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          mkdir -p /tmp/luau && unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 | xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
          python tools/validate_mobile_vfx_first_frame.py
      - name: Build exact full place with pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          mkdir -p /tmp/rojo && unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          python tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel CANDIDATE
          /tmp/rojo/rojo build default.project.json -o /tmp/ChaosRealRouteMesh.rbxlx
          test -s /tmp/ChaosRealRouteMesh.rbxlx
          grep -Fq "$GITHUB_SHA" /tmp/ChaosRealRouteMesh.rbxlx
