# Important single-batch visual-AAA production milestone. Never publish Roblox.
name: One-time QA 2026-11-05 Bulk Authentic Five World Cinema Meshes No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-bulk-authentic-3d-cinema-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-five-world-authentic-cinema-meshes-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: github.repository == 'dbrckk/chaos-survival-roblox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Verify real source IDs, geometry, 55 positions, Android caps and native failback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          kit=Path("src/client/ApprovedCinematicHorizonMeshKit.lua").read_text()
          rules=Path("src/shared/CinematicHorizonMeshRules.lua").read_text()
          builder=Path("src/client/arena-cinematic-depth.client.lua").read_text()
          lod=Path("src/client/scenery-lod.client.lua").read_text()
          visual=Path("src/shared/VisualBudgetRules.lua").read_text()
          spec=Path("tests/engine/cinematic-depth-layout.spec.luau").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          doc=Path("docs/VIS_AUTHENTIC_CINEMATIC_HORIZON_MASS_REPLACEMENT_2026-11-05.md").read_text()
          registry=Path("assets/source/roblox-asset-registry.json").read_text()
          for marker in (
              'function Rules.bodySize(variant,index)',
              'function Rules.offset(baseSize,variant,index)',
              'function Rules.capacity(tier,pressure,isTouch)',
              'Low={2,1,0}',
              'Medium={5,2,0}',
              'High={11,6,0}',
              'TOUCH_HIGH={7,3,0}',
              'CoolingSpire', 'HollowStack', 'Satellite',
              'Containment', 'Observatory','Freight','Turbine','Aerial',
          ):
              assert marker in rules,marker
          for marker in (
              'local Ring = if script and script.Parent',
              'require(script.Parent.CinematicDepthLayoutRules)',
          ):
              assert marker in rules,marker
          for marker in (
              'ArenaCinematicDepthLocal',
              'OriginalCinematicHorizonIndex',
              'OriginalCinematicHorizonVariant',
              'CinematicHorizonMeshRules.bodySize(variant, i)',
              'CinematicHorizonMeshRules.offset(',
              'tagHorizon(structure, i, variant)',
              'tagHorizon(crown, i, variant)',
              'tagHorizon(slit, i, variant)',
          ):
              assert marker in builder,marker
          for marker in (
              'ApprovedDistrictFacadeTemplates',
              'ApprovedTowerCoolingSpireTemplates',
              'ApprovedTowersHollowStackTemplates',
              'ApprovedAmbientMotionTemplates',
              'ApprovedServiceEquipmentTemplates',
              'Original3DAssetId',
              'OwnerVerified',
              'source:GetDescendants()',
              'part.CanCollide=false',
              'part.CanTouch=false',
              'part.CanQuery=false',
              'local function nativeGroup(',
              'local function genuineBody(',
              'local function reconcile(',
              'local function unmount(',
              'native.Transparency=original',
              'native.Transparency=1',
              'Spatial.choose(candidates,cap)',
              'function Kit.replacedNativeCount()',
          ):
              assert marker in kit,marker
          for id in ("132020956214241","88725004643299",
              "84217436280282","135791763112202",
              "95543769387033","97498534364335",
              "127850230318627","127295681925871"):
              assert id in registry,id
          assert 'OriginalCinematicHorizonMeshesLocal' in visual
          assert 'Parts = 900' in visual
          assert 'Parts = 680' in visual
          assert 'Parts = 440' in visual
          assert 'ApprovedCinematicHorizonMeshKit.sync(' in lod
          assert 'LocalOriginalCinematicHorizon3DCount' in lod
          assert 'LocalNativeCinematicHorizonPartsReplaced' in lod
          assert 'LowDistance = 240,' in lod
          assert 'MediumDistance = 315,' in lod
          assert 'expect(total).toBe(55)' in spec
          assert 'MeshRules.capacity("High",0,true)' in spec
          assert '"tests/engine/cinematic-depth-layout.spec.luau"' in cloud
          assert 'up to 55 distinct High-tier skyline positions' in doc
          assert 'game:GetService("AssetService")' not in kit
          assert 'LoadAssetAsync' not in kit
          assert 'RenderStepped' not in kit
          assert 'Heartbeat:Connect' not in kit
          print("Source-verified bulk 3D replacement: 5 exact-geometry"
                " world profiles, 55 source-eligible High positions,"
                " entirely reversible native fallback, mobile pressure"
                " tiers and 440/680/900 Parts census. NO PUBLISH.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-bulk-authentic-cinema-3d-five-world-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
