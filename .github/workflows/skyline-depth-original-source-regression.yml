name: Original sculpted skyline depth geometry regression
on:
  pull_request:
    paths:
      - tools/generate_original_skyline_depth.py
      - tools/generate_original_skyfleet_carrier.py
      - tools/obj_to_gltf.py
      - .github/workflows/upload-original-3d-models.yml
      - .github/workflows/skyline-depth-original-source-regression.yml
  push:
    branches: [main]
    paths:
      - tools/generate_original_skyline_depth.py
      - .github/workflows/skyline-depth-original-source-regression.yml
permissions:
  contents: read
jobs:
  verify-genuine-sculpture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Export sculpted source and validated self-contained glTF
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_skyline_depth.py --output "$RUNNER_TEMP/chaos_skyline_depth_sculpt.obj" > "$RUNNER_TEMP/skyline.json"
          python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/chaos_skyline_depth_sculpt.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/skyline.gltf" > "$RUNNER_TEMP/export.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          info=json.loads((root/'skyline.json').read_text())
          data=(root/'chaos_skyline_depth_sculpt.obj').read_bytes()
          gltf=json.loads((root/'skyline.gltf').read_text())
          assert info['asset']=='skyline_depth_sculpt'
          assert info['sha256']==hashlib.sha256(data).hexdigest()
          assert 450<=info['triangles']<=3200
          assert 35<=info['groups']<=150
          assert set(info['materials'])=={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          x,y,z=info['dimensions']
          assert 11<=x<=12.7 and 33<=y<=35 and 7<=z<=8
          assert gltf['asset']['version']=='2.0'
          assert {m['name'] for m in gltf['materials']}==set(info['materials'])
          assert len(gltf['meshes'][0]['primitives'])==7
          assert sum(gltf['accessors'][p['attributes']['POSITION']]['count']//3
                     for p in gltf['meshes'][0]['primitives'])==info['triangles']
          assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'}<=
                     set(p['attributes']) for p in gltf['meshes'][0]['primitives'])
          buf=gltf['buffers'][0]
          assert len(base64.b64decode(buf['uri'].split(',',1)[1],validate=True))==buf['byteLength']
          for part in (b'TaperedOctagonalForgedHull',b'SlottedCoolingFin',b'CrownTensionBrace'):
              assert part in data
          print('Validated original sculpted skyline:',info)
          print('No live Roblox Place modified.')
          PY
