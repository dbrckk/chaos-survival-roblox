# Important original 3D, distant skyline source milestone. Strict no publication.
name: One-time QA 2026-11-05 Distributed Original 3D Skyline No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-distributed-original-skyline-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-original-outboard-skyline-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Source contract for exact approved source meshes and spatial hard caps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rules=Path("src/shared/SpatialMidgroundSelectionRules.lua").read_text()
          skyline=Path("src/client/ApprovedMidgroundSkylineMeshKit.lua").read_text()
          harbor=Path("src/client/HarborMidgroundBargeMeshKit.lua").read_text()
          visual=Path("tests/engine/visual-budget-rules.spec.luau").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          doc=Path("docs/VIS_DISTRIBUTED_REAL_3D_OUTBOARD_SKYLINE_2026-11-05.md").read_text()
          for marker in (
              'function Rules.choose(candidates, budget)',
              'local capacity = math.min(#candidates,',
              'local chosen = {}',
              'local separation = math.huge',
              'math.min(90, separation * 0.24)',
              'and typeof(position) == "Vector3"',
              'result[part] = best',
          ):
              assert marker in rules,marker
          assert 'SpatialMidgroundSelectionRules.choose(candidates, cap)' in skyline
          assert 'SpatialMidgroundSelectionRules.choose(choices,cap)' in harbor
          assert 'Low = {count=1, distance=230, retention=24}' in skyline
          assert 'Medium = {count=2, distance=300, retention=32}' in skyline
          assert 'High = {count=4, distance=405, retention=44}' in skyline
          assert 'Low={models=0,distance=0,retention=0}' in harbor
          assert 'Medium={models=2,distance=270,retention=27}' in harbor
          assert 'High={models=4,distance=380,retention=45}' in harbor
          assert 'function Kit.sync(' in skyline and 'function Kit.sync(' in harbor
          assert 'template(profile.source[index])' in skyline
          assert 'local approved,id=source()' in harbor
          assert 'spreads approved midground geometry over separate real-world sectors' in visual
          assert '"tests/engine/visual-budget-rules.spec.luau"' in cloud
          assert 'source-approved' in doc or 'approved sources' in doc
          assert 'RenderStepped:Connect(' not in rules
          assert 'Instance.new(' not in rules
          print("Original approved architecture and cargo hull source placement"
                " now covers separated 320-stud regions. Same camera"
                " gates and Low/Medium/High caps; real-engine Lest suite"
                " exercises spatial selection. NO PUBLISH.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-distributed-original-skyline-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
