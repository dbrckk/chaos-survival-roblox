# Four strictly creator-owned original Model imports, no public Place publish.
name: One-time Original Variant Station Apex 3D 2026-11-09
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-perimeter-apex-20261109.yml
permissions:
  contents: read
concurrency:
  group: chaos-original-station-apex-20261109
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify four distinct 3D sources with seven genuine PBR meshes
        shell: bash
        run: |
          set -euo pipefail
          for model in perimeter_towers_apex perimeter_orbital_apex perimeter_crossroads_apex perimeter_relay_apex; do
            python3 tools/generate_original_perimeter_apex.py --model "$model" --output "$RUNNER_TEMP/chaos_$model.obj" > "$RUNNER_TEMP/$model.json"
            python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/chaos_$model.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/chaos_$model.gltf" > "$RUNNER_TEMP/$model-export.json"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import base64,hashlib,json,sys
          root=Path(sys.argv[1])
          envelopes={
              'perimeter_towers_apex':(2.2,8.1,1.8),
              'perimeter_orbital_apex':(3.4,3.975,3.4),
              'perimeter_crossroads_apex':(2.5,3.175,8.5),
              'perimeter_relay_apex':(2.4,6.1,2.0),
          }
          palette={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          for profile,bounds in envelopes.items():
              obj=(root/f'chaos_{profile}.obj').read_bytes()
              info=json.loads((root/f'{profile}.json').read_text())
              gltf=json.loads((root/f'chaos_{profile}.gltf').read_text())
              assert info['asset']==profile
              assert info['sha256']==hashlib.sha256(obj).hexdigest()
              assert 20<=info['groups']<=120 and 500<=info['triangles']<=7000
              assert set(info['materials'])==palette
              for actual,maximum in zip(info['dimensions'],bounds):
                  assert maximum*.78<=actual<=maximum*1.04,(profile,info['dimensions'])
              assert gltf['asset']['version']=='2.0'
              assert {m['name'] for m in gltf['materials']}==palette
              primitives=gltf['meshes'][0]['primitives']
              assert len(primitives)==7
              assert sum(gltf['accessors'][p['attributes']['POSITION']]['count']//3
                         for p in primitives)==info['triangles']
              assert all({'POSITION','NORMAL','TANGENT','TEXCOORD_0'}
                         <=set(p['attributes']) for p in primitives)
              buffer=gltf['buffers'][0]
              assert len(base64.b64decode(buffer['uri'].split(',',1)[1],
                         validate=True))==buffer['byteLength']
              print('VERIFIED ORIGINAL APEX',profile,
                    info['triangles'],info['groups'],
                    info['dimensions'],info['sha256'])
          print('Only Model asset uploads may follow; NO ROBLOX PLACE PUBLICATION')
          PY
  import-towers:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: perimeter_towers_apex
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
  import-orbital:
    needs: import-towers
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: perimeter_orbital_apex
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
  import-crossroads:
    needs: import-orbital
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: perimeter_crossroads_apex
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
  import-relay:
    needs: import-crossroads
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: perimeter_relay_apex
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
