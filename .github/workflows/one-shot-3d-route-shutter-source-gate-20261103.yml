name: One-shot Original 3D Route Shutter Source Gate
on:
  push:
    branches: [fix/route-mesh-shutter-warning-visibility-20261103]
    paths: [.github/workflows/one-shot-3d-route-shutter-source-gate-20261103.yml]
permissions:
  contents: read
jobs:
  compile-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Luau compile (all game and engine specs)
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip
          mkdir -p /tmp/luau && unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          find src tests studio -type f \( -name '*.lua' -o -name '*.luau' \) -print0 | xargs -0 -n1 /tmp/luau/luau-compile >/dev/null
      - name: Existing Android VFX budget
        run: python tools/validate_mobile_vfx_first_frame.py
      - name: Build actual full Roblox place with pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          mkdir -p /tmp/rojo && unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          python3 tools/stamp_build_identity.py --sha "$GITHUB_SHA" --channel CANDIDATE
          /tmp/rojo/rojo build default.project.json -o /tmp/ChaosSurvival.rbxlx
          test -s /tmp/ChaosSurvival.rbxlx
          grep -Fq "$GITHUB_SHA" /tmp/ChaosSurvival.rbxlx
