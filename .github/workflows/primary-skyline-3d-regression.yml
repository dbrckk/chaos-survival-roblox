name: Approved primary skyline 3D fallback regression
on:
  pull_request:
    paths:
      - src/client/ApprovedPrimarySkylineMeshKit.lua
      - src/client/scenery-lod.client.lua
      - src/server/MapBuilder.lua
      - src/server/PremiumExteriorTowerAssets.lua
      - src/server/init.server.lua
      - assets/source/roblox-asset-registry.json
      - tools/verify_primary_skyline_3d.py
      - .github/workflows/primary-skyline-3d-regression.yml
  push:
    branches: [main]
    paths:
      - src/client/ApprovedPrimarySkylineMeshKit.lua
      - src/client/scenery-lod.client.lua
      - src/server/MapBuilder.lua
      - src/server/PremiumExteriorTowerAssets.lua
      - src/server/init.server.lua
      - assets/source/roblox-asset-registry.json
      - tools/verify_primary_skyline_3d.py
      - .github/workflows/primary-skyline-3d-regression.yml
permissions:
  contents: read
jobs:
  verify-five-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify genuine 3D authoring and reversible 20-structure coverage
        run: python3 tools/verify_primary_skyline_3d.py
