# Exact one-off response to the user's failed public update #43312357642.
# THIS file's first merge to main starts the coordinator once. It does NOT
# trigger on ordinary commits or branches, does NOT bypass prior checks, and
# delegates actual publishing to the existing guarded public-playtest workflow.
name: One-shot Fix Validation and Existing Public Roblox Update 2026-11-12
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-repair-and-public-playtest-20261112.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: chaos-one-shot-repair-public-playtest-20261112
  cancel-in-progress: false
jobs:
  dispatch-and-verify:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Run original verified Build and Roblox Engine gates, then guarded public playtest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """One-time release dispatch. No asset key, game binary or web token escapes."""
          from __future__ import annotations
          from datetime import datetime, timezone
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPO_NAME"]
          sha = os.environ["SOURCE_SHA"]
          token = os.environ["GH_TOKEN"]
          assert repo == "dbrckk/chaos-survival-roblox"
          assert len(sha) == 40 and all(c in "0123456789abcdef" for c in sha)
          root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path, method="GET", data=None):
              body = json.dumps(data).encode("utf8") if data is not None else None
              request = urllib.request.Request(
                  root + path,
                  headers={**headers, **(
                      {"Content-Type": "application/json"} if body else {}
                  )},
                  method=method,
                  data=body,
              )
              with urllib.request.urlopen(request, timeout=40) as response:
                  data = response.read()
                  return json.loads(data) if data else {}

          def same_main():
              head = api("/git/ref/heads/main")["object"]["sha"]
              if head != sha:
                  raise SystemExit(
                      f"STOP: main moved from {sha[:12]} to {head[:12]}; "
                      "never publish an obsolete candidate"
                  )

          def dispatch(workflow, inputs=None):
              same_main()
              print(f"Dispatching {workflow} on verified main {sha[:12]}", flush=True)
              api(f"/actions/workflows/{workflow}/dispatches", "POST", {
                  "ref": "main", "inputs": inputs or {}
              })

          def wait_for(workflow_name, dispatched_at, max_seconds):
              deadline = time.monotonic() + max_seconds
              last_run = None
              while time.monotonic() < deadline:
                  same_main()
                  runs = api(f"/actions/runs?head_sha={sha}&per_page=100")[
                      "workflow_runs"
                  ]
                  matches = []
                  for run in runs:
                      if run.get("name") != workflow_name:
                          continue
                      if run.get("event") != "workflow_dispatch":
                          continue
                      if run.get("head_sha") != sha or run.get("head_branch") != "main":
                          continue
                      stamp = datetime.fromisoformat(
                          run["created_at"].replace("Z", "+00:00")
                      )
                      if stamp.timestamp() + 30 < dispatched_at:
                          continue
                      matches.append(run)
                  if matches:
                      run = max(matches, key=lambda r: r["id"])
                      if last_run != run["id"]:
                          last_run = run["id"]
                          print(f"Gate: {workflow_name} — run {last_run} "
                                f"https://github.com/{repo}/actions/runs/{last_run}",
                                flush=True)
                      if run.get("status") == "completed":
                          conclusion = run.get("conclusion")
                          print(f"{workflow_name}: {conclusion}", flush=True)
                          if conclusion != "success":
                              raise SystemExit(
                                  "STOP: actual Build/Roblox Engine/Publish gate "
                                  f"failed, run {last_run}. Public game unchanged."
                              )
                          return run
                  time.sleep(12)
              raise SystemExit(
                  f"STOP: no successful {workflow_name} on exact main {sha}; "
                  "never publish without verified green prerequisites"
              )

          # The owner ALREADY manually attempted exactly this public
          # playtest at run 43312357642 (confirmed target and uncertified
          # public consent); this one-off follows that same workflow, not
          # the fully-certified release process and not a new Place.
          same_main()
          started = datetime.now(timezone.utc).timestamp()
          dispatch("ci.yml")
          build = wait_for("Build Validation", started, 7 * 60)
          started = datetime.now(timezone.utc).timestamp()
          dispatch("roblox-cloud-test.yml")
          engine = wait_for("Roblox Open Cloud Engine Tests",
                            started, 83 * 60)
          # Exactly the same two required workflows are checked AGAIN by
          # the existing publish workflow against the SAME SHA, before
          # any irreversible Roblox POST. Never fake manual Studio QA.
          started = datetime.now(timezone.utc).timestamp()
          dispatch("publish-existing-public-playtest.yml", {
              "confirm": "PUBLISH_EXISTING_10771083668",
              "acknowledge_untested": "true",
          })
          publish = wait_for(
              "Publish Existing Chaos Survival (Public Playtest Update)",
              started, 17 * 60,
          )
          print("PUBLIC PLAYTEST POST SUCCEEDED on the existing place only.",
                flush=True)
          print(f"Exact SHA: {sha}", flush=True)
          print(f"Build gate: {build['html_url']}", flush=True)
          print(f"Real Roblox engine: {engine['html_url']}", flush=True)
          print(f"Successful public publish: {publish['html_url']}", flush=True)
          PY
