# One-off important visual-performance milestone on the precise GitHub SHA. Never publish Roblox.
name: One-time QA 2026-11-05 Genuine Collapse Warning Mobile Budget No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-real-collapse-warning-mobile-budget-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-genuine-collapse-tagged-decks-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Validate authoritative server tag and bounded Android warning visual lookup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          server=Path("src/server/Disasters/DisappearingPlatforms.lua").read_text()
          client=Path("src/client/hazard-warning-signatures.client.lua").read_text()
          doc=Path("docs/VIS_EVENT_DRIVEN_REAL_DISAPPEARING_PLATFORM_WARNING_2026-11-05.md").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          assert 'local CollectionService = game:GetService("CollectionService")' in server
          assert 'local CollectionService = game:GetService("CollectionService")' in client
          assert 'local WARNING_TAG = "ChaosDisappearingWarning"' in server
          assert 'local WARNING_TAG = "ChaosDisappearingWarning"' in client
          assert 'CollectionService:AddTag(p, WARNING_TAG)' in server
          assert server.index('p:SetAttribute("CollapsePhase", "Warning")') < server.index('CollectionService:AddTag(p, WARNING_TAG)')
          assert server.index('p.Transparency = math.min(p.Transparency, 0.24)') < server.index('CollectionService:AddTag(p, WARNING_TAG)')
          assert 'CollectionService:RemoveTag(p, WARNING_TAG)' in server
          assert 'CollectionService:RemoveTag(part, WARNING_TAG)' in server
          assert 'CollectionService:GetTagged(WARNING_TAG)' in client
          assert 'CollectionService:GetInstanceAddedSignal(WARNING_TAG)' in client
          assert 'CollectionService:GetInstanceRemovedSignal(WARNING_TAG)' in client
          assert 'part:GetAttribute("CollapsePhase") == "Warning"' in client
          assert 'part.Parent == platforms' in client
          assert 'part.CanCollide' in client
          assert 'removePlatformHighlight(part)' in client
          assert 'platforms:GetChildren()' not in client.split('local function updatePlatformHighlights()',1)[1].split('stateEvent.OnClientEvent:Connect(',1)[0]
          assert 'part.Material == Enum.Material.Neon' not in client
          assert 'task.wait(0.12)' in client
          assert 'O(active tagged warning decks)' in doc
          assert '"tests/engine/visual-budget-rules.spec.luau"' in cloud
          assert 'RenderStepped:Connect(' not in client
          assert 'BindToRenderStep(' not in client
          print("Verified physical hazard ownership and mobile warning"
                " sampling limited to tagged server warning decks rather"
                " than every platform. No publish.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-genuine-collapse-warning-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
