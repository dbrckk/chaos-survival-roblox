# User-authorized, important visual milestone. No public Roblox publish.
# Verify original five-world 3D distribution and previous streaming corrections.
name: One-time QA 2026-11-05 Spatial Original 3D Five Worlds No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261105-spatial-original-3d-five-worlds-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: chaos-spatial-original-fiveworlds-20261105
  cancel-in-progress: false

jobs:
  validate-exact-sha:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Source contract for actual approved 3D cradles and columns over five maps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          large=Path("src/client/PremiumLargeStructureMeshKit.lua").read_text()
          owner=Path("src/client/arena-platform-identity.client.lua").read_text()
          cloud=Path(".github/workflows/roblox-cloud-test.yml").read_text()
          doc=Path("docs/VIS_3D_SPATIAL_SKYSPINE_CRADLES_COLUMNS_2026-11-05.md").read_text()
          for marker in (
              'function Kit.selectNearRouteStructures(',
              'local cradleSource=verified("LongCradle")',
              'local supportSource=decor and decor:IsA("Folder")',
              'local function distribute(candidates,limit,foreground)',
              'local spacingCap=math.max(base.Size.X,base.Size.Z)*.68',
              'for deck in pairs(selected) do',
              'and long>=19.5 and long<=34',
              'validNativeSupport(part,id)',
              'local cradleLimit=tier=="High" and 4 or 2',
              'local supportLimit=tier=="High" and 8 or 4',
              'tier=="High" and 2 or 1',
              'tier=="High" and 5 or 2',
              'function Kit.longCradle(',
              'function Kit.supports(',
              'OriginalLongCradle3D',
          ):
              assert marker in large, marker
          for marker in (
              'local disconnectDecorWatch = nil',
              'watchDecor(generated)',
              'task.delay(0.12, function()',
              'task.delay(0.18, function()',
              'part.Name:match("^PlatformSupport%d+_%d+$")',
              'LocalOriginalNearSupportColumnCount',
              'LocalOriginalNearBridgeCradleCount',
          ):
              assert marker in owner, marker
          assert 'No new camera/render sampler' in doc
          assert 'RenderStepped' not in large
          assert 'RunService' not in large
          assert '"tests/engine/visual-budget-rules.spec.luau"' in cloud
          print("Authenticated true 3D side/underframe and support"
                " selection is bounded and spatially distributed across"
                " real physical map geometry; late Decor recovery retained."
                " NO PUBLICATION.",flush=True)
          PY
      - name: Source-only milestone validation (NEVER publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo=os.environ["REPO"]
          candidate=os.environ["CANDIDATE_SHA"]
          base="https://api.github.com/repos/"+repo
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"chaos-spatial-fiveworlds-no-publish",
          }

          def api(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(base+path,data=body,
                  method="POST" if body is not None else "GET",
                  headers={**headers,"Content-Type":"application/json"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=40) as r:
                          if payload is not None:
                              if r.status!=204:
                                  raise RuntimeError("Invalid dispatch response")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==5: raise
                      time.sleep(3*(attempt+1))

          def verify_head():
              actual=api("/git/ref/heads/main")["object"]["sha"]
              if actual!=candidate:
                  raise SystemExit("main moved; abandon stale SHA QA")

          verify_head()
          print("VALIDATION ONLY, NO PUBLICATION",candidate,flush=True)
          names={"Build Validation":"ci.yml",
                 "Roblox Open Cloud Engine Tests":"roblox-cloud-test.yml"}
          for name,path in names.items():
              verify_head()
              api("/actions/workflows/"+path+"/dispatches",{"ref":"main"})
              print("Dispatched",name,flush=True)
              time.sleep(4)

          for attempt in range(400):
              verify_head()
              runs=api("/actions/runs?head_sha="+candidate+"&per_page=100")
              states={}
              for run in runs.get("workflow_runs",[]):
                  if run.get("head_sha")!=candidate or run.get("event")!="workflow_dispatch":
                      continue
                  name=run.get("name")
                  if name in names and (name not in states or
                      run.get("created_at","") > states[name].get("created_at","")):
                      states[name]=run
              if attempt%6==0:
                  print("Milestone:",{name:
                      (states.get(name) or {}).get("status","pending")+"/"+
                      str((states.get(name) or {}).get("conclusion"))
                      for name in names},flush=True)
              if any(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")!="success" for n in names):
                  raise SystemExit("Exact-SHA source milestone FAILED; no publish")
              if all(states.get(n,{}).get("status")=="completed"
                     and states[n].get("conclusion")=="success" for n in names):
                  verify_head()
                  print("Exact-SHA Build + Cloud passed. NO PUBLISH.",candidate,flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Exact-SHA QA timed out; no publish")
          PY
