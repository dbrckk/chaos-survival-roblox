# One-shot exact-SHA validation of two Roblox-Approved P4 perimeter rims,
# authentic native fallback, 110 Approved source IDs, real-engine rectangular and long deck bevel replacements,
# shared mobile budget and nonphysical safe importer. NO Roblox publish.
# It NEVER publishes an experience and cannot run from a PR.
# Final exact-SHA retest: full rectangular/long rim game-engine checks,
# safe shrinking keel footprint, 6 PC / 4 touch underdeck beam fixtures,
# and approved five-world structures. No automatic public publication.
# P4 district ownership closeout (2026-11-14): validate 88 engine
# specs including the isolated five-native-sidewall rollback fixture,
# approved facade/source revocation, full Build and 7 cloud suites
# on one exact main SHA. Never publish the public Roblox place.
# P4 source-cohort rollback closeout: assert single asset invalidation
# restores all eight district owners; single clone corruption restores
# only its own native building. Keep build/cloud SHA identical.
# P4 2026-11-14: the exact-main Cloud gate now validates 8 approved
# facade + rear-shell models on healthy desktop Medium, while keeping
# three Android Medium models, pressure rollback and original collision.
# Cloud gate 2026-11-14: Build now independently preflights every
# real engine spec via the same 105000-byte Cloud composer without
# relying on workflow-generated lest.ci.toml. Re-run same-SHA 7 Cloud
# suites and Build; never deploy the public experience.
# P4 Cloud source-limit incident: previously 106,219B spec rejected by
# composer before engine launch. Source now 104,013B and Build Validation
# independently executes identical batch generator; run whole cloud gate
# on same main SHA, without public Roblox publication.
# P4 follow-up 2026-11-14: engine-assert pressure 1/2 full native rollback
# and healthy High PC recovery on all five generated worlds; no publish.
# P4 2026-11-14 independent exact-SHA admission for all five arenas:
# ten High desktop / six Medium physical ascension arch sculpts,
# four Medium approved casings and four Orbital underframes;
# unchanged Android caps, shrink safety and previous stress-1 ceilings.
# Full Build + seven Roblox Open Cloud suites; never publish.
# P4 in-place mutation closeout: the same 88-spec engine suite must
# prove synchronous native fallback on source MeshPart geometry edits
# and mounted clone physics changes, without a new RenderStepped loop.
name: One-time QA 2026-11-13 Approved Platform Rims Engine No Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-qa-20261113-approved-rims-engine-no-publish.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: p4-two-authored-platform-rims-exact-qa-20261113
  cancel-in-progress: false

jobs:
  validate-current-main:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - name: Check real existing source inventory and Android visual budget
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_visual_structure_sources.py
          python3 tools/verify_original_3d_budget_census.py

      - name: Dispatch actual full build and Roblox Cloud engine checks on exact main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          candidate = os.environ["CANDIDATE_SHA"]
          root = "https://api.github.com/repos/" + repo
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "chaos-platform-rims-exact-main-engine-qa",
          }

          def request(path, data=None):
              encoded = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(
                  root + path, data=encoded,
                  method="POST" if encoded is not None else "GET",
                  headers=headers)
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=40) as r:
                          if data is not None:
                              if r.status != 204:
                                  raise RuntimeError("Expected GitHub dispatch HTTP 204")
                              return {}
                          return json.load(r)
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 4:
                          raise
                      time.sleep(3 * (attempt + 1))

          def verify_head():
              actual = request("/git/ref/heads/main")["object"]["sha"]
              if actual != candidate:
                  raise SystemExit(
                      "main HEAD moved: no stale-SHA evidence or publishing")
              return actual

          if len(candidate) != 40:
              raise SystemExit("Invalid candidate SHA")
          verify_head()
          workflows = {
              "Build Validation": "ci.yml",
              "Roblox Open Cloud Engine Tests": "roblox-cloud-test.yml",
          }
          for name, path in workflows.items():
              verify_head()
              request("/actions/workflows/" + path + "/dispatches",
                      {"ref": "main"})
              print("Dispatched exact-main workflow:", name, flush=True)
              time.sleep(4)

          for attempt in range(320):
              verify_head()
              runs = request("/actions/runs?head_sha=" + candidate +
                             "&per_page=100")["workflow_runs"]
              found = {}
              for run in runs:
                  name = run["name"]
                  if (name not in workflows or
                      run.get("event") != "workflow_dispatch" or
                      run.get("head_sha") != candidate):
                      continue
                  if (name not in found or
                      run["created_at"] >= found[name]["created_at"]):
                      found[name] = run
              if attempt % 8 == 0:
                  print("Exact SHA QA status", {
                      name: (found.get(name) or {}).get("status", "pending")
                      + "/" + str((found.get(name) or {}).get("conclusion"))
                      for name in workflows}, flush=True)
              for name, run in found.items():
                  if run["status"] == "completed" and run["conclusion"] != "success":
                      raise SystemExit(
                          name + " FAILED on exact SHA; NEVER PUBLISH")
              if all(name in found and found[name]["status"] == "completed"
                     and found[name]["conclusion"] == "success"
                     for name in workflows):
                  verify_head()
                  print("PASS: FULL BUILD + ALL CLOUD ENGINE SUITES on",
                        candidate, "— NO PUBLISH", flush=True)
                  break
              time.sleep(15)
          else:
              raise SystemExit(
                  "QA timeout; do not claim full validation, NEVER PUBLISH")
          PY
