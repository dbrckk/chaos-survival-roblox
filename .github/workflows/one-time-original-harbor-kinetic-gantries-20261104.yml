# Original 3D authored twin Harbor gantries, without modifying game Place.
# Source-only geometry/UV checks precede sequential owner Roblox Model imports.
name: One-time Original Kinetic Harbor Gantry 3D 2026-11-04
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-harbor-kinetic-gantries-20261104.yml

permissions:
  contents: read

concurrency:
  group: chaos-original-harbor-kinetic-gantries-20261104
  cancel-in-progress: false

jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify both original cargo and cable port gantries
        shell: bash
        run: |
          set -euo pipefail
          for model in harbor_gantry_kinetic_container harbor_gantry_kinetic_drum; do
            python3 tools/generate_original_harbor_gantry.py \
              --model "$model" --output "$RUNNER_TEMP/${model}.obj" \
              > "$RUNNER_TEMP/${model}.json"
            python3 tools/obj_to_gltf.py \
              --source "$RUNNER_TEMP/${model}.obj" \
              --materials assets/source/chaos_route_kit.mtl \
              --output "$RUNNER_TEMP/${model}.gltf" \
              > "$RUNNER_TEMP/${model}.export.json"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64,json,sys
          from pathlib import Path
          folder=Path(sys.argv[1])
          materials={"ARMOR","BRUSHED","CARBON","GRIP","ALLOY","CERAMIC","SIGNAL"}
          for kind in ("harbor_gantry_kinetic_container","harbor_gantry_kinetic_drum"):
              a=json.loads((folder/(kind+".json")).read_text())
              g=json.loads((folder/(kind+".gltf")).read_text())
              obj=(folder/(kind+".obj")).read_text()
              assert a["name"]==kind and a["source_y_shift"]==18
              assert 90<=a["groups"]<=270 and 2500<=a["triangles"]<=9500
              x,y,z=a["dimensions"]
              assert 20.5<=x<=24.8 and 35.7<=y<=37.2 and 43<=z<=45.4
              assert abs(a["bounds_center"][0])<.5
              assert abs(a["bounds_center"][2])<.9
              assert set(a["materials"])==materials
              assert a["kinetic_material_roles"]=={
                  "ALLOY":"Cable","CARBON":"Trolley","GRIP":"Load",
                  "ARMOR":"Static","BRUSHED":"Static",
                  "CERAMIC":"Static","SIGNAL":"Static"}
              role_bounds={}
              for primitive in g["meshes"][0]["primitives"]:
                  mat=g["materials"][primitive["material"]]["name"]
                  a_id=primitive["attributes"]["POSITION"]
                  accessor=g["accessors"][a_id]
                  role_bounds[mat]=[accessor["min"],accessor["max"]]
              # Role-isolated geometry is essential: our runtime follows
              # the already-moving native trolley, cable and cargo.
              assert all(key in role_bounds for key in ("ALLOY","CARBON","GRIP"))
              for material,(low,high) in role_bounds.items():
                  extent=[high[i]-low[i] for i in range(3)]
                  if material=="ALLOY":
                      assert 6.4<extent[0]<8.9 and 12<extent[1]<15
                      assert extent[2]<1.1
                  elif material=="CARBON":
                      assert extent[0]<9.5 and extent[1]<5.6
                      assert extent[2]<5.6
                  elif material=="GRIP":
                      assert 8<extent[0]<11.2 and 6.0<extent[1]<10
                      assert 4.2<extent[2]<7.8
              print("KINETIC ROLE BOUNDS",kind,role_bounds)
              assert g["asset"]["version"]=="2.0"
              assert set(m["name"] for m in g["materials"])==materials
              assert len(g["meshes"][0]["primitives"])==7
              assert "TaperedTenSidedQuayPier" in obj
              assert "ForgedOverheadMainGirder" in obj
              assert "ContinuousContainerBoom" in obj
              assert "StainlessHoistCable" in obj
              if kind.endswith("container"):
                  assert "TwentyFootSuspendedISOBody" in obj
              else:
                  assert "SpoolCoreCylinder" in obj
                  assert "TrueRopeWinding" in obj
              count=0
              for primitive in g["meshes"][0]["primitives"]:
                  attrs=primitive["attributes"]
                  assert {"POSITION","NORMAL","TANGENT","TEXCOORD_0"}<=set(attrs)
                  count+=g["accessors"][attrs["POSITION"]]["count"]//3
              assert count==a["triangles"],(count,a["triangles"])
              raw=base64.b64decode(g["buffers"][0]["uri"].split(",",1)[1],
                                    validate=True)
              assert len(raw)==g["buffers"][0]["byteLength"]
              print("Validated original",kind,count,
                    "triangles, seven UV+tangent meshes, no Place publication")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-kinetic-harbor-gantry-cranes-sources
          path: |
            ${{ runner.temp }}/harbor_gantry_*.obj
            ${{ runner.temp }}/harbor_gantry_*.gltf
            ${{ runner.temp }}/harbor_gantry_*.json
          retention-days: 14

  import-container:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: harbor_gantry_kinetic_container
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit

  import-drum:
    needs: import-container
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: harbor_gantry_kinetic_drum
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
