# Source-verify ONE original Harbor dock caisson, then moderated owner
# Model upload. Never deploys/updates the live Roblox experience.
name: One-time Original Harbor Dock Caisson 3D 2026-11-04
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-harbor-dock-caisson-20261104.yml

permissions:
  contents: read
concurrency:
  group: harbor-original-caisson-3d-once-20261104
  cancel-in-progress: false

jobs:
  prove-original-geometry:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate original triangulation, materials, top footprint and glTF tangents
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_harbor_dock_caisson.py \
            --output "$RUNNER_TEMP/chaos_harbor_dock_caisson.obj" \
            > "$RUNNER_TEMP/source.json"
          python3 tools/obj_to_gltf.py \
            --source "$RUNNER_TEMP/chaos_harbor_dock_caisson.obj" \
            --materials assets/source/chaos_route_kit.mtl \
            --output "$RUNNER_TEMP/chaos_harbor_dock_caisson.gltf" \
            > "$RUNNER_TEMP/export.json"
          python3 - "$RUNNER_TEMP/source.json" \
            "$RUNNER_TEMP/chaos_harbor_dock_caisson.gltf" \
            "$RUNNER_TEMP/chaos_harbor_dock_caisson.obj" <<'PY'
          import base64,json,sys
          from pathlib import Path
          meta=json.loads(Path(sys.argv[1]).read_text())
          gltf=json.loads(Path(sys.argv[2]).read_text())
          obj=Path(sys.argv[3]).read_text()
          assert meta["asset"]=="harbor_dock_caisson"
          assert 30 <= meta["groups"] <= 125
          assert 900 <= meta["triangles"] <= 4600
          x,y,z=meta["dimensions"]
          assert 13<=x<=14.4 and 2.9<=y<=3.55 and 13<=z<=14.4
          assert meta["bounds_max"][1] <= 0.98
          assert meta["top_plane_native"] == 1.0
          assert "TwelveStudSealedUndersideCassette" in obj
          assert "ForgedOuterDockWall" in obj
          assert "SuspendedLongitudinalGirder" in obj
          mat={"ARMOR","BRUSHED","CARBON","GRIP","ALLOY","CERAMIC","SIGNAL"}
          assert set(meta["materials"])==mat
          assert set(m["name"] for m in gltf["materials"])==mat
          assert gltf["asset"]["version"]=="2.0"
          prim=gltf["meshes"][0]["primitives"]
          assert len(prim)==7
          assert all({"POSITION","NORMAL","TEXCOORD_0","TANGENT"}<=set(
              p["attributes"]) for p in prim)
          tris=sum(gltf["accessors"][p["attributes"]["POSITION"]]["count"]//3
              for p in prim)
          assert tris==meta["triangles"]
          bin=base64.b64decode(gltf["buffers"][0]["uri"].split(",",1)[1],
                              validate=True)
          assert len(bin)==gltf["buffers"][0]["byteLength"]
          print("VERIFIED ORIGINAL HARBOR CAISSON:",tris,
                "triangles; nonwalkable upper surface; seven real materials")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-harbor-caisson-source
          path: |
            ${{ runner.temp }}/chaos_harbor_dock_caisson.obj
            ${{ runner.temp }}/chaos_harbor_dock_caisson.gltf
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/export.json
          retention-days: 14

  import-once:
    needs: prove-original-geometry
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: harbor_dock_caisson
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
