name: Active-world original signature startup source regression
on:
  pull_request:
    paths:
      - src/server/PremiumActiveVariantImportSchedule.lua
      - src/server/PremiumClassicForgedSupportsAssets.lua
      - src/client/ApprovedClassicForgedSupportsMeshKit.lua
      - src/client/ApprovedCrossroadsSignatureInterchangeMeshKit.lua
      - src/server/PremiumClassicSignatureObservatoryAssets.lua
      - src/server/PremiumCrossroadsSignatureInterchangeAssets.lua
      - src/server/PremiumHarborSignatureGantryAssets.lua
      - src/server/PremiumTowersSignatureBridgeAssets.lua
      - src/server/PremiumOrbitalSignatureRingAssets.lua
      - src/server/init.server.lua
      - assets/source/roblox-asset-registry.json
      - tools/verify_active_variant_signature_schedule.py
      - .github/workflows/active-variant-signature-startup-regression.yml
  push:
    branches: [main]
    paths:
      - src/server/PremiumActiveVariantImportSchedule.lua
      - src/server/PremiumClassicForgedSupportsAssets.lua
      - src/client/ApprovedClassicForgedSupportsMeshKit.lua
      - src/client/ApprovedCrossroadsSignatureInterchangeMeshKit.lua
      - src/server/PremiumClassicSignatureObservatoryAssets.lua
      - src/server/PremiumCrossroadsSignatureInterchangeAssets.lua
      - src/server/PremiumHarborSignatureGantryAssets.lua
      - src/server/PremiumTowersSignatureBridgeAssets.lua
      - src/server/PremiumOrbitalSignatureRingAssets.lua
      - src/server/init.server.lua
      - assets/source/roblox-asset-registry.json
      - tools/verify_active_variant_signature_schedule.py
      - .github/workflows/active-variant-signature-startup-regression.yml
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove active-only acceleration, approved provenance and fallback
        run: python3 tools/verify_active_variant_signature_schedule.py
