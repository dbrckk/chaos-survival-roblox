name: Release Candidate Gate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CERTIFY to verify the selected main commit'
        required: true
        default: ''
      android:
        description: 'Type PASS after physical Android UX/performance soak succeeds'
        required: true
        default: ''
      desktop:
        description: 'Type PASS after physical desktop UX/performance pass succeeds'
        required: true
        default: ''
      persistence:
        description: 'Type PASS after persistence/rejoin validation succeeds'
        required: true
        default: ''
      gameplay_fairness:
        description: 'Type PASS after gameplay/fairness review succeeds'
        required: true
        default: ''
      accessibility:
        description: 'Type PASS after audio/accessibility review succeeds'
        required: true
        default: ''
      public_alpha:
        description: 'Type PASS after small real-player public alpha succeeds'
        required: true
        default: ''
      store_assets:
        description: 'Type PASS after icon/thumbnails/screenshots/page review succeeds'
        required: true
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate certification confirmation
        shell: bash
        run: |
          test "${{ inputs.confirm }}" = "CERTIFY" || {
            echo "Type CERTIFY to run the release candidate gate."
            exit 1
          }

          test "${{ inputs.android }}" = "PASS" || {
            echo "Android attestation must be PASS."
            exit 1
          }
          test "${{ inputs.desktop }}" = "PASS" || {
            echo "Desktop attestation must be PASS."
            exit 1
          }
          test "${{ inputs.persistence }}" = "PASS" || {
            echo "Persistence attestation must be PASS."
            exit 1
          }
          test "${{ inputs.gameplay_fairness }}" = "PASS" || {
            echo "Gameplay/fairness attestation must be PASS."
            exit 1
          }
          test "${{ inputs.accessibility }}" = "PASS" || {
            echo "Audio/accessibility attestation must be PASS."
            exit 1
          }
          test "${{ inputs.public_alpha }}" = "PASS" || {
            echo "Public alpha attestation must be PASS."
            exit 1
          }
          test "${{ inputs.store_assets }}" = "PASS" || {
            echo "Store/page asset attestation must be PASS."
            exit 1
          }

      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Require main branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "main" || {
            echo "Release Candidate Gate must be dispatched from main."
            exit 1
          }

      - name: Verify required workflows on exact SHA
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          required = {
              "Build Validation": None,
              "Roblox Open Cloud Engine Tests": None,
              "Roblox Studio E2E Playtest (Authenticated Runner)": None,
          }
          latest_seen = {
              "Build Validation": None,
              "Roblox Open Cloud Engine Tests": None,
              "Roblox Studio E2E Playtest (Authenticated Runner)": None,
          }

          for run in payload.get("workflow_runs", []):
              name = run.get("name")
              if name not in required:
                  continue
              if latest_seen[name] is None:
                  latest_seen[name] = run
              trusted = run.get("head_branch") == "main"
              if name == "Build Validation":
                  trusted = trusted and run.get("event") == "push"
              elif name == "Roblox Open Cloud Engine Tests":
                  trusted = trusted and run.get("event") in {"push", "workflow_dispatch"}
              else:
                  trusted = trusted and run.get("event") in {"workflow_dispatch", "push"}

              if (
                  required[name] is None
                  and trusted
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
              ):
                  required[name] = run

          failures = []
          for name, run in required.items():
              if run is None:
                  latest = latest_seen[name]
                  if latest is None:
                      failures.append(f"{name}: no run found for {sha}")
                  else:
                      failures.append(
                          f"{name}: no trusted successful main run; "
                          f"latest status={latest.get('status')} "
                          f"conclusion={latest.get('conclusion')} "
                          f"event={latest.get('event')} "
                          f"branch={latest.get('head_branch')}"
                      )

          spec_paths = sorted(Path("tests/engine").glob("*.spec.luau"))
          if not spec_paths:
              failures.append("No engine specs found.")

          if failures:
              print("Release candidate automated gate FAILED:")
              for failure in failures:
                  print(" -", failure)
              raise SystemExit(1)

          build = required["Build Validation"]
          cloud = required["Roblox Open Cloud Engine Tests"]
          studio = required["Roblox Studio E2E Playtest (Authenticated Runner)"]

          artifacts_request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{studio['id']}/artifacts?per_page=100",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(artifacts_request, timeout=30) as response:
              artifacts_payload = json.load(response)

          studio_artifact = None
          for artifact in artifacts_payload.get("artifacts", []):
              if (
                  artifact.get("name") == "roblox-studio-e2e"
                  and not artifact.get("expired", False)
              ):
                  studio_artifact = artifact
                  break

          if studio_artifact is None:
              raise SystemExit(
                  "Authenticated Studio E2E run is green but its roblox-studio-e2e artifact is missing or expired."
              )

          import io
          import zipfile

          archive_request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts/{studio_artifact['id']}/zip",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(archive_request, timeout=60) as response:
              archive_bytes = response.read()

          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              candidates = [
                  name for name in archive.namelist()
                  if name.endswith("studio-e2e-result.txt")
              ]
              if len(candidates) != 1:
                  raise SystemExit(
                      "Expected exactly one studio-e2e-result.txt in Studio E2E artifact; found "
                      + str(len(candidates))
                  )
              manifest_text = archive.read(candidates[0]).decode("utf-8-sig")

          manifest = {}
          for raw_line in manifest_text.splitlines():
              if "=" not in raw_line:
                  continue
              key, value = raw_line.split("=", 1)
              manifest[key.strip()] = value.strip()

          manifest_failures = []
          if manifest.get("status") != "PASS":
              manifest_failures.append("status is not PASS")
          if manifest.get("commit") != sha:
              manifest_failures.append(
                  f"commit mismatch: {manifest.get('commit')} != {sha}"
              )
          if manifest.get("run_id") != str(studio["id"]):
              manifest_failures.append(
                  f"run_id mismatch: {manifest.get('run_id')} != {studio['id']}"
              )
          if not manifest.get("run_attempt"):
              manifest_failures.append("run_attempt missing")
          if not manifest.get("completed_utc"):
              manifest_failures.append("completed_utc missing")
          if not manifest.get("studio_file_version"):
              manifest_failures.append("studio_file_version missing")

          if manifest_failures:
              raise SystemExit(
                  "Studio E2E PASS manifest verification failed: "
                  + "; ".join(manifest_failures)
              )

          evidence = Path("release-evidence.md")
          evidence.write_text(
              "\n".join([
                  "# Chaos Survival — Automated Release Evidence",
                  "",
                  f"- Commit SHA: `{sha}`",
                  f"- Git ref: `{os.environ.get('GITHUB_REF_NAME', '')}`",
                  f"- Build Validation: PASS (run {build['id']})",
                  f"- Roblox Open Cloud Engine Tests: PASS (run {cloud['id']})",
                  f"- Roblox Studio E2E: PASS (run {studio['id']})",
                  f"- Studio E2E manifest: PASS / commit {manifest['commit']} / run {manifest['run_id']} / attempt {manifest['run_attempt']}",
                  f"- Studio version: {manifest['studio_file_version']}",
                  f"- Studio completed UTC: {manifest['completed_utc']}",
                  f"- Engine spec files: {len(spec_paths)}",
                  "",
                  "## Automated status",
                  "",
                  "- PASS — exact SHA has green Build Validation.",
                  "- PASS — exact SHA has green real-engine Open Cloud tests.",
                  "- PASS — Open Cloud run implies shard coverage verification passed.",
                  "- PASS — authenticated four-client Roblox Studio E2E succeeded on the exact SHA.",
                  "",
                  "## Manual gate attestations",
                  "",
                  "- PASS — physical Android UX/performance soak.",
                  "- PASS — physical desktop UX/performance pass.",
                  "- PASS — persistence/rejoin validation with API Services.",
                  "- PASS — gameplay/fairness review.",
                  "- PASS — audio/accessibility review.",
                  "- PASS — small real-player public alpha.",
                  "- PASS — final icon/thumbnails/screenshots/page review.",
                  "",
                  "This artifact certifies automated evidence plus the explicit manual attestations supplied to the gate.",
                  "",
              ]),
              encoding="utf-8",
          )

          print(evidence.read_text())
          PY

      - name: Verify release metadata consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md").read_text()
          count = len(list(Path("tests/engine").glob("*.spec.luau")))
          match = re.search(r"(\d+) engine specs assigned exactly once", readme)
          if not match:
              raise SystemExit("README engine spec count statement missing.")
          if int(match.group(1)) != count:
              raise SystemExit(
                  f"README engine spec count is {match.group(1)} but repository has {count}."
              )

          checklist = Path("RELEASE_CHECKLIST.md").read_text()
          required_sections = [
              "## Automated gate",
              "## Authenticated Roblox Studio gate",
              "## Physical device gate",
              "## Data persistence gate",
              "## Public alpha gate",
              "## Definition of done",
          ]
          missing = [section for section in required_sections if section not in checklist]
          if missing:
              raise SystemExit("Missing release checklist sections: " + ", ".join(missing))

          print(f"Release metadata consistent: {count} engine specs.")
          PY

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: chaos-survival-release-evidence-${{ github.sha }}
          path: release-evidence.md
          if-no-files-found: error
