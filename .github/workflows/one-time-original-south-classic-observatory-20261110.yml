name: One-time Original South Classic Observatory 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-original-south-classic-observatory-20261110.yml
      - tools/generate_original_south_classic_observatory.py
permissions:
  contents: read
concurrency:
  group: chaos-original-south-classic-observatory-20261110
  cancel-in-progress: false
jobs:
  source-gate:
    if: >-
      github.repository == 'dbrckk/chaos-survival-roblox' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify genuine Classic southern parabolic dishes and glTF
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_original_south_classic_observatory.py --output "$RUNNER_TEMP/classic.obj" > "$RUNNER_TEMP/classic.json"
          python3 tools/obj_to_gltf.py --source "$RUNNER_TEMP/classic.obj" --materials assets/source/chaos_route_kit.mtl --output "$RUNNER_TEMP/classic.gltf" > "$RUNNER_TEMP/orbital-gltf.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          obj=(root/'classic.obj').read_bytes()
          m=json.loads((root/'classic.json').read_text())
          g=json.loads((root/'classic.gltf').read_text())
          assert m['asset']=='south_classic_sculpted_observatory'
          assert hashlib.sha256(obj).hexdigest()==m['sha256']
          assert 160<=m['groups']<=512 and 4000<=m['triangles']<=16000
          palette={'ARMOR','BRUSHED','CARBON','GRIP','ALLOY','CERAMIC','SIGNAL'}
          assert set(m['materials'])==palette
          x,y,z=m['bounds']
          assert 18.35<=x<=19.05 and 16.5<=y<=17.1 and 5.00<=z<=5.35
          assert all(abs(v)<.5 for v in m['center'])
          for name in (b'OriginalForgedClassicTelemetryPlatform',
                       b'TwelveFacetSouthernRadarLoadPylon',
                       b'ConcaveReflectorClassicSouthTelescope',
                       b'ForgedRearDishShellClassicSouthTelescope',
                       b'FacetedOpticalReceiver',
                       b'ForgedClassicAxialServiceStay',
                       b'ThickTelescopeInterconnectChord',
                       b'BeveledClassicSouthObservationCockpit',
                       b'DeepCarbonOpticalGlassRecess'):
              assert name in obj,name
          assert g['asset']['version']=='2.0'
          assert {v['name'] for v in g['materials']}==palette
          prim=g['meshes'][0]['primitives']
          assert len(prim)==7
          assert sum(g['accessors'][v['attributes']['POSITION']]['count']//3 for v in prim)==m['triangles']
          assert all({'POSITION','NORMAL','TEXCOORD_0','TANGENT'}<=set(v['attributes']) for v in prim)
          buf=g['buffers'][0]
          assert len(base64.b64decode(buf['uri'].split(',',1)[1],validate=True))==buf['byteLength']
          source=Path('src/server/MapBuilder.lua').read_text()
          for name in ('"Foundation"','"FloorInset"',
                       '"WestRadarPylon"','"EastRadarPylon"',
                       '"WestRadarDish"','"EastRadarDish"',
                       '"WestReceiver"','"EastReceiver"',
                       '"WestServiceBrace"','"EastServiceBrace"',
                       '"ObservatoryBridge"','"ObservatoryCabin"',
                       '"ObservatoryGlass"'):
              assert name in source,name
          print('SOURCE PASS original South Classic observatory',m['triangles'],m['bounds'],m['sha256'])
          print('NO ROBLOX PLACE PUBLICATION')
          PY
  owner-import:
    needs: source-gate
    uses: ./.github/workflows/upload-original-3d-models.yml
    with:
      model: south_classic_sculpted_observatory
      creator_kind: user
      creator_id: '9774173158'
      dry_run: false
      confirmation: UPLOAD_CHAOS_ORIGINAL_3D
    secrets: inherit
